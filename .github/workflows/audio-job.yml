name: Lesson audio job (Durable, F0)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: hila-f0-synthesis-resource
  cancel-in-progress: false
jobs:
  audio-job:
    if: github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/audio-job ')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      COMMENT: ${{ github.event.comment.body }}
      PACKET_SHA256: ae94639852356b44cf440b72ad27eb26cafe51d5daf0ba545e7d2edb8ae0e101
      REQ_SHA256: 5e45a67753f02c80aebb667bfc9f9293263fca8033342deb210d65f8acc03fa9
    steps:
      - name: Parse comment (one line, strict whole-string match)
        shell: bash
        run: |
          set -euo pipefail
          re='^/audio-job (jfrog|squaredup) ([0-9a-f]{16}) ([a-z]+:[0-9]{2}(,[a-z]+:[0-9]{2})*)$'
          [[ "$COMMENT" =~ $re ]] || { echo COMMENT_REJECTED; exit 3; }
          { echo "JOB=${BASH_REMATCH[1]}"; echo "PLAN16=${BASH_REMATCH[2]}"; echo "HILA_SEGMENTS=${BASH_REMATCH[3]}"; } >> "$GITHUB_ENV"
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned age and rclone
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          curl --max-time 90 -fsSL -o "$RUNNER_TEMP/rc.zip" https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip
          echo '417e3da236f3a12d292da4e7287d67b1df558b8c2b280d092e563958ed724be7  '"$RUNNER_TEMP/rc.zip" | sha256sum -c -
          unzip -qj "$RUNNER_TEMP/rc.zip" '*/rclone' -d "$RUNNER_TEMP"
      - name: Fetch, decrypt and verify packet; hash-pinned install
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP"
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/packages/audio-packet-v13.tgz.age" > "$d/p.age"
          printf '%s' "$LAB_AGE_KEY" > "$d/k"
          age -d -i "$d/k" -o "$d/p.tgz" "$d/p.age"
          rm -f "$d/k"; unset LAB_AGE_KEY
          echo "$PACKET_SHA256  $d/p.tgz" | sha256sum -c -
          mkdir -p "$d/w" && tar -xzf "$d/p.tgz" -C "$d/w"
          echo "$REQ_SHA256  $d/w/pk/requirements-speech.txt" | sha256sum -c -
          python3 -m pip install --quiet --require-hashes --no-deps --only-binary :all: -r "$d/w/pk/requirements-speech.txt"
      - name: PRE-SPEND private MEGA write/read check (no Azure call yet)
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP"
          export RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER="$MEGA_EMAIL"
          export RCLONE_CONFIG_MEGA_PASS="$("$d/rclone" obscure "$MEGA_PASSWORD")"
          head -c 4096 /dev/urandom | base64 > "$d/probe.txt"
          D="mega:JFrog/Delpo-audio/run-$RUN_ID"
          "$d/rclone" copyto "$d/probe.txt" "$D/probe.txt" >/dev/null 2>&1 || { echo PRESPEND_MEGA_WRITE_FAILED; exit 8; }
          "$d/rclone" copyto "$D/probe.txt" "$d/probe.back" >/dev/null 2>&1 || { echo PRESPEND_MEGA_READ_FAILED; exit 9; }
          cmp "$d/probe.txt" "$d/probe.back" && echo PRESPEND_MEGA_OK
      - name: Run segment(s) through Durable path (all output to a private file)
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
          APPROVAL_WAMID: wamid.HBgMOTcyNTIyMjMzMjU3FQIAEhggQUM1RUYyMTQxOUREMEY0QjM1QTY2NENDREY1MzdCQ0YA
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          d="$RUNNER_TEMP"; cd "$d/w/pk"
          rid=$(az resource list --resource-type Microsoft.CognitiveServices/accounts --query "[?kind=='SpeechServices' && sku.name=='F0'].id" -o tsv 2>/dev/null)
          [ "$(printf '%s\n' "$rid" | grep -c .)" = 1 ] || { echo RESOURCE_NOT_UNIQUE; exit 4; }
          nm=$(az resource show --ids "$rid" --query name -o tsv 2>/dev/null); rg=$(printf '%s' "$rid" | sed -E 's#.*/resourceGroups/([^/]+)/.*#\1#')
          key=$(az cognitiveservices account keys list -g "$rg" -n "$nm" --query key1 -o tsv 2>/dev/null) || { echo KEY_FETCH_FAILED; exit 5; }
          [ -n "$key" ] || { echo KEY_EMPTY; exit 5; }
          echo "::add-mask::$key"
          export HILA_SPEECH_KEY="$key"; unset key
          printf '%s' "$LAB_AGE_KEY" > "$d/lab.key"; export LAB_AGE_KEY_FILE="$d/lab.key"; unset LAB_AGE_KEY
          export PLAN_SHA256="$(sha256sum "plan-$JOB.json" | cut -d' ' -f1)"
          [ "${PLAN_SHA256:0:16}" = "$PLAN16" ] || { echo PLAN_HASH_MISMATCH; exit 6; }
          python3 job_runner.py --plan "plan-$JOB.json" --out "$d/out" --freeze /dev/null > "$d/job.log" 2>&1
          rc=$?
          echo "RC=$rc" >> "$GITHUB_ENV"
          # scrub the Speech key while it is still available, then verify no key material remains in the private files
          if [ -n "${HILA_SPEECH_KEY:-}" ]; then
            find "$d/out" "$d/job.log" -type f -print0 2>/dev/null | xargs -0 -r python3 -c '
          import sys,os
          k=os.environ["HILA_SPEECH_KEY"].encode()
          for p in sys.argv[1:]:
              b=open(p,"rb").read()
              if k in b: open(p,"wb").write(b.replace(k,b"[SCRUBBED_KEY]"))
          '
            find "$d/out" "$d/job.log" -type f -print0 2>/dev/null | xargs -0 -r sed -i -E 's/([Kk]ey|[Ss]ubscription[-_ ]?[Kk]ey|Ocp-Apim-Subscription-Key)(=|: ?)[A-Za-z0-9]{20,}/\1\2[SCRUBBED]/g'
            if grep -rqaF -- "$HILA_SPEECH_KEY" "$d/out" "$d/job.log" 2>/dev/null; then echo SCRUB_VERIFY_FAILED; rm -rf "$d/out" "$d/job.log"; echo "RC=scrub_failed" >> "$GITHUB_ENV"; else echo SCRUB_VERIFIED_NO_KEY; fi
          fi
          rm -f "$d/lab.key"
          grep -E '^JOB_(OK|FAILED stage=[a-z]+ spend_possible=(True|False))$' "$d/job.log" || echo JOB_NO_MARKER
          exit 0
      - name: Encrypt scrubbed result to lab and review key (fallback artifact first)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP"
          test -d "$d/out"
          tar --sort=name -czf "$d/result.tgz" -C "$d" out job.log
          age -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$d/result.tgz.age" "$d/result.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-job-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/result.tgz.age
          retention-days: 7
          if-no-files-found: ignore
      - name: Export result to private MEGA and encrypted artifact bundle
        if: always()
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP"
          test -s "$d/result.tgz"
          S=$(sha256sum "$d/result.tgz" | cut -d' ' -f1)
          export RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER="$MEGA_EMAIL"
          export RCLONE_CONFIG_MEGA_PASS="$("$d/rclone" obscure "$MEGA_PASSWORD")"
          D="mega:JFrog/Delpo-audio/run-$RUN_ID"
          "$d/rclone" copyto "$d/result.tgz" "$D/result-$S.tgz" >/dev/null 2>&1 || { echo EXPORT_MEGA_UPLOAD_FAILED; exit 8; }
          "$d/rclone" copyto "$D/result-$S.tgz" "$d/result.back" >/dev/null 2>&1 || { echo EXPORT_MEGA_READBACK_FAILED; exit 9; }
          echo "$S  $d/result.back" | sha256sum -c - >/dev/null
          echo "EXPORT_MEGA_VERIFIED sha256=$S bytes=$(wc -c < "$d/result.back")"
      - name: Minimal public note (enum only)
        if: always()
        shell: bash
        run: |
          printf 'Audio job finished (exit %s). Run %s: private result copy stored.\n' "${RC:-unknown}" "$RUN_ID" > "$RUNNER_TEMP/note.txt"
          gh issue comment 2 --repo "$GH_REPO" --body-file "$RUNNER_TEMP/note.txt"
