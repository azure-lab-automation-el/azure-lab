name: esther-swa-domain
on:
  workflow_dispatch:
    inputs:
      hostname: { description: 'Custom hostname', required: true, default: 'www.estherdaxes.cloud-ip.cc' }
      remove: { description: 'Hostname to remove first (optional)', required: false, default: '' }
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-swa-domain__bind
      timeout: 20
      extra_env: |
        CID=${{ secrets[matrix.id] }}
        INPUT_HOSTNAME=${{ inputs.hostname }}
        INPUT_REMOVE=${{ inputs.remove }}
