name: lesson-archive-mega
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding the finished lesson files (e.g. lesson-jfrog-l4-l5)"
        required: true
      mega_path:
        description: "MEGA folder (e.g. JFrog/L4-L5)"
        required: true
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: lesson-archive-mega__upload
      timeout: 10
      azure_login: false
      extra_env: |
        INPUT_TAG=${{ inputs.tag }}
        INPUT_MEGA_PATH=${{ inputs.mega_path }}
