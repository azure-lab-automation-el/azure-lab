name: tofu-plan-azure
on:
  workflow_dispatch: {}
  push:
    paths: ['tofu/**', '.github/workflows/tofu-plan-azure.yml']
permissions: { id-token: write, contents: read }
env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: 'true'
  TF_VAR_admin_password: 'PLAN-ONLY-not-used-1!'
  TF_VAR_linux_ssh_public_key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJOWebEQVYCGnjP+9YUfVvqteUy8OiADXZ+KfYdhiBQX scom-linux-lab'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: התקנת OpenTofu
        run: |
          curl -fsSL -o /tmp/tofu.tgz https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.tar.gz
          tar xzf /tmp/tofu.tgz -C /tmp && sudo install -m755 /tmp/tofu /usr/local/bin/tofu
          tofu version
      - name: התקנת age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - name: ייבוא מצב קיים + plan (קריאה בלבד)
        run: |
          set +e
          {
            tofu -chdir=tofu/stacks/azure init -input=false -no-color
            bash tofu/import-azure.sh
            tofu -chdir=tofu/stacks/azure plan -input=false -no-color -detailed-exitcode -out=/dev/null
            echo "PLAN_EXIT=$?"
          } > "$RUNNER_TEMP/plan.log" 2>&1
          rc=$(grep -oE 'PLAN_EXIT=[0-9]+' "$RUNNER_TEMP/plan.log" | tail -1 | cut -d= -f2)
          adds=$(grep -c 'will be created' "$RUNNER_TEMP/plan.log")
          chg=$(grep -c 'will be updated in-place' "$RUNNER_TEMP/plan.log")
          ok=$(grep -c 'No changes' "$RUNNER_TEMP/plan.log")
          age -r age16ynqau96fypeawdgprafasdle3uja0qk0vzsz66w73ct0yk96ecsqncvnk -o "$RUNNER_TEMP/plan.log.age" "$RUNNER_TEMP/plan.log"
          shred -u "$RUNNER_TEMP/plan.log" 2>/dev/null || rm -f "$RUNNER_TEMP/plan.log"
          echo "== סיכום סטייה (drift): חדשים=$adds שינויים=$chg תואם=$([ "$ok" -gt 0 ] && echo כן || echo לא) =="
          if [ "$rc" = 0 ]; then echo "המודול תואם את המעבדה החיה (0 שינויים)"
          elif [ "$rc" = 2 ]; then echo "נמצאה סטייה - הפירוט המלא מוצפן בארטיפקט plan-log"
          else echo "ה-plan נכשל (קוד $rc) - הלוג המוצפן בארטיפקט plan-log"; fi
          exit 0
      - name: העלאת לוג plan מוצפן
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-log
          path: ${{ runner.temp }}/plan.log.age
          retention-days: 7
          if-no-files-found: ignore
