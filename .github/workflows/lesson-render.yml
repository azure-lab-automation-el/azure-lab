name: lesson-render
on:
  workflow_dispatch:
    inputs:
      src_tag: { description: 'Source: release tag, or mega:<path to inputs .tar>', required: true, default: 'mega:JFrog/L4-L5-rebuild/L4-L5-render-inputs.tar' }
      publish: { description: 'Upload bundles to out_tag release (false = speed/QA test only)', type: boolean, default: true }
      out_tag: { description: 'Release tag for finished bundles', required: true, default: 'lesson-jfrog-l4-l5' }
      whisper_model: { description: 'faster-whisper model for timing', required: false, default: 'medium' }
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - name: Decrypt payload
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        run: |
          printf '%s' "$LAB_AGE_KEY" > /tmp/age.key && chmod 600 /tmp/age.key
          age -d -i /tmp/age.key payload.tar.gz.age | tar xz
          shred -u /tmp/age.key 2>/dev/null || rm -f /tmp/age.key
      - name: Mask sensitive values
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "${{ vars.AZURE_CLIENT_ID }}" "${{ vars.AZURE_SUBSCRIPTION_ID }}" "${{ vars.AZURE_TENANT_ID }}" "${{ vars.ESTHER_PASSWORD_CLIENT_ID }}" "${{ vars.ESTHER_PORTAL_CLIENT_ID }}" "${{ vars.ESTHER_READ_CLIENT_ID }}" "${{ vars.ESTHER_WRITE_CLIENT_ID }}"; do mask "$v"; done
          grep -rhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\besther-[a-z0-9][a-z0-9-]*' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
      - name: Run
        env:
          INPUT_PUBLISH: "${{ inputs.publish }}"
          INPUT_WHISPER_MODEL: "${{ inputs.whisper_model }}"
          GH_TOKEN: "${{ github.token }}"
          WHISPER_MODEL: "${{ inputs.whisper_model }}"
          MEGA_EMAIL: "${{ secrets.MEGA_EMAIL }}"
          MEGA_PASSWORD: "${{ secrets.MEGA_PASSWORD }}"
          INPUT_SRC_TAG: "${{ inputs.src_tag }}"
          INPUT_OUT_TAG: "${{ inputs.out_tag }}"
        run: |
          set +e
          bash .lab-entry/lesson-render__render.sh > "$RUNNER_TEMP/lesson-render__render.log" 2>&1
          rc=$?
          age -r age16ynqau96fypeawdgprafasdle3uja0qk0vzsz66w73ct0yk96ecsqncvnk -o "$RUNNER_TEMP/lesson-render__render.log.age" "$RUNNER_TEMP/lesson-render__render.log"
          shred -u "$RUNNER_TEMP/lesson-render__render.log" 2>/dev/null || rm -f "$RUNNER_TEMP/lesson-render__render.log"
          if [ "$rc" -eq 0 ]; then echo "הסתיים בהצלחה (קוד 0)"; else echo "נכשל (קוד $rc) - הלוג המוצפן בארטיפקט log-lesson-render__render"; fi
          exit "$rc"
      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-lesson-render__render
          path: ${{ runner.temp }}/lesson-render__render.log.age
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lesson-qa
          path: qa
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: watchdog-diag
          path: diag/
          if-no-files-found: ignore
          retention-days: 3
