name: automation-setup
on:
  workflow_dispatch:
    inputs:
      stage: { type: choice, options: [read, aca-subnet-delete], default: read }
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: automation-setup__run
      extra_env: |
        INPUT_STAGE=${{ inputs.stage }}
