name: Focused permissions lesson
'on':
  workflow_dispatch:
    inputs:
      browser_url:
        required: false
        type: string
      package_path:
        required: false
        default: packages/lesson-v3.tar.gz.age
        type: string
      package_id:
        required: false
        default: 20260929-source-v3-capture-dsl
        type: string
      mode:
        required: false
        default: production
        type: choice
        options:
        - production
        - fixture
      rails:
        required: true
        default: all
        type: choice
        options:
        - all
        - validate
        - audio
        - capture
        - simulation
        - metric
        - discover
        - recipient-proof
        - browser
        - benchmark
permissions:
  contents: read
jobs:
  audio:
    if: inputs.rails == 'benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: hila-f0-synthesis-resource
      cancel-in-progress: false
    steps:
    - &id001
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - &id002
      run: 'sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age ffmpeg fonts-dejavu-core >/dev/null

        '
    - &id003
      env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'umask 077

        mkdir -p "$RUNNER_TEMP/e2e-code" "$RUNNER_TEMP/e2e-private"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/code.key"

        age -d -i "$RUNNER_TEMP/code.key" -o "$RUNNER_TEMP/source.tar.gz" pipeline/focused-lesson-source-v16.tar.gz.age

        rm "$RUNNER_TEMP/code.key"

        echo ''30a380a96cf51704f1c27935c2e7823feb25a5c16ca732c81ce67d72200b507c  ''"$RUNNER_TEMP/source.tar.gz" | sha256sum -c - >/dev/null

        tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/e2e-code"

        '
    - run: 'python3 -m pip install azure-cognitiveservices-speech numpy >/dev/null

        '
    - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        GH_TOKEN: ${{ github.token }}
        FOCUSED_MODE: audio
      run: 'set +e

        python3 "$RUNNER_TEMP/e2e-code/focused.py" > "$RUNNER_TEMP/e2e-private/log.txt" 2>&1

        rc=$?

        set -e

        printf ''%s'' "$rc" > "$RUNNER_TEMP/e2e-private/exit-code.txt"

        mkdir -p "$RUNNER_TEMP/delivery"

        cp "$RUNNER_TEMP/e2e-private/lesson.mp4" "$RUNNER_TEMP/e2e-private/audio-stage.json" "$RUNNER_TEMP/delivery/" 2>/dev/null || true

        cp "$RUNNER_TEMP/e2e-private/log.txt" "$RUNNER_TEMP/e2e-private/exit-code.txt" "$RUNNER_TEMP/delivery/"

        tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/delivery" .

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/result.tar.gz"

        split -b 700000 -d -a 3 "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/part-"

        for f in "$RUNNER_TEMP"/part-*;do suffix=${f##*-};jq -n --rawfile d "$f" ''{message:"Encrypted focused lesson evidence",content:($d|@base64),branch:"main"}'' > "$RUNNER_TEMP/put.json";gh api -X PUT "repos/${{ github.repository }}/contents/packages/focused-${{ github.run_id }}-audio-$suffix.age" --input "$RUNNER_TEMP/put.json" >/dev/null;done

        exit "$rc"

        '
  qa:
    needs: audio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        section:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
    steps:
    - *id001
    - *id002
    - *id003
    - run: 'python3 -m pip install faster-whisper scipy huggingface_hub numpy >/dev/null

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        GH_TOKEN: ${{ github.token }}
        FOCUSED_MODE: qa
        SECTION_INDEX: ${{ matrix.section }}
      run: 'set +e

        python3 "$RUNNER_TEMP/e2e-code/focused.py" > "$RUNNER_TEMP/e2e-private/log.txt" 2>&1

        rc=$?

        set -e

        printf ''%s'' "$rc" > "$RUNNER_TEMP/e2e-private/exit-code.txt"

        mkdir -p "$RUNNER_TEMP/delivery"

        cp "$RUNNER_TEMP/e2e-private/lesson.mp4" "$RUNNER_TEMP/e2e-private/qa-stage.json" "$RUNNER_TEMP/delivery/" 2>/dev/null || true

        cp "$RUNNER_TEMP/e2e-private/log.txt" "$RUNNER_TEMP/e2e-private/exit-code.txt" "$RUNNER_TEMP/delivery/"

        tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/delivery" .

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/result.tar.gz"

        split -b 700000 -d -a 3 "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/part-"

        for f in "$RUNNER_TEMP"/part-*;do suffix=${f##*-};jq -n --rawfile d "$f" ''{message:"Encrypted focused lesson evidence",content:($d|@base64),branch:"main"}'' > "$RUNNER_TEMP/put.json";gh api -X PUT "repos/${{ github.repository }}/contents/packages/focused-${{ github.run_id }}-qa-${{ matrix.section }}-$suffix.age" --input "$RUNNER_TEMP/put.json" >/dev/null;done

        exit "$rc"

        '
  render:
    needs: audio
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
    - *id001
    - *id002
    - *id003
    - run: 'python3 -m pip install Pillow >/dev/null

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        GH_TOKEN: ${{ github.token }}
      run: 'set +e

        python3 "$RUNNER_TEMP/e2e-code/render.py" > "$RUNNER_TEMP/e2e-private/log.txt" 2>&1

        rc=$?

        set -e

        printf ''%s'' "$rc" > "$RUNNER_TEMP/e2e-private/exit-code.txt"

        mkdir -p "$RUNNER_TEMP/delivery"

        cp "$RUNNER_TEMP/e2e-private/lesson.mp4" "$RUNNER_TEMP/e2e-private/focused-proof.json" "$RUNNER_TEMP/delivery/" 2>/dev/null || true

        cp "$RUNNER_TEMP/e2e-private/log.txt" "$RUNNER_TEMP/e2e-private/exit-code.txt" "$RUNNER_TEMP/delivery/"

        tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/delivery" .

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/result.tar.gz"

        split -b 700000 -d -a 3 "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/part-"

        for f in "$RUNNER_TEMP"/part-*;do suffix=${f##*-};jq -n --rawfile d "$f" ''{message:"Encrypted focused lesson evidence",content:($d|@base64),branch:"main"}'' > "$RUNNER_TEMP/put.json";gh api -X PUT "repos/${{ github.repository }}/contents/packages/focused-${{ github.run_id }}-render-$suffix.age" --input "$RUNNER_TEMP/put.json" >/dev/null;done

        exit "$rc"

        '
