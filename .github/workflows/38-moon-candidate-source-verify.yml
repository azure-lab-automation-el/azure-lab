name: 38 - verify Moon gate private source backup only
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read back and hash private source, without printing it
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MEGA_EMAIL" && test -n "$MEGA_PASSWORD"
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip
          unzip -qj /tmp/rc.zip '*/rclone' -d /tmp
          export RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER="$MEGA_EMAIL"
          export RCLONE_CONFIG_MEGA_PASS="$(/tmp/rclone obscure "$MEGA_PASSWORD")"
          /tmp/rclone copyto 'mega:JFrog/L7-2026-09-28/source/1-1-21-moon-candidate-gate-source-20260929.tar.gz' /tmp/moon-candidate-source.tar.gz >/tmp/private-transfer.log 2>&1
          printf '%s  %s\n' '138eb2c2b6e8ca3b9a746239835cb1b09c88de58fe4e2789f27f790bf012ea94' /tmp/moon-candidate-source.tar.gz | sha256sum -c - >/dev/null
          tar -tzf /tmp/moon-candidate-source.tar.gz >/dev/null
          echo MOON_CANDIDATE_SOURCE_BACKUP_BYTE_VERIFIED
