name: jfrog-oss-record
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: scenario script under scripts/jfrog-rec/ (without .mjs)
        default: tour-oss
      force:
        description: re-record even if the scenario, seed and workflow are unchanged
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: jfrog-oss-record__record
      timeout: 32
      azure_login: false
      extra_env: |
        INPUT_FORCE=${{ inputs.force }}
        INPUT_SCENARIO=${{ inputs.scenario }}
