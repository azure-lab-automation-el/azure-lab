name: esther-media-stage
on:
  workflow_dispatch:
    inputs:
      url: { description: 'Direct Microsoft download URL', required: true }
      name: { description: 'Blob name', required: true }
      media_account: { description: 'Storage account', required: true, default: 'estherlabmedia8c8c3c92' }
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-media-stage__stage
      timeout: 30
      extra_env: |
        INPUT_URL=${{ inputs.url }}
        INPUT_NAME=${{ inputs.name }}
        INPUT_MEDIA_ACCOUNT=${{ inputs.media_account }}
