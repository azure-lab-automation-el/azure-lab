name: Focused permissions lesson
'on':
  workflow_dispatch:
    inputs:
      browser_url:
        required: false
        type: string
      package_path:
        required: false
        default: packages/lesson-v3.tar.gz.age
        type: string
      package_id:
        required: false
        default: 20260929-source-v3-capture-dsl
        type: string
      mode:
        required: false
        default: production
        type: choice
        options:
        - production
        - fixture
      rails:
        required: true
        default: all
        type: choice
        options:
        - all
        - validate
        - audio
        - capture
        - simulation
        - metric
        - discover
        - recipient-proof
        - browser
        - benchmark
permissions:
  contents: read
jobs:
  metric:
    if: inputs.rails == 'metric'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: 'set -euo pipefail

        curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz

        echo ''cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ''"$RUNNER_TEMP/age.tgz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

        '
    - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - env:
        GH_TOKEN: ${{ github.token }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: 'set -euo pipefail

        umask 077

        p="$RUNNER_TEMP/metric";mkdir -p "$p"

        active=$(az account show --query id -o tsv)

        test "$active" = "$AZURE_SUBSCRIPTION_ID"

        az resource list --resource-type Microsoft.CognitiveServices/accounts --query "[?kind==''SpeechServices'' && sku.name==''F0''].{id:id,name:name,location:location,sku:sku.name}" -o json > "$p/resource.json"

        python3 - "$p/resource.json" > "$p/id" <<''CHECK''

        import json,sys

        r=json.load(open(sys.argv[1]));assert len(r)==1;print(r[0][''id''])

        CHECK

        rid=$(cat "$p/id")

        az monitor metrics list --resource "$rid" --metric SynthesizedCharacters --start-time "$(date -u +%Y-%m-01T00:00:00Z)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --interval PT1H --aggregation Total -o json > "$p/usage.json"

        az rest --method get --url "https://management.azure.com$rid/usages?api-version=2023-05-01" > "$p/allowances.json" 2> "$p/allowances-error.txt" || true

        gh api "repos/$GITHUB_REPOSITORY/contents/packages/hila-f0-quota-ledger.age" --jq .content | base64 -d > "$p/ledger.age"

        printf ''%s'' "$LAB_AGE_KEY" > "$p/key"

        age -d -i "$p/key" -o "$p/ledger.json" "$p/ledger.age"

        rm "$p/key" "$p/id"

        date -u +%Y-%m-%dT%H:%M:%SZ > "$p/checked-at.txt"

        tar -czf "$RUNNER_TEMP/metric.tar.gz" -C "$p" .

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/metric.age" "$RUNNER_TEMP/metric.tar.gz"

        jq -n --rawfile d "$RUNNER_TEMP/metric.age" ''{message:"Encrypted live F0 usage and conservative ledger read",content:($d|@base64),branch:"main"}'' > "$RUNNER_TEMP/put.json"

        gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/packages/oct1-metric-${{ github.run_id }}.age" --input "$RUNNER_TEMP/put.json" >/dev/null

        '
