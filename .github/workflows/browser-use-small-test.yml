{"name":"Synthetic Browser Use Llama32 3B trial","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"browser-use":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/browser-use-small-test'","runs-on":"ubuntu-24.04","timeout-minutes":45,"permissions":{"contents":"write","issues":"read"},"steps":[{"name":"Pinned public tools and encrypted source retrieval","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tar.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/age.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tar.gz\" -C \"$w\"\nmkdir -p \"$RUNNER_TEMP/age\";cp -r \"$w/age\" \"$RUNNER_TEMP/age/age\"\npython3 - \"$w\" <<'PARTS'\nimport json,hashlib,base64,pathlib,subprocess,sys\np=pathlib.Path(sys.argv[1]);parts=[{'path': 'packages/bu-small-source-v1-part-01.age', 'sha256': '8f30165c1f539d73e7f799139445c82f1fd0789dc2d8cc1445311c4b3d6309e5', 'bytes': 20000}, {'path': 'packages/bu-small-source-v1-part-02.age', 'sha256': 'b40e7293c761083f05dfd15820e14d1e48f627b326f552cea3a09e70cd6b624f', 'bytes': 20000}, {'path': 'packages/bu-small-source-v1-part-03.age', 'sha256': 'c04d3abc3575063135e100a4568bd4ef7f4f0e60ec5068cf7c121d9e27ce8957', 'bytes': 20000}, {'path': 'packages/bu-small-source-v1-part-04.age', 'sha256': 'babcd5eb2f8e2c78c73b6df16ca3a299bdbaa5da7b277c7bac5f879e9139ce7b', 'bytes': 20000}, {'path': 'packages/bu-small-source-v1-part-05.age', 'sha256': '2d406ee8d801de650cdd457301f746bbe3b7c37d13ea58058f6eaf529d084768', 'bytes': 20000}, {'path': 'packages/bu-sm