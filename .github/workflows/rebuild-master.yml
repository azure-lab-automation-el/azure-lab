name: rebuild-master
on:
  workflow_dispatch:
    inputs:
      until:
        type: choice
        options: [all, base, dc, join, sql, prereq, scom, linux]
        default: all
        description: 'checkpoint: stop after this stage'
      media_account:
        default: estherlabmedia8c8c3c92
        description: 'storage account for install media (created if missing)'
permissions: { id-token: write, contents: write }
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - name: מיסוך מזהים
        env:
          M1: "${{ secrets.AZURE_CLIENT_ID }}"
          M2: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ secrets.AZURE_TENANT_ID }}"
          M4: "${{ secrets.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ secrets.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ secrets.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ secrets.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Decrypt payload
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        run: |
          printf '%s' "$LAB_AGE_KEY" > /tmp/age.key && chmod 600 /tmp/age.key
          age -d -i /tmp/age.key payload.tar.gz.age | tar xz
          shred -u /tmp/age.key 2>/dev/null || rm -f /tmp/age.key
      - name: Mask sensitive values
        env:
          M1: "${{ secrets.AZURE_CLIENT_ID }}"
          M2: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ secrets.AZURE_TENANT_ID }}"
          M4: "${{ secrets.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ secrets.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ secrets.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ secrets.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
          grep -rhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\besther-[a-z0-9][a-z0-9-]*' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
      - name: Run
        env:
          INPUT_UNTIL: "${{ inputs.until }}"
          INPUT_MEDIA_ACCOUNT: "${{ inputs.media_account }}"
          AZURE_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ESTHER_VM_ADMIN_PASSWORD: "${{ secrets.ESTHER_VM_ADMIN_PASSWORD }}"
          ESTHER_DSRM_PASSWORD: "${{ secrets.ESTHER_DSRM_PASSWORD }}"
          ESTHER_SCOM_SVC_PASSWORD: "${{ secrets.ESTHER_SCOM_SVC_PASSWORD }}"
          GH_TOKEN: "${{ github.token }}"
          MEDIA_ACCOUNT: "${{ inputs.media_account }}"
        run: |
          set +e
          bash .lab-entry/rebuild-master__media.sh > "$RUNNER_TEMP/rebuild-master__media.log" 2>&1
          rc=$?
          age -r age16ynqau96fypeawdgprafasdle3uja0qk0vzsz66w73ct0yk96ecsqncvnk -o "$RUNNER_TEMP/rebuild-master__media.log.age" "$RUNNER_TEMP/rebuild-master__media.log"
          shred -u "$RUNNER_TEMP/rebuild-master__media.log" 2>/dev/null || rm -f "$RUNNER_TEMP/rebuild-master__media.log"
          if [ "$rc" -eq 0 ]; then echo "הסתיים בהצלחה (קוד 0)"; else echo "נכשל (קוד $rc) - הלוג המוצפן בארטיפקט log-rebuild-master__media"; fi
          exit "$rc"
      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-rebuild-master__media
          path: ${{ runner.temp }}/rebuild-master__media.log.age
