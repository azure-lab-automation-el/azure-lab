name: esther-linux-sweden
on:
  workflow_dispatch:
    inputs:
      rotate_key: { type: boolean, default: false, description: 'scom-agent-winrm: make a fresh scxmon SSH key' }
      stage: { type: choice, options: [policy, network, vm, scom-probe, scom-unstick, winrm-probe, winrm-unstick, winrm-inspect, scom-agent-winrm, scom-status, ui-prep, ui-shot, ui-grab, omi-check, ssh-check, ssh-fix, swap-add, scom-inventory, dc-unstick, scx-cert-fix, netperf], default: policy }
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-linux-sweden__run
      timeout: 25
      extra_env: |
        INPUT_STAGE=${{ inputs.stage }}
        INPUT_ROTATE_KEY=${{ inputs.rotate_key }}
