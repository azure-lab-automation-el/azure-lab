name: _lab-job
on:
  workflow_call:
    inputs:
      entry:
        type: string
        required: true
        description: 'lab-entry script name (without .sh)'
      timeout:
        type: number
        default: 15
      azure_login:
        type: boolean
        default: true
      media_account:
        type: string
        default: estherlabmedia8c8c3c92
      extra_env:
        type: string
        default: ''
        description: 'multiline KEY=VALUE exports for the entry (inputs/literals only, never secrets)'
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - name: מיסוך מזהים
        env:
          M1: "${{ secrets.AZURE_CLIENT_ID }}"
          M2: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ secrets.AZURE_TENANT_ID }}"
          M4: "${{ secrets.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ secrets.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ secrets.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ secrets.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
      - if: inputs.azure_login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Decrypt payload
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        run: |
          printf '%s' "$LAB_AGE_KEY" > /tmp/age.key && chmod 600 /tmp/age.key
          age -d -i /tmp/age.key payload.tar.gz.age | tar xz
          shred -u /tmp/age.key 2>/dev/null || rm -f /tmp/age.key
      - name: Mask sensitive values
        env:
          M1: "${{ secrets.AZURE_CLIENT_ID }}"
          M2: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ secrets.AZURE_TENANT_ID }}"
          M4: "${{ secrets.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ secrets.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ secrets.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ secrets.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
          grep -rhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\besther-[a-z0-9][a-z0-9-]*' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
      - name: Run
        env:
          ENTRY: "${{ inputs.entry }}"
          EXTRA_ENV: "${{ inputs.extra_env }}"
          MEDIA_ACCOUNT: "${{ inputs.media_account }}"
          GH_TOKEN: "${{ github.token }}"
          AZURE_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
          AZURE_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
          ESTHER_VM_ADMIN_PASSWORD: "${{ secrets.ESTHER_VM_ADMIN_PASSWORD }}"
          ESTHER_DSRM_PASSWORD: "${{ secrets.ESTHER_DSRM_PASSWORD }}"
          ESTHER_SCOM_SVC_PASSWORD: "${{ secrets.ESTHER_SCOM_SVC_PASSWORD }}"
          ESTHER_PORTAL_CLIENT_ID: "${{ secrets.ESTHER_PORTAL_CLIENT_ID }}"
          ESTHER_REQUEST_TOKEN: "${{ secrets.ESTHER_REQUEST_TOKEN }}"
          ESTHER_METRICS_KEY: "${{ secrets.ESTHER_METRICS_KEY }}"
          ESTHER_INIT_PW: "${{ secrets.ESTHER_INIT_PW }}"
          MEGA_EMAIL: "${{ secrets.MEGA_EMAIL }}"
          MEGA_PASSWORD: "${{ secrets.MEGA_PASSWORD }}"
          CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
          CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}"
          GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
          COPILOT_GITHUB_TOKEN: "${{ secrets.COPILOT_GITHUB_TOKEN }}"
          LAB_AGENT_PAT: "${{ secrets.LAB_AGENT_PAT }}"
          LINUX_SCX_SSH_KEY: "${{ secrets.LINUX_SCX_SSH_KEY }}"
          LINUX_SCX_PASSWORD: "${{ secrets.LINUX_SCX_PASSWORD }}"
          LINUX_SCX_PPK_B64: "${{ secrets.LINUX_SCX_PPK_B64 }}"
        run: |
          set +e
          while IFS= read -r kv; do [ -n "$kv" ] && export "$kv"; done <<< "$EXTRA_ENV"
          bash ".lab-entry/${ENTRY}.sh" > "$RUNNER_TEMP/${ENTRY}.log" 2>&1
          rc=$?
          age -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -o "$RUNNER_TEMP/${ENTRY}.log.age" "$RUNNER_TEMP/${ENTRY}.log"
          shred -u "$RUNNER_TEMP/${ENTRY}.log" 2>/dev/null || rm -f "$RUNNER_TEMP/${ENTRY}.log"
          if [ "$rc" -eq 0 ]; then echo "הסתיים בהצלחה (קוד 0)"; else echo "נכשל (קוד $rc) - הלוג המוצפן בארטיפקט log-${ENTRY}"; fi
          exit "$rc"
      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ inputs.entry }}
          path: ${{ runner.temp }}/${{ inputs.entry }}.log.age
          retention-days: 7
          if-no-files-found: ignore
