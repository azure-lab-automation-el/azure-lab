name: mivtza-eser
run-name: "${{ inputs.dryrun && '⚠️ DRY-RUN ONLY - לא נבנה ולא נמחק כלום' || format('מבצע עשר - בילד אמת #{0}', github.run_number) }}"
on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: true
        description: 'אמת בלבד (ברירת מחדל) - לא יוצר כלום'
      build_sku:
        type: choice
        options: [standard_b2as_v2, standard_b4as_v2]
        default: standard_b2as_v2
        description: 'מידת בנייה (מכווצת ל-B2 בסגירה)'
      lab_location:
        type: choice
        options: [israelcentral, swedencentral]
        default: israelcentral
      lab_prefix:
        default: esther
      target:
        type: choice
        options: [all, dc, scom]
        default: all
        description: 'dc = בניית DC בלבד; scom = איטרציית SCOM בלבד על DC חי (דיבאג)'
      keep:
        type: boolean
        default: false
        description: 'מצב דיבאג: להשאיר DC+מדיה חיים בסיום (אסור בריצות אמת קרות)'
      mon_timeout:
        type: number
        default: 60
permissions: { id-token: write, contents: write }
# כלל קבוע: לעולם לא לבטל ריצה באמצע teardown/מחיקה (מניעת הקצאות רפאים במכסה)
concurrency:
  group: mivtza-eser
  cancel-in-progress: false
jobs:
  prestatus:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: mivtza-eser__prestatus
      timeout: 5
  teardown:
    if: inputs.dryrun == false
    needs: [prestatus]
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: mivtza-eser__teardown
      timeout: 25
      media_account: ${{ inputs.keep && 'esthermdbg' || format('estherm{0}', github.run_number) }}
      extra_env: |
        TARGET=${{ inputs.target }}
  create:
    needs: [prestatus, teardown]
    if: inputs.dryrun == true || needs.teardown.result == 'success'
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: mivtza-eser__create
      timeout: 25
      extra_env: |
        DRYRUN=${{ inputs.dryrun }}
        BUILD_SKU=${{ inputs.build_sku }}
        LAB_LOCATION=${{ inputs.lab_location }}
        LAB_PREFIX=${{ inputs.lab_prefix }}
        TARGET=${{ inputs.target }}
  media:
    if: inputs.dryrun == false
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: mivtza-eser__media
      timeout: 50
      media_account: ${{ inputs.keep && 'esthermdbg' || format('estherm{0}', github.run_number) }}
      extra_env: |
        LAB_LOCATION=${{ inputs.lab_location }}
  secrets:
    if: inputs.dryrun == false
    needs: [create, media]
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: mivtza-eser__secrets
      timeout: 15
      media_account: ${{ inputs.keep && 'esthermdbg' || format('estherm{0}', github.run_number) }}
      extra_env: |
        LAB_PREFIX=${{ inputs.lab_prefix }}
        TARGET=${{ inputs.target }}
  monitor:
    if: inputs.dryrun == false
    needs: [secrets]
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: mivtza-eser__monitor
      timeout: 65
      media_account: ${{ inputs.keep && 'esthermdbg' || format('estherm{0}', github.run_number) }}
      extra_env: |
        MON_TIMEOUT_MIN=${{ inputs.mon_timeout }}
        TARGET=${{ inputs.target }}
  finalize:
    if: always() && inputs.dryrun == false && needs.create.result != 'cancelled'
    needs: [create, secrets, monitor]
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: mivtza-eser__finalize
      timeout: 25
      media_account: ${{ inputs.keep && 'esthermdbg' || format('estherm{0}', github.run_number) }}
      extra_env: |
        MODE=${{ needs.monitor.result == 'success' && 'success' || 'abort' }}
        LAB_PREFIX=${{ inputs.lab_prefix }}
        KEEP=${{ inputs.keep && 1 || 0 }}
