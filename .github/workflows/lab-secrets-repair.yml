name: lab-secrets-repair
on:
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: התקנת age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - name: מיסוך מזהים
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "${{ vars.AZURE_CLIENT_ID }}" "${{ vars.AZURE_SUBSCRIPTION_ID }}" "${{ vars.AZURE_TENANT_ID }}"; do mask "$v"; done
      - name: התחברות ל-Azure
        uses: azure/login@v2
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: מיסוך ערכים רגישים
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "${{ vars.AZURE_CLIENT_ID }}" "${{ vars.AZURE_SUBSCRIPTION_ID }}" "${{ vars.AZURE_TENANT_ID }}"; do mask "$v"; done
      - name: הרצה
        env:
          GH_TOKEN: "${{ secrets.LAB_AGENT_PAT }}"
          CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
        run: |
          set +e
          bash -c '
            set +e
            echo "== Azure login check =="
            if az account show -o none 2>/dev/null; then
              echo "== SWA deploy token =="
              az account list --query '[].{name:name,id:id,isDefault:isDefault}' -o json
              echo "== SWA inventory =="
              az staticwebapp list --query '[].{name:name,rg:resourceGroup}' -o json
              echo "== token attempt =="
              az staticwebapp secrets list -n esther-cloud-admin -g rg-learning-monitoring --query properties.apiKey -o tsv
              TOK=$(az staticwebapp secrets list -n esther-cloud-admin -g rg-learning-monitoring --query properties.apiKey -o tsv 2>/dev/null)
              if [ -n "$TOK" ]; then
                gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN --body "$TOK" && echo "SWA token stored"
              else
                echo "SWA token fetch failed"
              fi
            else
              echo "AZURE_LOGIN_FAILED - federation subject likely does not cover repo azure-lab"
            fi
            echo "== CF account id =="
            ACCT=$(curl -sS https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $CF_API_TOKEN" | jq -r ".result[0].id // empty")
            if [ -n "$ACCT" ]; then
              gh secret set CF_ACCOUNT_ID --body "$ACCT" && echo "CF account id stored"
            else
              echo "CF account id fetch failed"
            fi
          ' > "$RUNNER_TEMP/lab-secrets-repair__repair.log" 2>&1
          rc=$?
          age -r age16ynqau96fypeawdgprafasdle3uja0qk0vzsz66w73ct0yk96ecsqncvnk -o "$RUNNER_TEMP/lab-secrets-repair__repair.log.age" "$RUNNER_TEMP/lab-secrets-repair__repair.log"
          shred -u "$RUNNER_TEMP/lab-secrets-repair__repair.log" 2>/dev/null || rm -f "$RUNNER_TEMP/lab-secrets-repair__repair.log"
          if [ "$rc" -eq 0 ]; then echo "הסתיים בהצלחה (קוד 0)"; else echo "נכשל (קוד $rc) - הלוג המוצפן בארטיפקט log-lab-secrets-repair__repair"; fi
          exit "$rc"
      - name: העלאת לוג מוצפן
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-lab-secrets-repair__repair
          path: ${{ runner.temp }}/lab-secrets-repair__repair.log.age
          retention-days: 7
          if-no-files-found: ignore
