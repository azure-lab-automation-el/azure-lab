{"name":"Lesson ChatOps audio","on":{"issue_comment":{"types":["created"]}},"permissions":{"contents":"read"},"jobs":{"audio-read":{"if":"github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/audio-read'","runs-on":"ubuntu-24.04","timeout-minutes":6,"permissions":{"contents":"read","id-token":"write","issues":"write"},"steps":[{"uses":"azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c","with":{"client-id":"${{ secrets.AZURE_CLIENT_ID }}","tenant-id":"${{ secrets.AZURE_TENANT_ID }}","subscription-id":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}},{"name":"Read only Azure Speech resource SKU and state","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}"},"run":"set -euo pipefail\naz cognitiveservices account list --query \"[?kind=='SpeechServices'].{k:kind,s:sku.name,l:location,p:properties.provisioningState,n:name}\" -o json > \"$RUNNER_TEMP/speech.json\"\npython3 - \"$RUNNER_TEMP\" <<'PYSP'\nimport json,pathlib,sys,re,hashlib\np=pathlib.Path(sys.argv[1]);d=json.load(open(p/'speech.json'));lines=['Read-only Azure Speech resource probe. Nothing was created or changed; no synthesis call was made.','speech_accounts='+str(len(d))]\nok=lambda v:v if re.fullmatch(r'[A-Za-z0-9_.-]{1,60}',str(v)) else 'unverified'\nfor i,x in enumerate(d):\n    lines.append(f'account{i}: kind={ok(x.get(\"k\"))} sku={ok(x.get(\"s\"))} location={ok(x.get(\"l\"))} state={ok(x.get(\"p\"))} name_sha256_prefix={hashlib.sha256(str(x.get(\"n\")).encode()).hexdigest()[:10]}')\nlines.append('Monthly free-tier character counter is NOT readable here: it lives in the private pipeline script. Reset date not proven.')\n(p/'speech-safe.txt').write_text('\\n'.join(lines)+'\\n')\nPYSP\ngh issue comment 2 --repo \"$GH_REPO\" --body-file \"$RUNNER_TEMP/speech-safe.txt\"\nwhile IFS= read -r line; do printf '::notice title=Azure Speech read-only probe::%s\\n' \"$line\"; done < \"$RUNNER_TEMP/speech-safe.txt\"\n"}]},"audio-quota":{"if":"github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/audio-quota'","runs-on":"ubuntu-24.04","timeout-minutes":6,"permissions":{"contents":"write","id-token":"write","issues":"write"},"steps":[{"uses":"azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c","with":{"client-id":"${{ secrets.AZURE_CLIENT_ID }}","tenant-id":"${{ secrets.AZURE_TENANT_ID }}","subscription-id":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}},{"name":"Install pinned age","run":"set -euo pipefail\ncurl --max-time 90 -fsSL -o \"$RUNNER_TEMP/age.tgz\" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz\necho 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '\"$RUNNER_TEMP/age.tgz\" | sha256sum -c -\ntar -xzf \"$RUNNER_TEMP/age.tgz\" -C \"$RUNNER_TEMP\"\necho \"$RUNNER_TEMP/age\" >> \"$GITHUB_PATH\"\n"},{"name":"Read Azure Speech F0 usage metric","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}"},"run":"set -euo pipefail\numask 077\nrid=$(az resource list --resource-type Microsoft.CognitiveServices/accounts --query \"[?kind=='SpeechServices' && sku.name=='F0'].id\" -o tsv)\ntest \"$(printf '%s\\n' \"$rid\" | grep -c .)\" = 1\naz monitor metrics list --resource \"$rid\" --metric SynthesizedCharacters --start-time \"$(date -u +%Y-%m-01T00:00:00Z)\" --end-time \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" --interval PT1H --aggregation Total -o json > \"$RUNNER_TEMP/m.json\"\naz rest --method get --url \"https://management.azure.com$rid/usages?api-version=2023-05-01\" > \"$RUNNER_TEMP/u.json\" 2> /dev/null || echo '{\"value\":[]}' > \"$RUNNER_TEMP/u.json\"\ndate -u +%Y-%m-%dT%H:%M:%SZ > \"$RUNNER_TEMP/checked-at.txt\"\ngh api \"repos/$GH_REPO/contents/packages/hila-f0-quota-ledger.age\" --jq .content | base64 -d > \"$RUNNER_TEMP/ledger.age\"\n"},{"name":"Decrypt ledger, validate, encrypt result","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nd=\"$RUNNER_TEMP\"\ntrap 'rm -f \"$d/k\" \"$d/ledger.json\" \"$d/result.json\" \"$d/result.tar.gz\"' EXIT\nprintf '%s' \"$LAB_AGE_KEY\" > \"$d/k\"\nage -d -i \"$d/k\" -o \"$d/ledger.json\" \"$d/ledger.age\"\nrm -f \"$d/k\"\nunset LAB_AGE_KEY\npython3 - \"$d\" <<'PYQ'\nimport json,pathlib,sys,re\np=pathlib.Path(sys.argv[1]);m=json.load(open(p/'m.json'));u=json.load(open(p/'u.json'));LG=json.load(open(p/'ledger.json'))\ntot=0;last=None\nfor s in m['value'][0]['timeseries']:\n    for x in s.get('data',[]):\n        tot+=x.get('total') or 0\n        if x.get('total'): last=x['timeStamp']\ndef num(v):\n    return int(v) if isinstance(v,(int,float)) and not isinstance(v,bool) and 0<=v<=10**9 else 'unverified'\ndef boo(v): return v if isinstance(v,bool) else 'unverified'\ndef iso(v): return v if isinstance(v,str) and re.fullmatch(r'[0-9T:.+\\-Z]{10,40}',v) else 'unverified'\nenum=lambda v:v if v in ('UNVERIFIED_NEVER_RESET','VERIFIED_MONTHLY','PROVIDER_CONFIRMED') else 'unverified'\nout={'checked_at_utc':iso((p/'checked-at.txt').read_text().strip()),'metric_month_to_date_total':num(tot),'last_nonzero_hour':iso(last) if last else None,'usages_entries':num(len(u.get('value',[]))),\n 'ledger':{k:num(LG.get(k)) for k in ('conservative_used_characters','free_limit','reserve','carried_upper_bound','live_metric_characters')}}\nout['ledger'].update({k:boo(LG.get(k)) for k in ('baseline_verified','unresolved_submission')});out['ledger']['allowance_reset']=enum(LG.get('allowance_reset'));out['ledger']['baseline_queried_at']=iso(LG.get('baseline_queried_at'))\n(p/'result.json').write_text(json.dumps(out,indent=1))\nPYQ\nrm -f \"$d/ledger.json\"\ntar -czf \"$d/result.tar.gz\" -C \"$d\" result.json\nage -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o \"$d/result.age\" \"$d/result.tar.gz\"\n"},{"name":"Publish encrypted result and minimal note","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}","RUN_ID":"${{ github.run_id }}"},"run":"set -euo pipefail\nd=\"$RUNNER_TEMP\"\njq -n --rawfile c \"$d/result.age\" '{message:\"Encrypted audio quota result\",content:($c|@base64),branch:\"main\"}' > \"$d/put.json\"\ngh api -X PUT \"repos/$GH_REPO/contents/packages/audio-quota-$RUN_ID.age\" --input \"$d/put.json\" >/dev/null\nprintf 'Read-only audio quota probe finished. Encrypted result: packages/audio-quota-%s.age. No synthesis, nothing changed.\\n' \"$RUN_ID\" > \"$d/note.txt\"\ngh issue comment 2 --repo \"$GH_REPO\" --body-file \"$d/note.txt\"\n"}],"concurrency":{"group":"hila-f0-synthesis-resource","cancel-in-progress":false}}}}