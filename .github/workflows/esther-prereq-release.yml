name: esther-prereq-release
run-name: "SCOM prereq installers -> GitHub release scom-prereqs"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: download + verify + publish prereq MSIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o ReportViewer.msi "https://download.microsoft.com/download/A/1/2/A129F694-233C-4C7C-860F-F73139CF2E01/ENU/x86/ReportViewer.msi"
          curl -fsSL --retry 3 -o SQLSysClrTypes.msi "https://download.microsoft.com/download/1/3/0/13089488-91fc-4e22-ad68-5be58bd5c014/ENU/x64/SQLSysClrTypes.msi"
          for f in ReportViewer.msi SQLSysClrTypes.msi; do
            sz=$(stat -c%s "$f"); echo "$f: $sz bytes"
            [ "$sz" -gt 1000000 ] || { echo "❌ $f too small - bad download"; exit 1; }
          done
          gh release delete scom-prereqs --yes --cleanup-tag 2>/dev/null || true
          gh release create scom-prereqs --title "SCOM prereq installers" --notes "Report Viewer 2015 + CLR Types SQL2014 x64 (SCOM OMConsole prereqs)" ReportViewer.msi SQLSysClrTypes.msi
          echo "RELEASE_OK"
