{"name":"Synthetic MCP direct control","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"mcp-control":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/advanced-control'","runs-on":"ubuntu-24.04","timeout-minutes":30,"permissions":{"contents":"write","issues":"read"},"steps":[{"name":"Pinned public tools and encrypted source retrieval","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tar.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/age.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tar.gz\" -C \"$w\"\nmkdir -p \"$RUNNER_TEMP/age\";cp -r \"$w/age\" \"$RUNNER_TEMP/age/age\"\ngh api repos/azure-lab-automation-el/azure-lab/contents/packages/advanced-browser-tests-v9.tar.gz.age > \"$w/provider.json\"\npython3 - \"$w\" <<'PY'\nimport json,base64,pathlib,sys,hashlib\np=pathlib.Path(sys.argv[1]);d=base64.b64decode(json.load(open(p/'provider.json'))['content']);assert hashlib.sha256(d).hexdigest()=='7126a89aafefe4a54885843aa08a772b31f855d16946b1a1d24b32af8c30d6e4';(p/'source.age').write_bytes(d)\nPY\n"},{"name":"Private source integrity and key removal","shell":"bash","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\"\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\";unset LAB_AGE_KEY' EXIT\n\"$w/age/age\" -d -i \"$w/key\" -o \"$w/source.tar.gz\" \"$w/source.age\" 2>\"$w/private-error\"\nrm -f \"$w/key\";unset LAB_AGE_KEY\nprintf '6a1067da98c5a45934c99444c95fa3136b5879de5e12b8df722359b8c65e1d7e  %s\\n' \"$w/source.tar.gz\" | sha256sum -c - >/dev/null\npython3 - \"$w\" <<'PY'\nimport json,hashlib,tarfile,pathlib,sys\np=pathlib.Path(sys.argv[1]);out=p/'code';out.mkdir();allowed={'arbiter.py': '4692da2cce039e1ef07d428aafac0655719121da84106d52a8c8773fbec043ba', 'supervisor.py': '5889511e4b835f0cbe1d5dc30d00970dfd9113b0e06dfeaf6491b6579c5a5976', 'mailbox.py': '501dfc2a427e50ea9ef4a70b67ee7b36ec4e89dc4d1f7f3561a1472885394903', 'control_routes.py': '589e6d705e479d551e6cc6e4b04b2c1fdb9561e549871105e0bf6ec363703e73', 'fixture.py': '9424ce405c18a475254a638b91ce0e509c18edf2c91ff523a5742b38421d3e50', 'Dockerfile': 'c85dbdf86347e6dbf3d587f8d3f4838a2d06f2a2e37f1a1d8d2f336884d26791', 'runtime.sh': '3c4315b534f06b90636786e374a8da8760d6479aa61fe55c4c3cf35047d6dfb8', 'run-control.sh': 'fa61ecd21b191c56d7ab10c7428f28e9011a016c41d62a6dbb145563c8c3003e', 'sandbox.mjs': 'd1069a75bda359eaccca460f1f60b1a66bab206b3cd7e9f003ac63a8baad7750', 'setup-control.sh': '18dda8660807b10f528fa352b9f30067693dd626e5f903e2858c707936073772', 'control-requirements.lock': '2b7a6f543b7265f8dec6546b6c9e28849835aa992ea985a40f457e5dab5e9525', 'package.json': 'af7baee5fef23f64c2cda5a2f9dab1573c403904acebc98ef404fda7121f232d', 'package-lock.json': '878fc0a2ffa0730f44772dc28c06f19a59c662980ccf7f93b77665bbd61b2196', 'failure-diagnostic.py': '7d322e11ac0e4f30ed031594d916a8b18d8d062db52b0ee20eea67b3d1f012bc', 'qualify-seccomp.py': 'f609df4bf9e1db690bff2780aa2ac413fd99e4c038f8facb30391214079bc6e1', 'cleanup-control.py': 'bb289c6f6ed3c70345b8b1e2bccf84b12065724b93bca7416eb30cb549fbef33'}\nwith tarfile.open(p/'source.tar.gz') as t:\n ms=t.getmembers();assert len(ms)==len(allowed)+1 and {m.name for m in ms}==set(allowed)|{'sha256.json'}\n for m in ms:\n  assert m.isfile() and not m.issym() and not m.islnk() and m.size<=1048576;d=t.extractfile(m).read();assert len(d)==m.size\n  if m.name!='sha256.json':assert hashlib.sha256(d).hexdigest()==allowed[m.name]\n  (out/m.name).write_bytes(d)\nPY\n"},{"name":"Bounded synthetic direct control with host mailbox","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\ncd \"$RUNNER_TEMP/mcp-control-source/code\"\ncode=0\nif bash setup-control.sh > \"$RUNNER_TEMP/private-control.log\" 2>&1;then result=RUN_ENDED_UNVERIFIED;else code=$?;result=SETUP_FAILED_UNVERIFIED;fi\nif DIAGNOSTIC_RESULT=\"$result\" python3 failure-diagnostic.py > \"$RUNNER_TEMP/diagnostic-safe-result.txt\" 2> \"$RUNNER_TEMP/diagnostic-private-error.txt\";then\n cat \"$RUNNER_TEMP/diagnostic-safe-result.txt\"\nelse\n echo '::error::synthetic_diagnostic_retention_failed; private scratch retained; no diagnosis claim'\n exit 1\nfi\nif [ \"$code\" -ne 0 ];then echo \"::error::mcp_control_setup_or_runtime_failed_no_fallback exit=$code\";exit \"$code\";fi\necho '::notice::mcp_control_run_ended_UNVERIFIED; inspect encrypted evidence before any PASS claim'\n"},{"name":"Private cleanup","if":"always()","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\npython3 \"$RUNNER_TEMP/mcp-control-source/code/cleanup-control.py\""}]}}}