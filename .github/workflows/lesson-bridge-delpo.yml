{"name":"Lesson ChatOps delpo","on":{"issue_comment":{"types":["created"]}},"permissions":{"contents":"read"},"jobs":{"delpo-runtime":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/delpo-runtime'","runs-on":"ubuntu-24.04","timeout-minutes":6,"permissions":{},"container":{"image":"mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27"},"steps":[{"name":"Pinned browser and client tools before key use","shell":"bash","run":"set -euo pipefail\numask 077\nmkdir -p /tmp/delpo-code/node_modules/playwright-core /tmp/delpo-cipher\ncurl --max-time 60 -fsSL https://registry.npmjs.org/playwright-core/-/playwright-core-1.63.0.tgz -o /tmp/delpo-code/client.tgz\nprintf 'ad80ac045fcce478d4721e766dbb5538d1058efe97bbcb26f21ef674d951e5bcc81357ef0bf6f182ca7392349f53e3307843263ccf0a25e6c6ea79f2c68e660a  %s\n' /tmp/delpo-code/client.tgz | sha512sum -c - >/dev/null\ntar -xzf /tmp/delpo-code/client.tgz -C /tmp/delpo-code/node_modules/playwright-core --strip-components=1\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o /tmp/delpo-code/age.tgz\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\n' /tmp/delpo-code/age.tgz | sha256sum -c - >/dev/null\ntar -xzf /tmp/delpo-code/age.tgz -C /tmp/delpo-code\nprintf %s  | base64 -d > /tmp/delpo-code/runtime.age\nprintf '619faec1e0870f6ee623a26dff1eb43b20f4f8626d3468d6c28b7f3607893172  %s\n' /tmp/delpo-code/runtime.age | sha256sum -c - >/dev/null\n"},{"name":"Decrypt pinned source and test non-auth browser","shell":"bash","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nulimit -c 0\nw=/tmp/delpo-code\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\"; unset LAB_AGE_KEY' EXIT\nif ! \"$w/age/age\" -d -i \"$w/key\" -o \"$w/runtime.mjs\" \"$w/runtime.age\" 2> \"$w/private-error\"; then echo '::error::delpo_source_decrypt_failed'; exit 1; fi\nrm -f \"$w/key\"\nprintf '37fe618192372a394b8b4e5f4d21a2d59276563fab249c1f04ade5fcb9057087  %s\n' \"$w/runtime.mjs\" | sha256sum -c - >/dev/null\nunset LAB_AGE_KEY\nnode \"$w/runtime.mjs\" 2> \"$w/private-error\"\n"},{"name":"Encrypt owner-only result","if":"always()","shell":"bash","run":"set -euo pipefail\numask 077\nif [ -d /tmp/delpo-private ]; then\n tar -czf /tmp/delpo-code/result.tar.gz -C /tmp/delpo-private .\n /tmp/delpo-code/age/age -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -o /tmp/delpo-cipher/result.tar.gz.age /tmp/delpo-code/result.tar.gz\nfi\nrm -rf /tmp/delpo-private /tmp/delpo-code/result.tar.gz\n"},{"uses":"actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02","if":"always()","with":{"name":"delpo-runtime-${{ github.run_id }}","path":"/tmp/delpo-cipher/*.age","if-no-files-found":"error","retention-days":1}},{"name":"Private cleanup","if":"always()","shell":"bash","run":"rm -rf /tmp/delpo-code /tmp/delpo-private /tmp/delpo-cipher"}]},"advanced-control-install":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/advanced-control-install'","runs-on":"ubuntu-24.04","timeout-minutes":3,"permissions":{},"steps":[{"name":"Install exact synthetic control workflow only","shell":"bash","env":{"GH_TOKEN":"${{ secrets.LAB_WORKFLOW_PAT }}","LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/fixed-install\";mkdir -p \"$w\";trap 'rm -rf \"$w\";unset GH_TOKEN LAB_AGE_KEY' EXIT\ncurl -fsSL --max-time 60 https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/a.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/a.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/a.gz\" -C \"$w\"\nenv -u LAB_AGE_KEY gh api repos/azure-lab-automation-el/azure-lab/contents/packages/advanced-browser-workflow-v10.yml.gz.age > \"$w/provider\"\npython3 - \"$w\" <<'PY'\nimport pathlib,base64,sys,hashlib,json\np=pathlib.Path(sys.argv[1]);d=base64.b64decode(json.load(open(p/'provider'))['content']);assert hashlib.sha256(d).hexdigest()=='60fb954c756d4b3b3c0208af67d985ca65c57953b81ac28b220169a621f8b24e';(p/'w.age').write_bytes(d)\nPY\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\nenv -u GH_TOKEN \"$w/age/age\" -d -i \"$w/key\" -o \"$w/w.gz\" \"$w/w.age\" 2>\"$w/private-error\"\nrm \"$w/key\";unset LAB_AGE_KEY\ngzip -dc \"$w/w.gz\" > \"$w/w.yml\"\npython3 - \"$w\" <<'PY'\nimport pathlib,base64,sys,hashlib,json\np=pathlib.Path(sys.argv[1]);d=(p/'w.yml').read_bytes();assert hashlib.sha256(d).hexdigest()=='9f773f79e258a490757c1daa3b2ef129cb11a886e388517a29203d4cd5401167';p.joinpath('request').write_text(json.dumps({'message':'Install bounded synthetic MCP control','branch':'main','content':base64.b64encode(d).decode()}))\nPY\napi=repos/azure-lab-automation-el/azure-lab/contents/.github/workflows/advanced-browser-tests.yml\ngh api \"$api\" > \"$w/current\"\npython3 - \"$w\" <<'PYUPDATE'\nimport json,hashlib,base64,pathlib,sys\np=pathlib.Path(sys.argv[1]);c=json.load(open(p/'current'));assert hashlib.sha256(base64.b64decode(c['content'])).hexdigest()=='717fc320f4dde9853ca77ff2830907c81b1ff5e574f4f750c779fc9a8533ec70';r=json.load(open(p/'request'));r['sha']=c['sha'];p.joinpath('request').write_text(json.dumps(r))\nPYUPDATE\ngh api -X PUT \"$api\" --input \"$w/request\" > \"$w/result\"\ngh api \"$api\" > \"$w/readback\"\npython3 - \"$w\" <<'PY'\nimport pathlib,json,base64,hashlib,sys\np=pathlib.Path(sys.argv[1]);assert hashlib.sha256(base64.b64decode(json.load(open(p/'readback'))['content'])).hexdigest()=='9f773f79e258a490757c1daa3b2ef129cb11a886e388517a29203d4cd5401167'\nPY\necho '::notice::fixed_mcp_control_workflow_installed_readback=true; runtime_unproven=true'\n"}]}}}