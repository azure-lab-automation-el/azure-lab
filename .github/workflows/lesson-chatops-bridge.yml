name: Lesson ChatOps bridge
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  command:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'azure-lab-automation-el' &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.issue.labels.*.name, 'lesson-chatops')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: {group: lesson-bridge-update, cancel-in-progress: false}
    permissions: {contents: write, actions: write, issues: write}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_ISSUE: ${{ github.event.issue.number }}
      GH_COMMENT_ID: ${{ github.event.comment.id }}
      LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      LAB_WORKFLOW_PAT: ${{ secrets.LAB_WORKFLOW_PAT }}
    steps:
      - name: Read comment body from GitHub API without shell interpolation
        run: gh api "repos/$GH_REPO/issues/comments/$GH_COMMENT_ID" --jq .body > "$RUNNER_TEMP/command.txt"
      - name: Apply allowlisted encrypted update or dispatch
        run: |
          set -euo pipefail
          umask 077
          command=$(cat "$RUNNER_TEMP/command.txt")
          case "$command" in
            '/playwright '*)
              printf '%s' "${command#'/playwright '}" > "$RUNNER_TEMP/browser-url.txt"
              python3 - "$RUNNER_TEMP/browser-url.txt" > "$RUNNER_TEMP/dispatch.json" <<'PYURL'
          import json,sys,urllib.parse
          url=open(sys.argv[1]).read().strip();u=urllib.parse.urlsplit(url)
          assert u.scheme=='https' and u.hostname in ('example.com','docs.jfrog.com','docs.squaredup.com','playwright.dev')
          assert not u.username and not u.password and u.port is None and not u.query and not u.fragment and len(url)<=2000
          print(json.dumps({'ref':'main','inputs':{'package_path':'packages/recipient-test-20260930.age','package_id':'browser-public-read','rails':'browser','mode':'fixture','browser_url':url}}))
          PYURL
              gh api -X POST "repos/$GH_REPO/actions/workflows/lesson-pipeline.yml/dispatches" --input "$RUNNER_TEMP/dispatch.json" >/dev/null
              echo 'Read-only browser rail dispatched. Private output encrypted; this is not QA approval.' > "$RUNNER_TEMP/status.txt"
              ;;
            '/run '*)
              payload=${command#'/run '}
              # JSON with exact keys only; parsed by Python, never eval'd.
              printf '%s' "$payload" > "$RUNNER_TEMP/run.json"
              python3 - "$RUNNER_TEMP/run.json" > "$RUNNER_TEMP/dispatch.json" <<'PY'
          import json,re,sys
          x=json.load(open(sys.argv[1]));assert set(x)=={'workflow','package_path','package_id','rails','mode'}
          assert x['workflow']=='lesson-pipeline.yml'
          assert re.fullmatch(r'packages/[A-Za-z0-9_./-]+\.age',x['package_path']) and '..' not in x['package_path'].split('/')
          assert re.fullmatch(r'[A-Za-z0-9_-]{1,100}',x['package_id'])
          assert x['rails'] in ('all','metric','validate','audio','capture','simulation','discover','recipient-proof')
          assert x['mode'] in ('production','fixture')
          print(json.dumps({'ref':'main','inputs':{k:x[k] for k in ('package_path','package_id','rails','mode')}}))
          PY
              gh api -X POST "repos/$GH_REPO/actions/workflows/lesson-pipeline.yml/dispatches" --input "$RUNNER_TEMP/dispatch.json" >/dev/null
              echo 'Dispatch submitted. Inspect Actions for outcome; this is not QA approval.' > "$RUNNER_TEMP/status.txt"
              ;;
            '/apply '*)
              payload=${command#'/apply '}
              # One encrypted JSON file per comment. Deliberate 45KB limit, no multi-comment assembly.
              [ "${#payload}" -le 45000 ] || exit 2
              printf '%s' "$payload" | base64 -d > "$RUNNER_TEMP/update.age"
              sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null
              printf '%s' "$LAB_AGE_KEY" > "$RUNNER_TEMP/age.key"
              age -d -i "$RUNNER_TEMP/age.key" -o "$RUNNER_TEMP/update.json" "$RUNNER_TEMP/update.age"
              rm -f "$RUNNER_TEMP/age.key"
              python3 - "$RUNNER_TEMP/update.json" > "$RUNNER_TEMP/put.json" <<'PY'
          import base64,hashlib,json,re,sys
          x=json.load(open(sys.argv[1]));assert set(x)=={'path','content_base64','sha256','message'}
          path=x['path'];assert isinstance(path,str) and (re.fullmatch(r'(?:pipeline|packages)/[A-Za-z0-9_.-]+\.age',path) or path in ('.github/workflows/lesson-pipeline.yml','.github/workflows/lesson-chatops-bridge.yml','.github/workflows/esther-guard-plaintext.yml'))
          assert '..' not in path.split('/') and not path.endswith('/')
          data=base64.b64decode(x['content_base64'],validate=True)
          assert len(data)<=1048576 and hashlib.sha256(data).hexdigest()==x['sha256']
          assert isinstance(x['message'],str) and 5<=len(x['message'])<=120
          print(json.dumps({'path':path,'content':x['content_base64'],'message':x['message']}))
          PY
              path=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["path"])' "$RUNNER_TEMP/put.json")
              # Resolve remote HEAD SHA; 404 is permitted only for a new file.
              if [[ $path == .github/workflows/* ]]; then
                test -n "$LAB_WORKFLOW_PAT" || { echo 'Missing workflow PAT' >&2; exit 3; }
                export GH_TOKEN=$LAB_WORKFLOW_PAT
              fi
              sha=$(gh api "repos/$GH_REPO/contents/$path?ref=main" --jq .sha 2>/dev/null || true)
              python3 - "$RUNNER_TEMP/put.json" "$sha" > "$RUNNER_TEMP/request.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]));x.pop('path');x['branch']='main'
          if sys.argv[2]:x['sha']=sys.argv[2]
          json.dump(x,sys.stdout)
          PY
              gh api -X PUT "repos/$GH_REPO/contents/$path" --input "$RUNNER_TEMP/request.json" --jq .content.html_url > "$RUNNER_TEMP/status.txt"
              ;;
            *) exit 2 ;;
          esac
          gh issue comment "$GH_ISSUE" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/status.txt"

  azure-read:
    if: github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/azure-read'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: read, id-token: write, issues: write}
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read only subscription policy and available small VM SKUs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sid=$(az account show --query id -o tsv)
          az rest --method get --url "https://management.azure.com/subscriptions/$sid?api-version=2022-12-01" --query '{state:state,quotaId:subscriptionPolicies.quotaId,spendingLimit:subscriptionPolicies.spendingLimit}' -o json > "$RUNNER_TEMP/policy.json"
          az vm list-skus --location westeurope --resource-type virtualMachines --all -o json > "$RUNNER_TEMP/skus.json"
          az vm list-usage --location westeurope -o json > "$RUNNER_TEMP/usage.json"
          python3 - "$RUNNER_TEMP" <<'PYAZ'
          import json,pathlib,sys,re
          p=pathlib.Path(sys.argv[1]);lines=['Read-only Azure eligibility probe. No resources or billing settings changed.']
          d=json.load(open(p/'policy.json'))
          for k in ('state','quotaId','spendingLimit'):
              v=str(d.get(k));v=v if re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',v) else 'unverified';lines.append(k+'='+v)
          for x in json.load(open(p/'skus.json')):
              if x.get('name') in ('Standard_B1s','Standard_B2ats_v2','Standard_B2pts_v2'):
                  lines.append(x['name']+': restrictions='+str(len(x.get('restrictions',[]))))
                  for r in x.get('restrictions',[]):
                      reason=str(r.get('reasonCode','unknown'));typ=str(r.get('type','unknown'))
                      if re.fullmatch(r'[A-Za-z0-9_-]{1,80}',reason) and re.fullmatch(r'[A-Za-z0-9_-]{1,80}',typ):lines.append(x['name']+': '+typ+'='+reason)
          for x in json.load(open(p/'usage.json')):
              if x.get('name',{}).get('value') in ('cores','virtualMachines','standardBSFamily','standardBsv2Family','standardBpsv2Family'):
                  lines.append(x['name']['value']+': usage='+str(x['currentValue'])+', limit='+str(x['limit']))
          lines.append('Free 12-month VM entitlement is NOT proven by quotaId or SKU availability. Exact offer expiry/free-meter allowance still required.')
          (p/'azure-safe.txt').write_text('\n'.join(lines)+'\n')
          PYAZ
          gh issue comment 2 --repo "$GH_REPO" --body-file "$RUNNER_TEMP/azure-safe.txt"
          while IFS= read -r line; do printf '::notice title=Azure read-only probe::%s\n' "$line"; done < "$RUNNER_TEMP/azure-safe.txt"

  azure-cost:
    if: github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/azure-cost'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: write, id-token: write, issues: write}
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Private read-only current cost and inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          p="$RUNNER_TEMP/private-cost"; mkdir -p "$p"
          sid=$(az account show --query id -o tsv)
          printf '%s' '{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"cost":{"name":"Cost","function":"Sum"}},"grouping":[{"type":"Dimension","name":"ServiceName"},{"type":"Dimension","name":"ResourceId"}]}}' > "$p/request.json"
          az rest --method post --url "https://management.azure.com/subscriptions/$sid/providers/Microsoft.CostManagement/query?api-version=2025-03-01" --body @"$p/request.json" > "$p/cost.json" 2> "$p/cost-error.txt" || true
          az resource list -o json > "$p/resources.json" 2> "$p/resources-error.txt" || true
          az vm list -d -o json > "$p/vms.json" 2> "$p/vms-error.txt" || true
          az rest --method get --url "https://management.azure.com/subscriptions/$sid/providers/Microsoft.Compute/disks?api-version=2024-03-02" > "$p/disks.json" 2> "$p/disks-error.txt" || true
          az network public-ip list -o json > "$p/ips.json" 2> "$p/ips-error.txt" || true
          az rest --method get --url "https://management.azure.com/subscriptions/$sid/providers/Microsoft.Billing/billingProperty/default?api-version=2024-04-01" > "$p/billing-property.json" 2> "$p/billing-property-error.txt" || true
          profile=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("properties",{}).get("billingProfileId",""))' "$p/billing-property.json")
          if [ -n "$profile" ]; then az rest --method get --url "https://management.azure.com$profile/providers/Microsoft.Consumption/lots?api-version=2023-03-01" > "$p/credit-lots.json" 2> "$p/credit-lots-error.txt" || true; fi
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null
          tar -czf "$RUNNER_TEMP/cost.tar.gz" -C "$p" .
          age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/cost.age" "$RUNNER_TEMP/cost.tar.gz"
          jq -n --rawfile data "$RUNNER_TEMP/cost.age" '{message:"Encrypted private read-only Azure cost result",content:($data|@base64),branch:"main"}' > "$RUNNER_TEMP/relay.json"
          gh api -X PUT "repos/$GH_REPO/contents/packages/azure-cost-${{ github.run_id }}.age" --input "$RUNNER_TEMP/relay.json" >/dev/null
          rm -rf "$p" "$RUNNER_TEMP/cost.tar.gz"
          echo '::notice title=Private Azure cost relay::Encrypted result committed. No financial figures published. Individual API failures must be reviewed privately.'
