{"name":"Lesson ChatOps audio","on":{"issue_comment":{"types":["created"]}},"permissions":{"contents":"read"},"jobs":{"audio-read":{"if":"github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/audio-read'","runs-on":"ubuntu-24.04","timeout-minutes":6,"permissions":{"contents":"read","id-token":"write","issues":"write"},"steps":[{"uses":"azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c","with":{"client-id":"${{ secrets.AZURE_CLIENT_ID }}","tenant-id":"${{ secrets.AZURE_TENANT_ID }}","subscription-id":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}},{"name":"Read only Azure Speech resource SKU and state","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}"},"run":"set -euo pipefail\naz cognitiveservices account list --query \"[?kind=='SpeechServices'].{k:kind,s:sku.name,l:location,p:properties.provisioningState,n:name}\" -o json > \"$RUNNER_TEMP/speech.json\"\npython3 - \"$RUNNER_TEMP\" <<'PYSP'\nimport json,pathlib,sys,re,hashlib\np=pathlib.Path(sys.argv[1]);d=json.load(open(p/'speech.json'));lines=['Read-only Azure Speech resource probe. Nothing was created or changed; no synthesis call was made.','speech_accounts='+str(len(d))]\nok=lambda v:v if re.fullmatch(r'[A-Za-z0-9_.-]{1,60}',str(v)) else 'unverified'\nfor i,x in enumerate(d):\n    lines.append(f'account{i}: kind={ok(x.get(\"k\"))} sku={ok(x.get(\"s\"))} location={ok(x.get(\"l\"))} state={ok(x.get(\"p\"))} name_sha256_prefix={hashlib.sha256(str(x.get(\"n\")).encode()).hexdigest()[:10]}')\nlines.append('Monthly free-tier character counter is NOT readable here: it lives in the private pipeline script. Reset date not proven.')\n(p/'speech-safe.txt').write_text('\\n'.join(lines)+'\\n')\nPYSP\ngh issue comment 2 --repo \"$GH_REPO\" --body-file \"$RUNNER_TEMP/speech-safe.txt\"\nwhile IFS= read -r line; do printf '::notice title=Azure Speech read-only probe::%s\\n' \"$line\"; done < \"$RUNNER_TEMP/speech-safe.txt\"\n"}]}}}