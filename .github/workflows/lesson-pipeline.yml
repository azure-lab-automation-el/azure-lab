name: Joined private lesson stages
'on':
  workflow_dispatch:
    inputs:
      browser_url:
        required: false
        type: string
      package_path:
        required: false
        default: packages/lesson-v3.tar.gz.age
        type: string
      package_id:
        required: false
        default: 20260929-source-v3-capture-dsl
        type: string
      mode:
        required: false
        default: production
        type: choice
        options:
        - production
        - fixture
      rails:
        required: true
        default: all
        type: choice
        options:
        - all
        - validate
        - audio
        - capture
        - simulation
        - metric
        - discover
        - recipient-proof
        - browser
        - benchmark
permissions:
  contents: read
jobs:
  audio:
    if: inputs.rails == 'all' && inputs.package_id == 'oct1-joined-assembly-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: 'set -euo pipefail

        curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz

        echo ''cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ''"$RUNNER_TEMP/age.tgz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'umask 077

        mkdir -p "$RUNNER_TEMP/e2e-code" "$RUNNER_TEMP/e2e-private"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/code.key"

        age -d -i "$RUNNER_TEMP/code.key" -o "$RUNNER_TEMP/source.tar.gz" pipeline/oct1-joined-assembly-v2.tar.gz.age

        rm "$RUNNER_TEMP/code.key"

        echo ''f14b28bddbf08efd7671e393cd3033187af70a663d804b65a9d149bd165c5d88  ''"$RUNNER_TEMP/source.tar.gz" | sha256sum -c - >/dev/null

        tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/e2e-code"

        '
    - name: Provision bounded render dependencies
      run: "set -euo pipefail\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! python3 -c 'from PIL import Image' 2>/dev/null; then\n  timeout 150 sudo apt-get update -qq >/dev/null\n  timeout 150 sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core >/dev/null\nfi\ncommand -v ffmpeg >/dev/null || { echo '::error title=Bootstrap::ffmpeg missing'; exit 3; }\ncommand -v ffprobe >/dev/null || { echo '::error title=Bootstrap::ffprobe missing'; exit 3; }\npython3 -c 'from PIL import Image,features; assert features.check(\"raqm\"), \"RTL text dependency missing\"'\necho '::notice title=Bootstrap::Render dependencies verified'\n"
    - name: Run audio stage
      env:
        STAGE: ${{ runner.temp }}/audio
        TRANSFER: ${{ runner.temp }}/out-audio
        GH_TOKEN: ${{ github.token }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        AUDIO: ${{ runner.temp }}/audio
        VISUAL: ${{ runner.temp }}/visual
        CAPTIONS: ${{ runner.temp }}/captions
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$STAGE"

        python3 "$RUNNER_TEMP/e2e-code/validate_audio.py" > "$RUNNER_TEMP/audio-private.log" 2>&1

        python3 "$RUNNER_TEMP/e2e-code/pack-stage.py" >> "$RUNNER_TEMP/audio-private.log" 2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: private-audio
        path: ${{ runner.temp }}/out-audio/stage.age
        retention-days: 1
  visual:
    if: inputs.rails == 'all' && inputs.package_id == 'oct1-joined-assembly-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: 'set -euo pipefail

        curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz

        echo ''cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ''"$RUNNER_TEMP/age.tgz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'umask 077

        mkdir -p "$RUNNER_TEMP/e2e-code" "$RUNNER_TEMP/e2e-private"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/code.key"

        age -d -i "$RUNNER_TEMP/code.key" -o "$RUNNER_TEMP/source.tar.gz" pipeline/oct1-joined-assembly-v2.tar.gz.age

        rm "$RUNNER_TEMP/code.key"

        echo ''f14b28bddbf08efd7671e393cd3033187af70a663d804b65a9d149bd165c5d88  ''"$RUNNER_TEMP/source.tar.gz" | sha256sum -c - >/dev/null

        tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/e2e-code"

        '
    - name: Provision bounded render dependencies
      run: "set -euo pipefail\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! python3 -c 'from PIL import Image' 2>/dev/null; then\n  timeout 150 sudo apt-get update -qq >/dev/null\n  timeout 150 sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core >/dev/null\nfi\ncommand -v ffmpeg >/dev/null || { echo '::error title=Bootstrap::ffmpeg missing'; exit 3; }\ncommand -v ffprobe >/dev/null || { echo '::error title=Bootstrap::ffprobe missing'; exit 3; }\npython3 -c 'from PIL import Image,features; assert features.check(\"raqm\"), \"RTL text dependency missing\"'\necho '::notice title=Bootstrap::Render dependencies verified'\n"
    - name: Run visual stage
      env:
        STAGE: ${{ runner.temp }}/visual
        TRANSFER: ${{ runner.temp }}/out-visual
        GH_TOKEN: ${{ github.token }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        AUDIO: ${{ runner.temp }}/audio
        VISUAL: ${{ runner.temp }}/visual
        CAPTIONS: ${{ runner.temp }}/captions
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$STAGE"

        python3 "$RUNNER_TEMP/e2e-code/visuals.py" > "$RUNNER_TEMP/visual-private.log" 2>&1

        python3 "$RUNNER_TEMP/e2e-code/pack-stage.py" >> "$RUNNER_TEMP/visual-private.log" 2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: private-visual
        path: ${{ runner.temp }}/out-visual/stage.age
        retention-days: 1
  captions:
    if: inputs.rails == 'all' && inputs.package_id == 'oct1-joined-assembly-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: 'set -euo pipefail

        curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz

        echo ''cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ''"$RUNNER_TEMP/age.tgz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'umask 077

        mkdir -p "$RUNNER_TEMP/e2e-code" "$RUNNER_TEMP/e2e-private"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/code.key"

        age -d -i "$RUNNER_TEMP/code.key" -o "$RUNNER_TEMP/source.tar.gz" pipeline/oct1-joined-assembly-v2.tar.gz.age

        rm "$RUNNER_TEMP/code.key"

        echo ''f14b28bddbf08efd7671e393cd3033187af70a663d804b65a9d149bd165c5d88  ''"$RUNNER_TEMP/source.tar.gz" | sha256sum -c - >/dev/null

        tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/e2e-code"

        '
    - name: Provision bounded render dependencies
      run: "set -euo pipefail\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! python3 -c 'from PIL import Image' 2>/dev/null; then\n  timeout 150 sudo apt-get update -qq >/dev/null\n  timeout 150 sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core >/dev/null\nfi\ncommand -v ffmpeg >/dev/null || { echo '::error title=Bootstrap::ffmpeg missing'; exit 3; }\ncommand -v ffprobe >/dev/null || { echo '::error title=Bootstrap::ffprobe missing'; exit 3; }\npython3 -c 'from PIL import Image,features; assert features.check(\"raqm\"), \"RTL text dependency missing\"'\necho '::notice title=Bootstrap::Render dependencies verified'\n"
    - uses: actions/download-artifact@v4
      with:
        name: private-audio
        path: ${{ runner.temp }}/in-audio
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'set -euo pipefail

        umask 077

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/k"

        age -d -i "$RUNNER_TEMP/k" -o "$RUNNER_TEMP/in-audio/stage.tar.gz" "$RUNNER_TEMP/in-audio/stage.age"

        rm "$RUNNER_TEMP/k"

        mkdir -p "$RUNNER_TEMP/audio"

        tar -xzf "$RUNNER_TEMP/in-audio/stage.tar.gz" -C "$RUNNER_TEMP/audio"

        '
    - name: Run captions stage
      env:
        STAGE: ${{ runner.temp }}/captions
        TRANSFER: ${{ runner.temp }}/out-captions
        GH_TOKEN: ${{ github.token }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        AUDIO: ${{ runner.temp }}/audio
        VISUAL: ${{ runner.temp }}/visual
        CAPTIONS: ${{ runner.temp }}/captions
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$STAGE"

        python3 "$RUNNER_TEMP/e2e-code/captions.py" > "$RUNNER_TEMP/captions-private.log" 2>&1

        python3 "$RUNNER_TEMP/e2e-code/pack-stage.py" >> "$RUNNER_TEMP/captions-private.log" 2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: private-captions
        path: ${{ runner.temp }}/out-captions/stage.age
        retention-days: 1
    needs:
    - audio
  assembly:
    if: inputs.rails == 'all' && inputs.package_id == 'oct1-joined-assembly-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: 'set -euo pipefail

        curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz

        echo ''cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ''"$RUNNER_TEMP/age.tgz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'umask 077

        mkdir -p "$RUNNER_TEMP/e2e-code" "$RUNNER_TEMP/e2e-private"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/code.key"

        age -d -i "$RUNNER_TEMP/code.key" -o "$RUNNER_TEMP/source.tar.gz" pipeline/oct1-joined-assembly-v2.tar.gz.age

        rm "$RUNNER_TEMP/code.key"

        echo ''f14b28bddbf08efd7671e393cd3033187af70a663d804b65a9d149bd165c5d88  ''"$RUNNER_TEMP/source.tar.gz" | sha256sum -c - >/dev/null

        tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/e2e-code"

        '
    - name: Provision bounded render dependencies
      run: "set -euo pipefail\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! python3 -c 'from PIL import Image' 2>/dev/null; then\n  timeout 150 sudo apt-get update -qq >/dev/null\n  timeout 150 sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core >/dev/null\nfi\ncommand -v ffmpeg >/dev/null || { echo '::error title=Bootstrap::ffmpeg missing'; exit 3; }\ncommand -v ffprobe >/dev/null || { echo '::error title=Bootstrap::ffprobe missing'; exit 3; }\npython3 -c 'from PIL import Image,features; assert features.check(\"raqm\"), \"RTL text dependency missing\"'\necho '::notice title=Bootstrap::Render dependencies verified'\n"
    - uses: actions/download-artifact@v4
      with:
        name: private-audio
        path: ${{ runner.temp }}/in-audio
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'set -euo pipefail

        umask 077

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/k"

        age -d -i "$RUNNER_TEMP/k" -o "$RUNNER_TEMP/in-audio/stage.tar.gz" "$RUNNER_TEMP/in-audio/stage.age"

        rm "$RUNNER_TEMP/k"

        mkdir -p "$RUNNER_TEMP/audio"

        tar -xzf "$RUNNER_TEMP/in-audio/stage.tar.gz" -C "$RUNNER_TEMP/audio"

        '
    - uses: actions/download-artifact@v4
      with:
        name: private-visual
        path: ${{ runner.temp }}/in-visual
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'set -euo pipefail

        umask 077

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/k"

        age -d -i "$RUNNER_TEMP/k" -o "$RUNNER_TEMP/in-visual/stage.tar.gz" "$RUNNER_TEMP/in-visual/stage.age"

        rm "$RUNNER_TEMP/k"

        mkdir -p "$RUNNER_TEMP/visual"

        tar -xzf "$RUNNER_TEMP/in-visual/stage.tar.gz" -C "$RUNNER_TEMP/visual"

        '
    - uses: actions/download-artifact@v4
      with:
        name: private-captions
        path: ${{ runner.temp }}/in-captions
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'set -euo pipefail

        umask 077

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/k"

        age -d -i "$RUNNER_TEMP/k" -o "$RUNNER_TEMP/in-captions/stage.tar.gz" "$RUNNER_TEMP/in-captions/stage.age"

        rm "$RUNNER_TEMP/k"

        mkdir -p "$RUNNER_TEMP/captions"

        tar -xzf "$RUNNER_TEMP/in-captions/stage.tar.gz" -C "$RUNNER_TEMP/captions"

        '
    - name: Run assembly stage
      env:
        STAGE: ${{ runner.temp }}/assembly
        TRANSFER: ${{ runner.temp }}/out-assembly
        GH_TOKEN: ${{ github.token }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        AUDIO: ${{ runner.temp }}/audio
        VISUAL: ${{ runner.temp }}/visual
        CAPTIONS: ${{ runner.temp }}/captions
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$STAGE"

        python3 "$RUNNER_TEMP/e2e-code/assemble.py" > "$RUNNER_TEMP/assembly-private.log" 2>&1

        python3 "$RUNNER_TEMP/e2e-code/pack-stage.py" >> "$RUNNER_TEMP/assembly-private.log" 2>&1

        '
    - name: Relay encrypted candidate only
      env:
        GH_TOKEN: ${{ github.token }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'set -euo pipefail

        umask 077

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/k"

        age -d -i "$RUNNER_TEMP/k" -o "$RUNNER_TEMP/result.tar.gz" "$RUNNER_TEMP/out-assembly/stage.age"

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/result.tar.gz"

        split -b 700000 -d -a 3 "$RUNNER_TEMP/result.age" "$RUNNER_TEMP/part-"

        for f in "$RUNNER_TEMP"/part-*;do suffix=${f##*-};jq -n --rawfile d "$f" ''{message:"Encrypted joined lesson candidate; quality gates held",content:($d|@base64),branch:"main"}'' > "$RUNNER_TEMP/put.json";gh api -X PUT "repos/${{ github.repository }}/contents/packages/joined-${{ github.run_id }}-$suffix.age" --input "$RUNNER_TEMP/put.json" >/dev/null;done

        '
    needs:
    - audio
    - visual
    - captions
