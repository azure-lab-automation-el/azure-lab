name: esther-swa-free
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'preflight or create', required: true, default: preflight }
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-swa-free__swa
      timeout: 5
      extra_env: |
        INPUT_MODE=${{ inputs.mode }}
