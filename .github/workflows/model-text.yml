{"name":"Synthetic local model text test","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"model-text":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/model-text'","runs-on":"ubuntu-24.04","timeout-minutes":35,"permissions":{"contents":"write"},"steps":[{"name":"Pinned encrypted source retrieval","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/model-text-source\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tar.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/age.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tar.gz\" -C \"$w\"\nmkdir -p \"$RUNNER_TEMP/model-text-age\";cp -r \"$w/age\" \"$RUNNER_TEMP/model-text-age/age\"\ngh api repos/azure-lab-automation-el/azure-lab/contents/packages/model-text-source-v1.tar.gz.age > \"$w/provider.json\"\npython3 - \"$w\" <<'PIN'\nimport json,base64,pathlib,sys,hashlib\np=pathlib.Path(sys.argv[1]);d=base64.b64decode(json.load(open(p/'provider.json'))['content']);assert hashlib.sha256(d).hexdigest()=='e20700cf51aff1a3785d6c0a46695348b2ee43b6b15f80745d9f48a4078a4801';(p/'source.age').write_bytes(d)\nPIN\n"},{"name":"Private source validation and key removal","shell":"bash","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/model-text-source\"\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\";unset LAB_AGE_KEY' EXIT\n\"$w/age/age\" -d -i \"$w/key\" -o \"$w/source.tar.gz\" \"$w/source.age\" 2>\"$w/private-error\"\nrm -f \"$w/key\";unset LAB_AGE_KEY\nprintf '6a0e8a7c707fac889775cc8af8de1bfd5d3ed259f11bcb269c0649e27c004d22  %s\\n' \"$w/source.tar.gz\" | sha256sum -c - >/dev/null\npython3 - \"$w\" <<'PIN'\nimport json,hashlib,tarfile,pathlib,sys\np=pathlib.Path(sys.argv[1]);out=p/'code';out.mkdir();allowed={'Dockerfile': 'b4717c55e65f89b3c23528d6518f871da3af450511771b80d6cd7914e0514283', 'registry-manifest.json': '46e0c10c039e019119339687c3c1757cc81b9da49709a3b3924863ba87ca666e', 'run-text.sh': '87684f60a6e065b053994b91f4c698759671cdb45935d076d6b16934fc8a2818', 'runtime-text.sh': '84f39c790d80df46f47bf4cf2b79f1e5f63d2872bc76c7527b031d9ab75e2054', 'cleanup-text.py': '8fb9edcb58568ca6d728fb00933f4bec0ab270e1bee432b6f4c5df7577e65dec', 'base-pin.json': 'd6f043bac21f1d2939e764b0f44ad18d89ce59716414faccff299c01ef029685', '.dockerignore': 'dc6b09f110a41525f130893e924f1e8fb2b0dd6255f1de3c5ff95613255523a1', 'qualify-text.py': 'f6de9b038ff9f319b8312eb8e4340f9cdd1bf8f92099fdc40699802d6c8ea5ce', 'SOURCE-SHA256.txt': '07a978f610dcb78854f69cdd573d071efc5c7e05879fb83c05d3ff574433bcc2', 'acquire-assets.py': '9406a82d9e79d925041241209c3a1a321698c1f39e9628cee319d66d0d1c125c', 'retain-text.py': '16c2699f4d2c3ccfca61ef3039eed7eec88bf15034bb77cb7c9b5d5580ca72ee'}\nwith tarfile.open(p/'source.tar.gz') as t:\n ms=t.getmembers();assert len(ms)==len(allowed) and {m.name for m in ms}==set(allowed)\n for m in ms:\n  assert m.isfile() and not m.issym() and not m.islnk() and m.size<=1048576;d=t.extractfile(m).read();assert len(d)==m.size and hashlib.sha256(d).hexdigest()==allowed[m.name];(out/m.name).write_bytes(d)\nPIN\n"},{"name":"Bounded offline local synthetic text test and retained evidence","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\ncd \"$RUNNER_TEMP/model-text-source/code\"\ncode=0\nif env -u GH_TOKEN bash run-text.sh;then result=RUN_ENDED_UNVERIFIED;else code=$?;result=SETUP_FAILED_UNVERIFIED;fi\nif DIAGNOSTIC_RESULT=\"$result\" python3 retain-text.py > \"$RUNNER_TEMP/model-text-retention-safe.txt\" 2> \"$RUNNER_TEMP/model-text-retention-private.txt\";then cat \"$RUNNER_TEMP/model-text-retention-safe.txt\";else echo '::error::model_text_retention_failed; scratch_cleanup_held';exit 1;fi\nif [ \"$code\" -ne 0 ];then echo \"::error::model_text_failed exit=$code no_paid_cloud_fallback\";exit \"$code\";fi\necho '::notice::model_text_run_ended_UNVERIFIED inspect_actual_output_no_browser_claim'\n"},{"name":"Precise private scratch cleanup","if":"always()","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\npython3 \"$RUNNER_TEMP/model-text-source/code/cleanup-text.py\""}]}}}