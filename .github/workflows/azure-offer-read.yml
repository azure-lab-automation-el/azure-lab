name: azure-offer-read
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - name: מיסוך מזהים
        env:
          M1: "${{ vars.AZURE_CLIENT_ID }}"
          M2: "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ vars.AZURE_TENANT_ID }}"
          M4: "${{ vars.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ vars.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ vars.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ vars.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Decrypt payload
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        run: |
          printf '%s' "$LAB_AGE_KEY" > /tmp/age.key && chmod 600 /tmp/age.key
          age -d -i /tmp/age.key payload.tar.gz.age | tar xz
          shred -u /tmp/age.key 2>/dev/null || rm -f /tmp/age.key
      - name: Mask sensitive values
        env:
          M1: "${{ vars.AZURE_CLIENT_ID }}"
          M2: "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ vars.AZURE_TENANT_ID }}"
          M4: "${{ vars.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ vars.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ vars.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ vars.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
          grep -rhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\besther-[a-z0-9][a-z0-9-]*' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
      - name: Run
        run: |
          set +e
          bash .lab-entry/azure-offer-read__read.sh > "$RUNNER_TEMP/azure-offer-read__read.log" 2>&1
          rc=$?
          age -r age16ynqau96fypeawdgprafasdle3uja0qk0vzsz66w73ct0yk96ecsqncvnk -o "$RUNNER_TEMP/azure-offer-read__read.log.age" "$RUNNER_TEMP/azure-offer-read__read.log"
          shred -u "$RUNNER_TEMP/azure-offer-read__read.log" 2>/dev/null || rm -f "$RUNNER_TEMP/azure-offer-read__read.log"
          if [ "$rc" -eq 0 ]; then echo "הסתיים בהצלחה (קוד 0)"; else echo "נכשל (קוד $rc) - הלוג המוצפן בארטיפקט log-azure-offer-read__read"; fi
          exit "$rc"
      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-azure-offer-read__read
          path: ${{ runner.temp }}/azure-offer-read__read.log.age
          retention-days: 7
          if-no-files-found: ignore
