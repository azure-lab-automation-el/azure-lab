name: backup-toolchain-mega
on:
  workflow_dispatch:
    inputs:
      bundle_b64: { description: 'git bundle --all של azure-lab-toolchain, ב-base64', required: true }
permissions: { contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: backup-toolchain-mega__backup
      timeout: 10
      azure_login: false
      extra_env: |
        INPUT_BUNDLE_B64=${{ inputs.bundle_b64 }}
