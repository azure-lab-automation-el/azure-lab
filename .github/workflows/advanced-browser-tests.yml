{"name":"Synthetic MCP direct control","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"mcp-control":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/advanced-control'","runs-on":"ubuntu-24.04","timeout-minutes":30,"permissions":{"contents":"write","issues":"read"},"steps":[{"name":"Pinned public tools and encrypted source retrieval","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tar.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/age.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tar.gz\" -C \"$w\"\nmkdir -p \"$RUNNER_TEMP/age\";cp -r \"$w/age\" \"$RUNNER_TEMP/age/age\"\ngh api repos/azure-lab-automation-el/azure-lab/contents/packages/advanced-browser-tests-v6.tar.gz.age > \"$w/provider.json\"\npython3 - \"$w\" <<'PY'\nimport json,base64,pathlib,sys,hashlib\np=pathlib.Path(sys.argv[1]);d=base64.b64decode(json.load(open(p/'provider.json'))['content']);assert hashlib.sha256(d).hexdigest()=='b2c3f79715326a1814e21f625b0adc7873afbc01a5fcc9df2c08c2a9718b6427';(p/'source.age').write_bytes(d)\nPY\n"},{"name":"Private source integrity and key removal","shell":"bash","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\"\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\";unset LAB_AGE_KEY' EXIT\n\"$w/age/age\" -d -i \"$w/key\" -o \"$w/source.tar.gz\" \"$w/source.age\" 2>\"$w/private-error\"\nrm -f \"$w/key\";unset LAB_AGE_KEY\nprintf 'ad397f8c85b789fcb0188e59a6f7eb68ef202f8ffec2362d8962a26fdf39d335  %s\\n' \"$w/source.tar.gz\" | sha256sum -c - >/dev/null\npython3 - \"$w\" <<'PY'\nimport json,hashlib,tarfile,pathlib,sys\np=pathlib.Path(sys.argv[1]);out=p/'code';out.mkdir();allowed={'arbiter.py': '4692da2cce039e1ef07d428aafac0655719121da84106d52a8c8773fbec043ba', 'supervisor.py': '5889511e4b835f0cbe1d5dc30d00970dfd9113b0e06dfeaf6491b6579c5a5976', 'mailbox.py': '501dfc2a427e50ea9ef4a70b67ee7b36ec4e89dc4d1f7f3561a1472885394903', 'control_routes.py': 'c12fd7f731e53778906f653f845bb13e39926fc08683f059447ff8d4539c66b6', 'fixture.py': '9424ce405c18a475254a638b91ce0e509c18edf2c91ff523a5742b38421d3e50', 'Dockerfile': 'c85dbdf86347e6dbf3d587f8d3f4838a2d06f2a2e37f1a1d8d2f336884d26791', 'runtime.sh': '4bf494b3c4b248a3ae7742e2021e631b60d455ff57d4a1151cf23d181c03e3e7', 'run-control.sh': '2203f4c8a5b023849fbc8129085f70a750b1eef765fb5facd2ead5e91c1848b5', 'sandbox.mjs': 'ae66546023848fa09d0380d2be64600cefb9b668144b7ee7f522a63fd68eec4c', 'setup-control.sh': '18dda8660807b10f528fa352b9f30067693dd626e5f903e2858c707936073772', 'control-requirements.lock': '2b7a6f543b7265f8dec6546b6c9e28849835aa992ea985a40f457e5dab5e9525', 'package.json': 'af7baee5fef23f64c2cda5a2f9dab1573c403904acebc98ef404fda7121f232d', 'package-lock.json': '878fc0a2ffa0730f44772dc28c06f19a59c662980ccf7f93b77665bbd61b2196', 'failure-diagnostic.py': '99ed8c56d7965d87fa7f0b8831465b2fa91844d87d6f2628021b6617b6638969', 'qualify-seccomp.py': 'fc376bced0fe2ad64f9a3ac9dc29c36616a9d21f2cae00d5394ba89b86b36987'}\nwith tarfile.open(p/'source.tar.gz') as t:\n ms=t.getmembers();assert len(ms)==len(allowed)+1 and {m.name for m in ms}==set(allowed)|{'sha256.json'}\n for m in ms:\n  assert m.isfile() and not m.issym() and not m.islnk() and m.size<=1048576;d=t.extractfile(m).read();assert len(d)==m.size\n  if m.name!='sha256.json':assert hashlib.sha256(d).hexdigest()==allowed[m.name]\n  (out/m.name).write_bytes(d)\nPY\n"},{"name":"Bounded synthetic direct control with host mailbox","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\ncd \"$RUNNER_TEMP/mcp-control-source/code\"\n# GH_TOKEN host broker only, not image or browser container.\nif bash setup-control.sh > \"$RUNNER_TEMP/private-control.log\" 2>&1;then\n echo '::notice::mcp_control_run_ended; inspect encrypted evidence before any PASS claim'\nelse\n code=$?\n echo \"::notice::synthetic_setup_exit_code=$code\"\n if python3 failure-diagnostic.py > \"$RUNNER_TEMP/diagnostic-safe-result.txt\" 2> \"$RUNNER_TEMP/diagnostic-private-error.txt\";then\n  cat \"$RUNNER_TEMP/diagnostic-safe-result.txt\"\n else\n  echo '::error::synthetic_setup_failure_diagnostic_delivery_failed; no diagnosis available'\n fi\n echo '::error::mcp_control_setup_or_runtime_failed_no_fallback'\n exit \"$code\"\nfi\necho '::notice::mcp_control_run_ended; inspect encrypted evidence before any PASS claim'\n"},{"name":"Private cleanup","if":"always()","shell":"bash","run":"docker rm -f advanced-control >/dev/null 2>&1 || true\nrm -rf \"$RUNNER_TEMP/mcp-control-source\" \"$RUNNER_TEMP/advanced-control\" \"$RUNNER_TEMP/age\""}]}}}