name: Focused permissions lesson
'on':
  workflow_dispatch:
    inputs:
      browser_url:
        required: false
        type: string
      package_path:
        required: false
        default: packages/lesson-v3.tar.gz.age
        type: string
      package_id:
        required: false
        default: 20260929-source-v3-capture-dsl
        type: string
      mode:
        required: false
        default: production
        type: choice
        options:
        - production
        - fixture
      rails:
        required: true
        default: all
        type: choice
        options:
        - all
        - validate
        - audio
        - capture
        - simulation
        - metric
        - discover
        - recipient-proof
        - browser
        - benchmark
permissions:
  contents: read
jobs:
  audio:
    if: inputs.rails == 'benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: hila-f0-synthesis-resource
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: 'set -euo pipefail

        curl --max-time 90 -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz

        echo ''cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  ''"$RUNNER_TEMP/age.tgz" | sha256sum -c -

        tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'umask 077

        mkdir -p "$RUNNER_TEMP/e2e-code" "$RUNNER_TEMP/e2e-private"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/code.key"

        age -d -i "$RUNNER_TEMP/code.key" -o "$RUNNER_TEMP/source.tar.gz" pipeline/focused-lesson-source-v25.tar.gz.age

        rm "$RUNNER_TEMP/code.key"

        echo ''cf5c7f7d12448da5a75d7068f6380dfc159ec10f18c66c1fc16e4c8eede496ea  ''"$RUNNER_TEMP/source.tar.gz" | sha256sum -c - >/dev/null

        tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/e2e-code"

        '
    - run: 'python3 -m pip install azure-cognitiveservices-speech numpy >/dev/null

        '
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        GH_TOKEN: ${{ github.token }}
        FOCUSED_MODE: audio
      run: "set +e\npython3 \"$RUNNER_TEMP/e2e-code/focused.py\" > \"$RUNNER_TEMP/e2e-private/log.txt\" 2>&1\nrc=$?\nexport PYTHONPATH=\"$RUNNER_TEMP/e2e-code\"\npython3 - <<'PYCHECK'\nimport json,pathlib,os\nfrom durable_cache import Durable\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'e2e-private';d=Durable();r=json.loads((p/'audio-stage.json').read_text());checks=[]\nfor k in r['keys']:\n data,_=d.read('packages/focused-qa-'+k+'.age',missing=True)\n if data is not None:checks.append(json.loads(data))\n(p/'all-cached-checks.json').write_text(json.dumps(checks,ensure_ascii=False))\nPYCHECK\nset -e\nprintf '%s' \"$rc\" > \"$RUNNER_TEMP/e2e-private/exit-code.txt\"\nmkdir -p \"$RUNNER_TEMP/delivery\"\ncp \"$RUNNER_TEMP/e2e-private/all-cached-checks.json\" \"$RUNNER_TEMP/delivery/\"\ncp \"$RUNNER_TEMP/e2e-private\"/failure.txt \"$RUNNER_TEMP/e2e-private\"/*failure*.png \"$RUNNER_TEMP/e2e-private\"/*failure*.json \"$RUNNER_TEMP/e2e-private\"/capture-segments.json \"$RUNNER_TEMP/e2e-private\"/recording-proof.json \"$RUNNER_TEMP/delivery/\" 2>/dev/null || true\ncp -r \"$RUNNER_TEMP/e2e-private\"/section-* \"$RUNNER_TEMP/delivery/\" 2>/dev/null || true\ncp \"$RUNNER_TEMP/e2e-private/lesson.mp4\" \"$RUNNER_TEMP/e2e-private/audio-stage.json\" \"$RUNNER_TEMP/delivery/\" 2>/dev/null || true\ncp \"$RUNNER_TEMP/e2e-private/log.txt\" \"$RUNNER_TEMP/e2e-private/exit-code.txt\" \"$RUNNER_TEMP/delivery/\"\ntar -czf \"$RUNNER_TEMP/result.tar.gz\" -C \"$RUNNER_TEMP/delivery\" .\nage -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o \"$RUNNER_TEMP/result.age\" \"$RUNNER_TEMP/result.tar.gz\"\nsplit -b 700000 -d -a 3 \"$RUNNER_TEMP/result.age\" \"$RUNNER_TEMP/part-\"\nfor f in \"$RUNNER_TEMP\"/part-*;do suffix=${f##*-};jq -n --rawfile d \"$f\" '{message:\"Encrypted focused lesson evidence\",content:($d|@base64),branch:\"main\"}' > \"$RUNNER_TEMP/put.json\";gh api -X PUT \"repos/${{ github.repository }}/contents/packages/focused-${{ github.run_id }}-audio-$suffix.age\" --input \"$RUNNER_TEMP/put.json\" >/dev/null;done\nexit \"$rc\"\n"
