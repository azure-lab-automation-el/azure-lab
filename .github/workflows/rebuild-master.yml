name: rebuild-master
on:
  workflow_dispatch:
    inputs:
      until:
        type: choice
        options: [all, base, dc, join, sql, prereq, scom, linux]
        default: all
        description: 'checkpoint: stop after this stage'
      media_account:
        default: estherlabmedia8c8c3c92
        description: 'storage account for install media (created if missing)'
      lab_location:
        type: choice
        options: [israelcentral, swedencentral]
        default: israelcentral
        description: 'hub region (policy-approved only; a new region needs his policy approval first)'
      lab_location_linux:
        type: choice
        options: [swedencentral, israelcentral]
        default: swedencentral
        description: 'linux spoke region (policy-approved only)'
permissions: { id-token: write, contents: write }
env:
  LAB_LOCATION: ${{ inputs.lab_location || 'israelcentral' }}
  LAB_LOCATION_LINUX: ${{ inputs.lab_location_linux || 'swedencentral' }}
jobs:
  media:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: rebuild-master__media
      timeout: 40
      media_account: ${{ inputs.media_account }}
      extra_env: |
        INPUT_UNTIL=${{ inputs.until }}
        INPUT_MEDIA_ACCOUNT=${{ inputs.media_account }}
  network:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: rebuild-master__network
      timeout: 25
  base:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [network]
    with:
      entry: rebuild-master__base
      timeout: 25
  dc:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [network]
    if: contains(fromJSON('["all","dc","join","sql","prereq","scom","linux"]'), inputs.until)
    with:
      entry: rebuild-master__dc
      timeout: 25
  join:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [dc]
    if: contains(fromJSON('["all","join","sql","prereq","scom","linux"]'), inputs.until)
    with:
      entry: rebuild-master__join
      timeout: 20
  preload:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [base, media]
    with:
      entry: rebuild-master__preload
      timeout: 25
      media_account: ${{ inputs.media_account }}
  sql:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [join, media]
    if: contains(fromJSON('["all","sql","prereq","scom","linux"]'), inputs.until)
    with:
      entry: rebuild-master__sql
      timeout: 50
      media_account: ${{ inputs.media_account }}
  prereq:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [sql]
    if: contains(fromJSON('["all","prereq","scom","linux"]'), inputs.until)
    with:
      entry: rebuild-master__prereq
      timeout: 40
      media_account: ${{ inputs.media_account }}
  scom:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [prereq]
    if: contains(fromJSON('["all","scom","linux"]'), inputs.until)
    with:
      entry: rebuild-master__scom
      timeout: 50
      media_account: ${{ inputs.media_account }}
      extra_env: |
        STAGES=hb-on install autologon-on restart shot autologon-off dc-fixes mps agent-manual
  linux-infra:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [dc]
    if: contains(fromJSON('["all","dc","join","sql","prereq","scom","linux"]'), inputs.until)
    with:
      entry: rebuild-master__linux-infra
      timeout: 30
      extra_env: |
        GH_REPO=${{ github.repository }}
        ROTATE_KEY=true
  linux-agent:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [scom, linux-infra]
    if: contains(fromJSON('["all","linux"]'), inputs.until)
    with:
      entry: rebuild-master__linux-agent
      timeout: 35
      extra_env: |
        GH_REPO=${{ github.repository }}
        ROTATE_KEY=true
  verify:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    needs: [scom, linux-agent]
    if: inputs.until == 'all'
    with:
      entry: rebuild-master__verify
