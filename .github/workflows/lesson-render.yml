name: lesson-render
on:
  workflow_dispatch:
    inputs:
      src_tag: { description: 'Verified MEGA input bundle path (mega:TRACK/date/*.tar.gz)', required: true }
      publish: { description: 'Upload finished bundles to MEGA after verification', type: boolean, default: false }
      out_tag: { description: 'Internal run label', required: false, default: 'lesson-2026-09-28' }
      whisper_model: { description: 'faster-whisper model', required: false, default: 'medium' }
permissions: {contents: read}
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: lesson-render__render
      timeout: 90
      azure_login: false
      extra_env: |
        INPUT_PUBLISH=${{ inputs.publish }}
        INPUT_WHISPER_MODEL=${{ inputs.whisper_model }}
        WHISPER_MODEL=${{ inputs.whisper_model }}
        INPUT_SRC_TAG=${{ inputs.src_tag }}
        INPUT_OUT_TAG=${{ inputs.out_tag }}
