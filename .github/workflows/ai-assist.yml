name: ai-assist
on:
  workflow_dispatch:
    inputs:
      engine: {default: "copilot", type: choice, options: [copilot, groq, cloudflare]}
      task: {default: "Translate to Hebrew, output only the translation: Run started"}
permissions:
  contents: read
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: ai-assist__ask
      timeout: 5
      azure_login: false
      extra_env: |
        INPUT_ENGINE=${{ inputs.engine }}
        INPUT_TASK=${{ inputs.task }}
