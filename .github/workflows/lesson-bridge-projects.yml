{"name":"Lesson ChatOps projects","on":{"issue_comment":{"types":["created"]}},"permissions":{"contents":"read"},"jobs":{"projects-status-probe":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/projects-status-probe'","runs-on":"ubuntu-24.04","timeout-minutes":3,"permissions":{},"concurrency":{"group":"projects-status-probe","cancel-in-progress":false},"steps":[{"name":"Pinned tool before credential use","shell":"bash","run":"set -euo pipefail\numask 077\nw=/tmp/projects-probe\nmkdir -m 700 -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tgz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\n' \"$w/age.tgz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tgz\" -C \"$w\"\nprintf %s  | base64 -d > \"$w/probe.age\"\nprintf '4d879b258d4514f3f4e7587f5f26029af72c916161c91c1165a3b6dd5a4df71f  %s\n' \"$w/probe.age\" | sha256sum -c - >/dev/null\n"},{"name":"Exact private owner Projects read only","shell":"bash","env":{"LAB_WORKFLOW_PAT":"${{ secrets.LAB_WORKFLOW_PAT }}","LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nulimit -c 0\nw=/tmp/projects-probe\ntrap 'rm -rf \"$w\"; unset LAB_AGE_KEY LAB_WORKFLOW_PAT' EXIT\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\nif ! \"$w/age/age\" -d -i \"$w/key\" -o \"$w/probe.py\" \"$w/probe.age\" 2> \"$w/private-error\"; then echo '::error::projects_probe_source_decrypt_failed'; exit 1; fi\nrm -f \"$w/key\"\nprintf '136ce89f957eaf9635af3e6f75b0ad5fd86c4cdf0eb5c45bb0104455044cda7f  %s\n' \"$w/probe.py\" | sha256sum -c - >/dev/null\npython3 \"$w/probe.py\" 2> \"$w/private-error\"\n"},{"name":"Private cleanup","if":"always()","shell":"bash","run":"rm -rf /tmp/projects-probe"}]}}}