name: esther-password
on:
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: מיסוך מזהים
        env:
          M1: "${{ secrets.AZURE_CLIENT_ID }}"
          M2: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ secrets.AZURE_TENANT_ID }}"
          M4: "${{ secrets.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ secrets.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ secrets.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ secrets.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ESTHER_PASSWORD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: True
      - name: Decrypt payload
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        run: |
          printf '%s' "$LAB_AGE_KEY" > /tmp/age.key && chmod 600 /tmp/age.key
          age -d -i /tmp/age.key payload.tar.gz.age | tar xz
          shred -u /tmp/age.key 2>/dev/null || rm -f /tmp/age.key
      - name: Mask sensitive values
        env:
          M1: "${{ secrets.AZURE_CLIENT_ID }}"
          M2: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          M3: "${{ secrets.AZURE_TENANT_ID }}"
          M4: "${{ secrets.ESTHER_PASSWORD_CLIENT_ID }}"
          M5: "${{ secrets.ESTHER_PORTAL_CLIENT_ID }}"
          M6: "${{ secrets.ESTHER_READ_CLIENT_ID }}"
          M7: "${{ secrets.ESTHER_WRITE_CLIENT_ID }}"
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "$M1" "$M2" "$M3" "$M4" "$M5" "$M6" "$M7"; do mask "$v"; done
          grep -rhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\besther-[a-z0-9][a-z0-9-]*' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
      - name: Run
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set +e
          bash .lab-entry/esther-password__reset.sh > "$RUNNER_TEMP/esther-password__reset.log" 2>&1
          rc=$?
          age -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -o "$RUNNER_TEMP/esther-password__reset.log.age" "$RUNNER_TEMP/esther-password__reset.log"
          shred -u "$RUNNER_TEMP/esther-password__reset.log" 2>/dev/null || rm -f "$RUNNER_TEMP/esther-password__reset.log"
          if [ "$rc" -eq 0 ]; then echo "הסתיים בהצלחה (קוד 0)"; else echo "נכשל (קוד $rc) - הלוג המוצפן בארטיפקט log-esther-password__reset"; fi
          exit "$rc"
      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-esther-password__reset
          path: ${{ runner.temp }}/esther-password__reset.log.age
          retention-days: 7
          if-no-files-found: ignore
