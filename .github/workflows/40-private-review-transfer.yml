name: 40 - encrypted private review utility
on: {workflow_dispatch: {}}
permissions: {contents: read, actions: read}
jobs:
  utility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and run encrypted private utility
        run: |
          set -euo pipefail; umask 077
          printf '%s  %s\n' '709e5cdfad532aa4fa286aa50661f2080621748479759df1be03e4b52af4f356' ./1-private-review-transfer-source-20260929.tar.gz.age | sha256sum -c - >/dev/null
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq age >/dev/null 2>&1
          printf '%s' "$LAB_AGE_KEY" >/tmp/lesson-age.key
          age -d -i /tmp/lesson-age.key -o /tmp/private-utility.tar.gz ./1-private-review-transfer-source-20260929.tar.gz.age
          shred -u /tmp/lesson-age.key 2>/dev/null || rm -f /tmp/lesson-age.key
          printf '%s  %s\n' 'bf83bda84fa519f4b9f34cc225bbf054925292e8fe755acb5f7f6af5a60f856d' /tmp/private-utility.tar.gz | sha256sum -c - >/dev/null
          tar -xzf /tmp/private-utility.tar.gz -C /tmp private-review-transfer.sh
          printf '%s  %s\n' '2796e9fbe6d241e61332a2f024855217b74e32f046ced817fa00c8c79af8d51d' /tmp/private-review-transfer.sh | sha256sum -c - >/dev/null
          bash /tmp/private-review-transfer.sh
