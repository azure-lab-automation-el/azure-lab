name: esther-scom-phase5
on:
  workflow_dispatch:
    inputs:
      stages: { description: 'Stages to run', required: false, default: '' }
      media_account: { description: 'Same-region Storage account for install media', required: true, default: 'estherlabmedia8c8c3c92' }
permissions:
  id-token: write
  contents: write
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-scom-phase5__sql
      timeout: 100
      media_account: ${{ inputs.media_account }}
      extra_env: |
        INPUT_STAGES=${{ inputs.stages }}
        INPUT_MEDIA_ACCOUNT=${{ inputs.media_account }}
        STAGES=${{ inputs.stages }}
