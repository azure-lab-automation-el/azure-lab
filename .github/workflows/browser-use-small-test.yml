tic.py > \"$RUNNER_TEMP/diagnostic-safe-result.txt\" 2> \"$RUNNER_TEMP/diagnostic-private-error.txt\";then\n cat \"$RUNNER_TEMP/diagnostic-safe-result.txt\"\nelse\n echo '::error::synthetic_diagnostic_retention_failed; private scratch retained; no diagnosis claim'\n exit 1\nfi\nif [ \"$code\" -ne 0 ];then echo \"::error::browser_use_setup_or_runtime_failed_no_fallback exit=$code\";exit \"$code\";fi\necho '::notice::browser_use_run_ended_UNVERIFIED; inspect encrypted evidence before any PASS claim'\n"},{"name":"Private cleanup","if":"always()","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\npython3 \"$RUNNER_TEMP/mcp-control-source/code/cleanup-control.py\""}]}}}