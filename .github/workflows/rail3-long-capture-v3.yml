ask 077\nw=\"$RUNNER_TEMP/r3\"\nnode -v | grep -Eq '^v(2[0-9]|[3-9][0-9])\\.' || { echo NODE_TOO_OLD; exit 1; }\necho \"node=$(node -v)\"; ch=$(command -v google-chrome || command -v chrome) || { echo NO_CHROME; exit 1; }; \"$ch\" --version | head -1\ncommand -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }\nffmpeg -version | head -1\ncd \"$w/code\"\nnpm ci --ignore-scripts --no-audit\necho '5e670fc595e750a24f37917143e8aee9bcb42102a51e96a25589d266a3a572e9  src/capture-long.mjs' | sha256sum -c -\npython3 - <<'PYEOF'\np='src/capture-long.mjs'\ns=open(p).read()\nold=\"const bt = (await last.el.boundingBox())?.y; r.preflight={target:last.y,reached:got,anchorTop:bt}; if(!(bt>=OFFSET-20 && bt<=OFFSET+20)) throw new Error('SCROLL_NOT_EFFECTIVE');\"\nnew=\"const bt = (await last.el.boundingBox())?.y; const sct = await last.sc.evaluate(sc=>{const d=(sc===document.scrollingElement||sc===document.documentElement||sc===document.body);return d?0:sc.getBoundingClientRect().top;}); r.preflight={target:last.y,reached:got,anchorTop:bt,scrollerTop:sct,expected:sct+OFFSET}; if(!(bt>=sct+OFFSET-20 && bt<=sct+OFFSET+20)) throw new Error('SCROLL_NOT_EFFECTIVE');\"\nassert s.count(old)==1\nopen(p,'w').write(s.replace(old,new))\nPYEOF\necho '2ac539f34eb15b04bbdd7cd43276e0b1da3895e86dd97c229785c8d29403d804  src/capture-long.mjs' | sha256sum -c -\nnode --check src/capture-long.mjs\nnpm test\npw=\"${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}/ffmpeg-1011\"\nmkdir -p \"$pw\"\ncurl --max-time 90 -fsSL https://cdn.playwright.dev/dbazure/download/playwright/builds/ffmpeg/1011/ffmpeg-linux.zip -o \"$w/ffmpeg-pw.zip\"\necho 'ebc74fc5b94830176a3c2914ae96bd8bc7f6a91f4f33890230f84a172ee61ccc  '\"$w/ffmpeg-pw.zip\" | sha256sum -c -\nunzip -qo \"$w/ffmpeg-pw.zip\" -d \"$pw\"\nprintf '' > \"$pw/INSTALLATION_COMPLETE\"\ntest -x \"$pw/ffmpeg-linux\" || chmod +x \"$pw/ffmpeg-linux\"\nOUT_DIR=\"$w/out\" node src/capture-long.mjs\nbash src/post-long.sh \"$w/out\"\nCAPEOF\ntimeout 1200 bash \"$w/cap-body.sh\" > \"$L\" 2>&1\nrc=$?\ncp \"$L\" \"$w/out/private-log.txt\"; grep -E '^(node=|mp4_count=|ffmpeg version)' \"$L\" > \"$R\"\necho \"capture_rc=$rc\" >> \"$R\"; echo \"$rc\" > \"$w/rc\"\necho \"capture_rc=$rc files=$(find \"$w/out\" -type f | wc -l)\"\nexit 0\n","id":"cap"},{"name":"Encrypt and publish private output","env":{"GH_TOKEN":"${{ github.token }}","GH_ISSUE":"${{ github.event.issue.number }}"},"run":"set +e; set -u\numask 077\nw=\"$RUNNER_TEMP/r3\"; mkdir -p \"$w/out\"; bad=0; i=0; total=0\n[ -f \"$w/rc\" ] || { echo \"capture_rc=NOT_RUN\" > \"$w/out/private-report.txt\"; echo NOT_RUN > \"$w/rc\"; }\nrm -f \"$w/out/key\" \"$w/key\" \"$w/source.tgz\"\ntar -czf \"$w/out.tgz\" -C \"$w/out\" . 2>>\"$w/pub.err\" || bad=1\n\"$w/age/age\" -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o \"$w/out.age\" \"$w/out.tgz\" 2>>\"$w/pub.err\" || bad=1\nsplit -b 600000 -d -a 3 \"$w/out.age\" \"$w/outpart.\" 2>>\"$w/pub.err\" || bad=1\ntotal=$(ls \"$w\"/outpart.* 2>/dev/null | wc -l); : > \"$w/status.txt\"\nfor f in \"$w\"/outpart.*; do\n [ -f \"$f\" ] || continue\n n=${f##*.}; path=\"packages/rail3-long3-$GITHUB_RUN_ID-$n.age\"\n jq -n --rawfile c <(base64 -w0 \"$f\") '{message:\"Encrypted rail3 long capture part\",content:$c,branch:\"main\"}' > \"$w/put.json\" 2>>\"$w/pub.err\"\n if gh api -X PUT \"repos/$GITHUB_REPOSITORY/contents/$path\" --input \"$w/put.json\" >/dev/null 2>&1 && gh api \"repos/$GITHUB_REPOSITORY/contents/$path\" --jq .content 2>/dev/null | base64 -d | cmp -s - \"$f\"; then\n  i=$((i+1)); echo \"$n ok $(sha256sum \"$f\" | cut -c1-64)\" >> \"$w/status.txt\"\n else bad=1; echo \"$n FAIL\" >> \"$w/status.txt\"; fi\ndone\n[ \"$total\" -gt 0 ] || bad=1\n{ echo \"run=$GITHUB_RUN_ID parts_ok=$i of $total order=000..$(printf %03d $((total>0?total-1:0)))\"; echo \"cipher_sha256=$(sha256sum \"$w/out.age\" 2>/dev/null | cut -c1-64) tar_sha256=$(sha256sum \"$w/out.tgz\" 2>/dev/null | cut -c1-64)\"; echo \"complete=$([ \"$bad\" = 0 ] && [ \"$i\" = \"$total\" ] && echo yes || echo no) capture_rc=$(cat \"$w/rc\")\"; cat \"$w/status.txt\"; } > \"$w/final.txt\"\ngh issue comment \"$GH_ISSUE\" --repo \"$GITHUB_REPOSITORY\" --body-file \"$w/final.txt\" >/dev/null 2>>\"$w/pub.err\" || bad=1\necho \"publish_bad=$bad parts=$i/$total\"\necho \"$bad\" > \"$w/pubbad\"\nexit 0\n","if":"${{ always() && steps.src.outcome == 'success' }}"},{"name":"Fail if capture or publish failed","if":"${{ always() }}","run":"w=\"$RUNNER_TEMP/r3\"; rc=$(cat \"$w/rc\" 2>/dev/null || echo NOT_RUN); pb=$(cat \"$w/pubbad\" 2>/dev/null || echo NOT_RUN); [ \"$rc\" = 0 ] && [ \"$pb\" = 0 ]"}]}},"concurrency":{"group":"rail3-long-capture-v3","cancel-in-progress":false}}