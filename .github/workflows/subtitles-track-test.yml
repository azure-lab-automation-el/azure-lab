name: 06 - מסילת כתוביות ניסויי תזמון ו-RTL
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  subtitles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {train: [alignment, bidi]}
    steps:
      - name: התקנת ffmpeg ו-fonts לבדיקת bidi
        if: matrix.train == 'bidi'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          ffmpeg -hide_banner -filters | grep -E '[[:space:]]ass[[:space:]]'
      - name: אימות מקור מ-MEGA והרצת רכבת ניסוי
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          TRAIN: ${{ matrix.train }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip
          unzip -qj /tmp/rc.zip '*/rclone' -d /tmp
          export RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER="$MEGA_EMAIL"
          export RCLONE_CONFIG_MEGA_PASS="$(/tmp/rclone obscure "$MEGA_PASSWORD")"
          /tmp/rclone copyto 'mega:JFrog/L7-2026-09-28/source/1-lesson-rail-subtitles-compose-v3-20260928-2248.tar.gz' /tmp/source.tar.gz >/tmp/mega.log 2>&1
          echo '1141306cf9d42ce23565288783a0243db4fffbc0346473bac2d55ded5ea28c65  /tmp/source.tar.gz' | sha256sum -c - >/dev/null
          mkdir -p /tmp/rails && tar -xzf /tmp/source.tar.gz -C /tmp/rails
          cd /tmp/rails
          if [ "$TRAIN" = alignment ]; then
            python3 subtitles/test_tracks.py
          else
            command -v ffmpeg >/dev/null || { echo 'ffmpeg missing'; exit 1; }
            command -v google-chrome >/dev/null || { echo 'google-chrome missing'; exit 1; }
            python3 subtitles/render_corpus.py
            test "$(find compose/corpus -name '*-ass.png' | wc -l)" -eq 7
            test "$(find compose/corpus -name '*-html.png' | wc -l)" -eq 7
            echo 'עבר: 7 זוגות רינדור ASS/Chrome נוצרו. בדיקה ויזואלית אנושית עדיין נדרשת.'
          fi
          echo 'למה: הרכבת העצמאית עברה שלוש חזרות או שבע דוגמאות, לפי הסוג.'
          echo 'צעד הבא: לבדוק דיבור אמיתי, פיסוק על מסך טלפון וכתוביות מאדיו סופי.'
          echo 'קיצור זמן: fixture קצר ו-matrix מקביל. שיפור צופה: פיסוק RTL וזום לקליק.'
      - name: בדיקת שיעור סינתטי ארוך וקטיעות
        if: matrix.train == 'alignment'
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER="$MEGA_EMAIL"
          export RCLONE_CONFIG_MEGA_PASS="$(/tmp/rclone obscure "$MEGA_PASSWORD")"
          /tmp/rclone copyto 'mega:JFrog/L7-2026-09-28/source/1-lesson-rail-long-fixtures-v4-20260928-2337.tar.gz' /tmp/long-tests.tar.gz >/tmp/long-mega.log 2>&1
          echo '7c0afea9af99da848f8301ae824b4d898be0bfda3602857af211eccb47b684dd  /tmp/long-tests.tar.gz' | sha256sum -c - >/dev/null
          mkdir -p /tmp/long-tests && tar -xzf /tmp/long-tests.tar.gz -C /tmp/long-tests
          cd /tmp/long-tests
          python3 subtitles/test_harden.py
