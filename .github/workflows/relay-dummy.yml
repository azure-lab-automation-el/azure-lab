{"name":"relay-dummy stage2 (DUMMY only, encrypted source, OIDC)","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"r":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/relay-dummy pkS=')","runs-on":"ubuntu-24.04","timeout-minutes":5,"permissions":{"id-token":"write","issues":"write","contents":"read"},"steps":[{"name":"Pinned age and encrypted source","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/rl\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tgz\"\necho 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '\"$w/age.tgz\" | sha256sum -c -\ntar -xzf \"$w/age.tgz\" -C \"$w\"\ngh api \"repos/$GITHUB_REPOSITORY/contents/packages/relay-dummy-source-v2.age\" --jq .content | base64 -d > \"$w/source.age\"\necho '06c6b9728f3e4b83b6216ba9ab8d8a116a97457fc6f0531781b08ac9a63d6832  '\"$w/source.age\" | sha256sum -c -\n","id":"src"},{"name":"Decrypt source and remove key","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/rl\"\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\"' EXIT\n\"$w/age/age\" -d -i \"$w/key\" -o \"$w/source.tgz\" \"$w/source.age\"\nrm -f \"$w/key\"\necho '77a7bda4ab304712692e91d65e643ffa54061b71b0e4a7087c3c114983823221  '\"$w/source.tgz\" | sha256sum -c -\nmkdir -p \"$w/code\" && tar -xzf \"$w/source.tgz\" -C \"$w/code\"\n","id":"dec"},{"name":"Install pinned deps, run dummy relay","run":"set -eu\numask 077\nw=\"$RUNNER_TEMP/rl\"; cd \"$w/code\"\npython3 --version | grep -q '^Python 3\\.12\\.' || { echo \"python mismatch\"; exit 3; }\npython3 -m pip install -q --require-hashes --no-deps -r relay-req.txt\ncurl --max-time 60 -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64\necho '77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  cloudflared' | sha256sum -c -\nchmod +x cloudflared\nulimit -c 0 && python3 run_dummy.py\n","env":{"EXPECTED_ACTOR_ID":"332180512","COMMENT_BODY":"${{ github.event.comment.body }}","COMMENT_USER_ID":"${{ github.event.comment.user.id }}","ISSUE_NUMBER":"${{ github.event.issue.number }}","WORKFLOW_REF":"${{ github.workflow_ref }}","GITHUB_TOKEN":"${{ secrets.GITHUB_TOKEN }}","IS_PR":"${{ github.event.issue.pull_request != null }}","COMMENT_ASSOC":"${{ github.event.comment.author_association }}"}}]}},"concurrency":{"group":"relay-dummy","cancel-in-progress":false}}