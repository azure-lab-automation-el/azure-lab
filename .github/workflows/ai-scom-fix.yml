name: ai-scom-fix
on:
  workflow_run:
    workflows: [esther-scom-phase5]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id: {description: "Failed SCOM run id to fix", required: false}
      mode: {type: choice, options: [fix, rollback], default: fix}
      restore_tag: {description: "For rollback: restore/scom-<run>", required: false}
permissions:
  contents: read
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: ai-scom-fix__fix
      timeout: 5
      azure_login: false
      extra_env: |
        INPUT_RUN_ID=${{ inputs.run_id }}
        INPUT_MODE=${{ inputs.mode }}
        WR_RUN_ID=${{ github.event.workflow_run.id }}
        INPUT_RESTORE_TAG=${{ inputs.restore_tag }}
