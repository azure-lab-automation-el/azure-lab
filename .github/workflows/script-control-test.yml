{"name":"Synthetic script main continuation trial","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"browser-use":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/script-control-test'","runs-on":"ubuntu-24.04","timeout-minutes":45,"permissions":{"contents":"write","issues":"read"},"steps":[{"name":"Pinned public tools and encrypted source retrieval","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tar.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/age.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tar.gz\" -C \"$w\"\nmkdir -p \"$RUNNER_TEMP/age\";cp -r \"$w/age\" \"$RUNNER_TEMP/age/age\"\npython3 - \"$w\" <<'PARTS'\nimport json,hashlib,base64,pathlib,subprocess,sys\np=pathlib.Path(sys.argv[1]);parts=[{'path': 'packages/script-source-v1-part-01.age', 'sha256': 'e74f72d51628547efc21628c24dc8185b49571498eddf84de0eb41025e29dc94', 'bytes': 20000}, {'path': 'packages/script-source-v1-part-02.age', 'sha256': 'c2ab663ab5cae920a43962c1d4a496b4bd5d37b5c210abb2f657bbe541639c20', 'bytes': 4188}];out=bytearray()\nfor part in parts:\n r=subprocess.run(['gh','api','repos/azure-lab-automation-el/azure-lab/contents/'+part['path']],capture_output=True,check=True,timeout=25);b=base64.b64decode(json.loads(r.stdout)['content']);assert len(b)==part['bytes'] and hashlib.sha256(b).hexdigest()==part['sha256'];out.extend(b)\nassert hashlib.sha256(out).hexdigest()=='1474334c13a242e35f6969aa30e071649d8ee5cb2ed8f7104ec7e1a8753c6657';(p/'source.age').write_bytes(out)\nPARTS\n"},{"name":"Private source integrity and key removal","shell":"bash","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\"\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\";unset LAB_AGE_KEY' EXIT\n\"$w/age/age\" -d -i \"$w/key\" -o \"$w/source.tar.gz\" \"$w/source.age\" 2>\"$w/private-error\"\nrm -f \"$w/key\";unset LAB_AGE_KEY\nprintf '31defdca21bb6f6f0ebffc4d2df043cb27e2d4c0b7b8a3277b2353d1a43a5207  %s\\n' \"$w/source.tar.gz\" | sha256sum -c - >/dev/null\npython3 - \"$w\" <<'PY'\nimport json,hashlib,tarfile,pathlib,sys\np=pathlib.Path(sys.argv[1]);out=p/'code';out.mkdir();allowed={'setup-control.sh': '18dda8660807b10f528fa352b9f30067693dd626e5f903e2858c707936073772', 'runtime.sh': 'faa7da2dc9548b01e0f10a83ebdbb946b3b5af4a31222d7cc170c9e039f70f82', 'Dockerfile': 'bc00f1ebd7e2b1ae8526f465ec1bbbdc0cc3e6f33ba6407e70576a7a152e2883', 'cleanup-control.py': 'bb289c6f6ed3c70345b8b1e2bccf84b12065724b93bca7416eb30cb549fbef33', 'run-control.sh': 'fa61ecd21b191c56d7ab10c7428f28e9011a016c41d62a6dbb145563c8c3003e', 'fixture.py': '9424ce405c18a475254a638b91ce0e509c18edf2c91ff523a5742b38421d3e50', 'package-lock.json': '878fc0a2ffa0730f44772dc28c06f19a59c662980ccf7f93b77665bbd61b2196', 'mailbox.py': '255e0278a67d8b453b9dc56987543649c42befab40107eb429f144d146e6ee97', 'arbiter.py': '4692da2cce039e1ef07d428aafac0655719121da84106d52a8c8773fbec043ba', 'sandbox.mjs': 'd1069a75bda359eaccca460f1f60b1a66bab206b3cd7e9f003ac63a8baad7750', 'package.json': 'af7baee5fef23f64c2cda5a2f9dab1573c403904acebc98ef404fda7121f232d', 'qualify-seccomp.py': 'f609df4bf9e1db690bff2780aa2ac413fd99e4c038f8facb30391214079bc6e1', 'failure-diagnostic.py': '68c8b8ed8ec35e84f5c0d57962683f7a86d648751d1905b0819839fd5a026212', 'control-requirements.lock': '2b7a6f543b7265f8dec6546b6c9e28849835aa992ea985a40f457e5dab5e9525', 'control_routes.py': '78915116911cd9ad76252199ff564cae2b44945c144e8ef9f82ff4ec5de867ca', 'supervisor.py': '5889511e4b835f0cbe1d5dc30d00970dfd9113b0e06dfeaf6491b6579c5a5976', 'script_route.py': '22081fc0742fa59d5c9594db696120e1a956bdc9f42613947ee8429bc08b043e', 'playwright-requirements.lock': 'e245592a972e44b4221e16379ee77b4c8876cadc1a6ef1e7f88910a0e0fa360d'}\nwith tarfile.open(p/'source.tar.gz') as t:\n ms=t.getmembers();assert len(ms)==len(allowed)+1 and {m.name for m in ms}==set(allowed)|{'sha256.json'}\n for m in ms:\n  assert m.isfile() and not m.issym() and not m.islnk() and m.size<=1048576;d=t.extractfile(m).read();assert len(d)==m.size\n  if m.name!='sha256.json':assert hashlib.sha256(d).hexdigest()==allowed[m.name]\n  (out/m.name).write_bytes(d)\nPY\n"},{"name":"Bounded synthetic direct control with host mailbox","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\ncd \"$RUNNER_TEMP/mcp-control-source/code\"\ncode=0\nif bash setup-control.sh > \"$RUNNER_TEMP/private-control.log\" 2>&1;then result=RUN_ENDED_UNVERIFIED;else code=$?;result=SETUP_FAILED_UNVERIFIED;fi\nif DIAGNOSTIC_RESULT=\"$result\" python3 failure-diagnostic.py > \"$RUNNER_TEMP/diagnostic-safe-result.txt\" 2> \"$RUNNER_TEMP/diagnostic-private-error.txt\";then\n cat \"$RUNNER_TEMP/diagnostic-safe-result.txt\"\nelse\n echo '::error::synthetic_diagnostic_retention_failed; private scratch retained; no diagnosis claim'\n exit 1\nfi\nif [ \"$code\" -ne 0 ];then echo \"::error::browser_use_setup_or_runtime_failed_no_fallback exit=$code\";exit \"$code\";fi\necho '::notice::browser_use_run_ended_UNVERIFIED; inspect encrypted evidence before any PASS claim'\n"},{"name":"Private cleanup","if":"always()","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\npython3 \"$RUNNER_TEMP/mcp-control-source/code/cleanup-control.py\""}]}}}