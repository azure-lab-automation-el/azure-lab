name: ai-scom-fix
on:
  workflow_run:
    workflows: [esther-scom-phase5]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id: {description: "Failed SCOM run id to fix", required: false}
      mode: {type: choice, options: [fix, rollback], default: fix}
      restore_tag: {description: "For rollback: restore/scom-<run>", required: false}
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar xzf /tmp/age.tgz -C /tmp && sudo install -m755 /tmp/age/age /usr/local/bin/age
      - name: Decrypt payload
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        run: |
          printf '%s' "$LAB_AGE_KEY" > /tmp/age.key && chmod 600 /tmp/age.key
          age -d -i /tmp/age.key payload.tar.gz.age | tar xz
          shred -u /tmp/age.key 2>/dev/null || rm -f /tmp/age.key
      - name: Mask sensitive values
        shell: bash
        run: |
          set +x
          mask() { [ -n "$1" ] && echo "::add-mask::$1" || true; }
          for v in "${{ vars.AZURE_CLIENT_ID }}" "${{ vars.AZURE_SUBSCRIPTION_ID }}" "${{ vars.AZURE_TENANT_ID }}" "${{ vars.ESTHER_PASSWORD_CLIENT_ID }}" "${{ vars.ESTHER_PORTAL_CLIENT_ID }}" "${{ vars.ESTHER_READ_CLIENT_ID }}" "${{ vars.ESTHER_WRITE_CLIENT_ID }}"; do mask "$v"; done
          grep -rhoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
          grep -rhoE '\besther-[a-z0-9][a-z0-9-]*' --exclude-dir=.git . 2>/dev/null | sort -u | while IFS= read -r m; do mask "$m"; done
      - name: Run
        env:
          INPUT_RUN_ID: "${{ inputs.run_id }}"
          INPUT_MODE: "${{ inputs.mode }}"
          WR_RUN_ID: "${{ github.event.workflow_run.id }}"
          LAB_AGENT_PAT: "${{ secrets.LAB_AGENT_PAT }}"
          GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
          CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
          CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}"
          COPILOT_GITHUB_TOKEN: "${{ secrets.COPILOT_GITHUB_TOKEN }}"
          INPUT_RESTORE_TAG: "${{ inputs.restore_tag }}"
        run: |
          set +e
          bash .lab-entry/ai-scom-fix__fix.sh > "$RUNNER_TEMP/ai-scom-fix__fix.log" 2>&1
          rc=$?
          age -r age16ynqau96fypeawdgprafasdle3uja0qk0vzsz66w73ct0yk96ecsqncvnk -o "$RUNNER_TEMP/ai-scom-fix__fix.log.age" "$RUNNER_TEMP/ai-scom-fix__fix.log"
          shred -u "$RUNNER_TEMP/ai-scom-fix__fix.log" 2>/dev/null || rm -f "$RUNNER_TEMP/ai-scom-fix__fix.log"
          if [ "$rc" -eq 0 ]; then echo "הסתיים בהצלחה (קוד 0)"; else echo "נכשל (קוד $rc) - הלוג המוצפן בארטיפקט log-ai-scom-fix__fix"; fi
          exit "$rc"
      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-ai-scom-fix__fix
          path: ${{ runner.temp }}/ai-scom-fix__fix.log.age
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ai-scom-fix
          if-no-files-found: ignore
          path: |
            ai.log
            fix.patch
            fix.*.patch
            err.log
            sb2.json

