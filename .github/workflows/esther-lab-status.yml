name: esther-lab-status
on:
  workflow_dispatch:
    inputs:
      media_account: { description: 'Storage account holding the heartbeat table', required: true, default: 'estherlabmedia8c8c3c92' }
permissions: { id-token: write, contents: read, actions: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-lab-status__status
      timeout: 5
      extra_env: |
        INPUT_MEDIA_ACCOUNT=${{ inputs.media_account }}
        RG=rg-learning-monitoring
        A=${{ inputs.media_account }}
