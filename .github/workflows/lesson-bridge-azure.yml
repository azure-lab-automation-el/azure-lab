{"name":"Lesson ChatOps azure","on":{"issue_comment":{"types":["created"]}},"permissions":{"contents":"read"},"jobs":{"azure-cost":{"if":"github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/azure-cost'","runs-on":"ubuntu-24.04","timeout-minutes":8,"permissions":{"contents":"write","id-token":"write","issues":"write"},"steps":[{"uses":"azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c","with":{"client-id":"${{ secrets.AZURE_CLIENT_ID }}","tenant-id":"${{ secrets.AZURE_TENANT_ID }}","subscription-id":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}},{"name":"Private read-only current cost and inventory","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}"},"run":"set -euo pipefail\numask 077\np=\"$RUNNER_TEMP/private-cost\"; mkdir -p \"$p\"\nsid=$(az account show --query id -o tsv)\nprintf '%s' '{\"type\":\"ActualCost\",\"timeframe\":\"MonthToDate\",\"dataset\":{\"granularity\":\"None\",\"aggregation\":{\"cost\":{\"name\":\"Cost\",\"function\":\"Sum\"}},\"grouping\":[{\"type\":\"Dimension\",\"name\":\"ServiceName\"},{\"type\":\"Dimension\",\"name\":\"ResourceId\"}]}}' > \"$p/request.json\"\naz rest --method post --url \"https://management.azure.com/subscriptions/$sid/providers/Microsoft.CostManagement/query?api-version=2025-03-01\" --body @\"$p/request.json\" > \"$p/cost.json\" 2> \"$p/cost-error.txt\" || true\naz resource list -o json > \"$p/resources.json\" 2> \"$p/resources-error.txt\" || true\naz vm list -d -o json > \"$p/vms.json\" 2> \"$p/vms-error.txt\" || true\naz rest --method get --url \"https://management.azure.com/subscriptions/$sid/providers/Microsoft.Compute/disks?api-version=2024-03-02\" > \"$p/disks.json\" 2> \"$p/disks-error.txt\" || true\naz network public-ip list -o json > \"$p/ips.json\" 2> \"$p/ips-error.txt\" || true\naz rest --method get --url \"https://management.azure.com/subscriptions/$sid/providers/Microsoft.Billing/billingProperty/default?api-version=2024-04-01\" > \"$p/billing-property.json\" 2> \"$p/billing-property-error.txt\" || true\nprofile=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get(\"properties\",{}).get(\"billingProfileId\",\"\"))' \"$p/billing-property.json\")\nif [ -n \"$profile\" ]; then az rest --method get --url \"https://management.azure.com$profile/providers/Microsoft.Consumption/lots?api-version=2023-03-01\" > \"$p/credit-lots.json\" 2> \"$p/credit-lots-error.txt\" || true; fi\nspeech=$(az resource list --resource-type Microsoft.CognitiveServices/accounts --query \"[?kind=='SpeechServices' && sku.name=='F0'].id | [0]\" -o tsv)\nif [ -n \"$speech\" ]; then\n  az monitor metrics list-definitions --resource \"$speech\" -o json > \"$p/speech-metric-definitions.json\" 2> \"$p/speech-metric-definitions-error.txt\" || true\n  az monitor metrics list --resource \"$speech\" --metric SynthesizedCharacters,AudioSecondsTranscribed --start-time \"$(date -u +%Y-%m-01T00:00:00Z)\" --end-time \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" --interval PT1H --aggregation Total -o json > \"$p/speech-metrics.json\" 2> \"$p/speech-metrics-error.txt\" || true\n  az rest --method get --url \"https://management.azure.com$speech/usages?api-version=2023-05-01\" > \"$p/speech-usages.json\" 2> \"$p/speech-usages-error.txt\" || true\n  az rest --method get --url \"https://management.azure.com$speech?api-version=2023-05-01\" > \"$p/speech-resource.json\" 2> \"$p/speech-resource-error.txt\" || true\nfi\nsudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null\ntar -czf \"$RUNNER_TEMP/cost.tar.gz\" -C \"$p\" .\nage -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o \"$RUNNER_TEMP/cost.age\" \"$RUNNER_TEMP/cost.tar.gz\"\njq -n --rawfile data \"$RUNNER_TEMP/cost.age\" '{message:\"Encrypted private cost\",content:($data|@base64),branch:\"main\"}' > \"$RUNNER_TEMP/relay.json\"\ngh api -X PUT \"repos/$GH_REPO/contents/packages/azure-cost-${{ github.run_id }}.age\" --input \"$RUNNER_TEMP/relay.json\" >/dev/null\nrm -rf \"$p\" \"$RUNNER_TEMP/cost.tar.gz\"\necho '::notice title=Private Azure cost relay::Encrypted result; no public figures. Review failures privately.'\n"}]}}}