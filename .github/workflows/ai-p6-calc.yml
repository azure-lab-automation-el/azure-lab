name: ai-p6-calc
on:
  workflow_dispatch:
    inputs:
      source_run: {description: "esther-linux-target-read run id", required: true}
permissions:
  contents: read
  actions: read
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: ai-p6-calc__calc
      timeout: 5
      azure_login: false
      extra_env: |
        INPUT_SOURCE_RUN=${{ inputs.source_run }}
