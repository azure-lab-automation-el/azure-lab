name: 09 - אימות גיבוי מסילות ב-MEGA
on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'שם הארכיון בתיקיית source של MEGA'
        required: true
        type: string
      sha256:
        description: 'SHA-256 מקומי צפוי (64 תווים הקסדצימליים)'
        required: true
        type: string
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: אימות עותק MEGA מול SHA-256 צפוי
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          ARCHIVE_NAME: ${{ inputs.archive_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$ARCHIVE_NAME" =~ ^[a-zA-Z0-9._-]+\.tar\.gz$ ]] || { echo 'שם ארכיון לא תקין'; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'SHA-256 לא תקין'; exit 1; }
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip
          unzip -qj /tmp/rc.zip '*/rclone' -d /tmp
          export RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER="$MEGA_EMAIL"
          export RCLONE_CONFIG_MEGA_PASS="$(/tmp/rclone obscure "$MEGA_PASSWORD")"
          /tmp/rclone copyto "mega:JFrog/L7-2026-09-28/source/$ARCHIVE_NAME" /tmp/lesson-rails-source.tar.gz > /tmp/lesson-rails-verify.log 2>&1
          printf '%s  %s\n' "$EXPECTED_SHA256" '/tmp/lesson-rails-source.tar.gz' | sha256sum -c - >/dev/null
          tar -tzf /tmp/lesson-rails-source.tar.gz >/dev/null
          echo LESSON_RAILS_SOURCE_REMOTE_BYTE_VERIFIED
