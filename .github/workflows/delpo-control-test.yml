{"name":"Actual Delpo v7 fixture control and worker repair integration","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"browser-use":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/delpo-control-test'","runs-on":"ubuntu-24.04","timeout-minutes":25,"permissions":{"contents":"write","issues":"read"},"steps":[{"name":"Pinned public tools and encrypted source retrieval","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tar.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/age.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tar.gz\" -C \"$w\"\nmkdir -p \"$RUNNER_TEMP/age\";cp -r \"$w/age\" \"$RUNNER_TEMP/age/age\"\npython3 - \"$w\" <<'PARTS'\nimport json,hashlib,base64,pathlib,subprocess,sys\np=pathlib.Path(sys.argv[1]);parts=[{'path': 'packages/delpo-repair-source-v2-part-01.age', 'sha256': '5e57c308a27e74726390584aa2f007365893a50c37e395351dccde1547855f96', 'bytes': 20000}, {'path': 'packages/delpo-repair-source-v2-part-02.age', 'sha256': '96f97069ccd5ebf8065fc50bc24bfe0746c277925c30fa712571e06e8825356c', 'bytes': 16570}];out=bytearray()\nfor part in parts:\n r=subprocess.run(['gh','api','repos/azure-lab-automation-el/azure-lab/contents/'+part['path']],capture_output=True,check=True,timeout=25);b=base64.b64decode(json.loads(r.stdout)['content']);assert len(b)==part['bytes'] and hashlib.sha256(b).hexdigest()==part['sha256'];out.extend(b)\nassert hashlib.sha256(out).hexdigest()=='b0da86e1822fade90c20b091b9f5f97ff533fd3c831b74e6f0c8ee2da4f5a3a3';(p/'source.age').write_bytes(out)\nPARTS\n"},{"name":"Private source integrity and key removal","shell":"bash","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\"\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\";unset LAB_AGE_KEY' EXIT\n\"$w/age/age\" -d -i \"$w/key\" -o \"$w/source.tar.gz\" \"$w/source.age\" 2>\"$w/private-error\"\nrm -f \"$w/key\";unset LAB_AGE_KEY\nprintf '0cfb02d72d170c432b8c88c576a694a85ca98794c2f8b4501fe6008f747f0b15  %s\\n' \"$w/source.tar.gz\" | sha256sum -c - >/dev/null\npython3 - \"$w\" <<'PY'\nimport json,hashlib,tarfile,pathlib,sys\np=pathlib.Path(sys.argv[1]);out=p/'code';out.mkdir();allowed={'setup-control.sh': '18dda8660807b10f528fa352b9f30067693dd626e5f903e2858c707936073772', 'runtime.sh': 'cae7109b7b35fcfc77533a2e0e72f27be73db38b08bd772e8dc2e4d5297b82d5', 'Dockerfile': 'b9e2ddc949b4d56677943a44f9ee1430ee120392e0501402014315a0501deac1', 'delpo_control_route.py': 'fd84547b312f35c33adea7e942f3db5241c678329c2fcd77ee369e11b401cde9', 'delpo-worker.mjs': '7a01edab2f7ad8405325963c285e640248caa402591f64dec40b533a0d4b2f42', 'delpo-ipc-validation.mjs': '6c01a9f0d24c08de70d1215273b116ba9455fc550eabdd948f82bbf8518bf2c5', 'cleanup-control.py': 'bb289c6f6ed3c70345b8b1e2bccf84b12065724b93bca7416eb30cb549fbef33', 'run-control.sh': 'd6df89f5c78d0d756dfcfbe4caec2cd77a904fbe4ac5699e96bb1deb5729b4c1', 'fixture.py': '9424ce405c18a475254a638b91ce0e509c18edf2c91ff523a5742b38421d3e50', 'package-lock.json': '878fc0a2ffa0730f44772dc28c06f19a59c662980ccf7f93b77665bbd61b2196', 'delpo-provenance.json': '5fd43fc856389fda34df82db8a1cd6ecc34864aee7aaa653ee9ab454b164744d', 'test-delpo-ipc.mjs': '0ae644c69d1c086340e1b179d0bcfd07dac590ec949943ea8117efbafadda41c', 'mailbox.py': '255e0278a67d8b453b9dc56987543649c42befab40107eb429f144d146e6ee97', 'test_repair_route_static.py': '0ae7cc60e5a3cf3c89056e24bc545a8b18dd64e91c1f9f67af92f81cf1558c18', 'arbiter.py': '97cb877c189ea2dbf644cdad1057182e2