name: aca-runner-setup
on:
  workflow_dispatch:
    inputs:
      stage: { type: choice, options: [infra, job, show], default: show }
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: aca-runner-setup__setup
      timeout: 20
      extra_env: |
        RG=rg-learning-monitoring
        LOC=swedencentral
        VNET=esther-se-vnet
        SUB=esther-aca-subnet
        ENVN=esther-aca-env
        JOB=esther-lab-runner
        INPUT_STAGE=${{ inputs.stage }}
