{"name":"Lesson ChatOps bridge","permissions":{"contents":"read"},"jobs":{"command":{"if":"github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && contains(github.event.issue.labels.*.name, 'lesson-chatops') && (startsWith(github.event.comment.body, '/run ') || startsWith(github.event.comment.body, '/apply ') || startsWith(github.event.comment.body, '/playwright ') || startsWith(github.event.comment.body, '/relay-audio ') || startsWith(github.event.comment.body, '/relay-polish ') || github.event.comment.body == '/projects-probe')","runs-on":"ubuntu-24.04","timeout-minutes":10,"concurrency":{"group":"lesson-bridge-update","cancel-in-progress":false},"permissions":{"contents":"write","actions":"write","issues":"write"},"env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}","GH_ISSUE":"${{ github.event.issue.number }}","GH_COMMENT_ID":"${{ github.event.comment.id }}","LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}","LAB_WORKFLOW_PAT":"${{ secrets.LAB_WORKFLOW_PAT }}"},"steps":[{"name":"Read comment body from GitHub API without shell interpolation","run":"gh api \"repos/$GH_REPO/issues/comments/$GH_COMMENT_ID\" --jq .body > \"$RUNNER_TEMP/command.txt\""},{"name":"Allowlisted apply or dispatch","run":"set -euo pipefail\numask 077\ncommand=$(cat \"$RUNNER_TEMP/command.txt\")\ncase \"$command\" in\n  '/playwright '*)\n    printf '%s' \"${command#'/playwright '}\" > \"$RUNNER_TEMP/browser-url.txt\"\n    python3 - \"$RUNNER_TEMP/browser-url.txt\" > \"$RUNNER_TEMP/dispatch.json\" <<'PYURL'\nimport json,sys,urllib.parse\nurl=open(sys.argv[1]).read().strip();u=urllib.parse.urlsplit(url)\nassert u.scheme=='https' and u.hostname in ('example.com','docs.jfrog.com','docs.squaredup.com','playwright.dev')\nassert not u.username and not u.password and u.port is None and not u.query and not u.fragment and len(url)<=2000\nprint(json.dumps({'ref':'main','inputs':{'package_path':'packages/recipient-test-20260930.age','package_id':'browser-public-read','rails':'browser','mode':'fixture','browser_url':url}}))\nPYURL\n    gh api -X POST \"repos/$GH_REPO/actions/workflows/lesson-pipeline.yml/dispatches\" --input \"$RUNNER_TEMP/dispatch.json\" >/dev/null\n    echo 'Browser dispatched; not QA' > \"$RUNNER_TEMP/status.txt\"\n    ;;\n  '/relay-audio '*)\n    rid=${command#'/relay-audio '}\n    [[ \"$rid\" =~ ^[0-9]{8,15}$ ]]\n    w=\"$RUNNER_TEMP/audio-review\";mkdir -p \"$w/in\" \"$w/cipher\"\n    gh api \"repos/$GH_REPO/actions/runs/$rid\" > \"$w/run.json\"\n    python3 - \"$w/run.json\" <<'PYREVIEW'\nimport json,sys\nj=json.load(open(sys.argv[1]));assert j['path']=='.github/workflows/lesson-pipeline.yml' and j['event']=='workflow_dispatch' and j['status']=='completed'\nPYREVIEW\n    gh run download \"$rid\" --repo \"$GH_REPO\" --name audio-20260930-docs-draft-v1 --dir \"$w/in\"\n    sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null\n    printf '%s' \"$LAB_AGE_KEY\" > \"$w/key\"\n    age -d -i \"$w/key\" -o \"$w/audio.tar.gz\" \"$w/in/audio-20260930-docs-draft-v1.tar.gz.age\"\n    rm -f \"$w/key\"\n    age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o \"$w/cipher/audio.age\" \"$w/audio.tar.gz\"\n    rm -f \"$w/audio.tar.gz\"\n    split -b 700000 -d -a 3 \"$w/cipher/audio.age\" \"$w/cipher/part-\"\n    for p in \"$w/cipher\"/part-*; do\n      suffix=${p##*/part-}\n      jq -n --rawfile data \"$p\" '{message:\"Encrypted audio, pending QA\",content:($data|@base64),branch:\"main\"}' > \"$w/upload.json\"\n      gh api -X PUT \"repos/$GH_REPO/contents/packages/audio-review-$rid-$suffix.age\" --input \"$w/upload.json\" >/dev/null\n    done\n    count=$(find \"$w/cipher\" -name 'part-*' | wc -l)\n    echo \"::notice title=Audio review relay::run=$rid parts=$count private_review_only=true\"\n    printf 'Audio run=%s parts=%s; not QA.\\n' \"$rid\" \"$count\" > \"$RUNNER_TEMP/status.txt\"\n    rm -rf \"$w\"\n    ;;\n  '/relay-polish '*)\n    rid=${command#'/relay-polish '}\n    test \"$rid\" = 36823031382\n    w=\"$RUNNER_TEMP/polish-review\";mkdir -p \"$w/in\"\n    gh api \"repos/$GH_REPO/actions/runs/$rid\" > \"$w/run.json\"\n    python3 - \"$w/run.json\" <<'PYREVIEW'\nimport json,sys\nj=json.load(open(sys.argv[1]));assert j['path']=='.github/workflows/lesson-pipeline.yml' and j['event']=='workflow_dispatch' and j['status']=='completed'\nassert j['display_title']=='rail3-discover:rail3-discovery-v34'\nPYREVIEW\n    gh run download \"$rid\" --repo \"$GH_REPO\" --name rail3-private-discovery --dir \"$w/in\"\n    test -s \"$w/in/rail3-output.tar.gz.age\"\n    curl --max-time 90 -fsSL -o \"$w/age.tgz\" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz\n    echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '\"$w/age.tgz\" | sha256sum -c - >/dev/null\n    tar -xzf \"$w/age.tgz\" -C \"$w\"\n    printf '%s' \"$LAB_AGE_KEY\" > \"$w/key\"\n    test \"$(\"$w/age/age-keygen\" -y \"$w/key\")\" = 'age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl'\n    \"$w/age/age\" -d -i \"$w/key\" -o \"$w/private.tar.gz\" \"$w/in/rail3-output.tar.gz.age\"\n    rm \"$w/key\"\n    python3 - \"$w\" <<'PYREVIEW'\nimport tarfile,json,sys,pathlib,zlib,base64\np=pathlib.Path(sys.argv[1])\nwith tarfile.open(p/'private.tar.gz') as t:\n    ms=t.getmembers();assert len(ms)<=1000 and sum(m.size for m in ms)<100000000\n    for m in ms:assert not m.name.startswith('/') and '..' not in m.name.split('/') and (m.isfile() or m.isdir())\n    rs=[m for m in ms if m.name.removeprefix('./')=='discovery-result.json'];assert len(rs)==1\n    r=json.load(t.extractfile(rs[0]));assert r['track']=='jfrog' and r['purpose']=='repository-selector-discovery' and r['quality_status']=='NOT_READY'\n    es=[m for m in ms if m.name.removeprefix('./')=='failure-private.json'];assert len(es)==1\n    (p/'record.json').write_bytes(t.extractfile(es[0]).read())\ncode=json.loads(zlib.decompress(base64.b64decode('')))\nfor n,s in code.items():assert n in ('stored-evidence-classifier.mjs','stored-evidence-classifier.test.mjs','print-stored-summary.mjs');(p/n).write_text(s)\nPYREVIEW\n    node --input-type=module - \"$w\" > \"$w/classify-private.log\" 2>&1 <<'JSREVIEW'\nimport fs from 'node:fs';const w=process.argv[2];const {classifyStored}=await import(w+'/stored-evidence-classifier.mjs');fs.writeFileSync(w+'/summary.json',JSON.stringify(classifyStored(JSON.parse(fs.readFileSync(w+'/record.json','utf8')))));\nJSREVIEW\n    node \"$w/print-stored-summary.mjs\" \"$w/summary.json\" 2> \"$w/printer-private.log\" | sed 's/^/::notice title=Stored safe diagnosis::/'\n    echo NOT_READY > \"$RUNNER_TEMP/status.txt\"\n    rm -rf \"$w\"\n    ;;\n  '/projects-probe')\n    python3 - > \"$RUNNER_TEMP/ps.txt\" 2> \"$RUNNER_TEMP/pe.txt\" <<'PYOWNER'\nimport zlib,base64\nexec(zlib.decompress(base64.b64decode('')))\nPYOWNER\n    cat \"$RUNNER_TEMP/ps.txt\"\n    echo 'Private read' > \"$RUNNER_TEMP/status.txt\"\n    ;;\n  '/run '*)\n    payload=${command#'/run '}\n    printf '%s' \"$payload\" > \"$RUNNER_TEMP/run.json\"\n    python3 - \"$RUNNER_TEMP/run.json\" > \"$RUNNER_TEMP/dispatch.json\" <<'PY'\nimport json,re,sys\nx=json.load(open(sys.argv[1]));assert set(x)=={'workflow','package_path','package_id','rails','mode'}\nassert x['workflow']=='lesson-pipeline.yml'\nassert re.fullmatch(r'packages/[A-Za-z0-9_./-]+\\.age',x['package_path']) and '..' not in x['package_path'].split('/')\nassert re.fullmatch(r'[A-Za-z0-9_-]{1,100}',x['package_id'])\nassert x['rails'] in ('all','metric','validate','audio','capture','simulation','discover','recipient-proof','benchmark','rail3-discover','rail4-visuals','audio-verify','rail5-tests','rail6-model-tests')\nassert x['mode'] in ('production','fixture')\nprint(json.dumps({'ref':'main','inputs':{k:x[k] for k in ('package_path','package_id','rails','mode')}}))\nPY\n    gh api -X POST \"repos/$GH_REPO/actions/workflows/lesson-pipeline.yml/dispatches\" --input \"$RUNNER_TEMP/dispatch.json\" >/dev/null\n    echo 'Dispatched; not QA.' > \"$RUNNER_TEMP/status.txt\"\n    ;;\n  '/apply '*)\n    payload=${command#'/apply '}\n    [ \"${#payload}\" -le 45000 ] || exit 2\n    printf '%s' \"$payload\" | base64 -d > \"$RUNNER_TEMP/update.age\"\n    sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null\n    printf '%s' \"$LAB_AGE_KEY\" > \"$RUNNER_TEMP/age.key\"\n    age -d -i \"$RUNNER_TEMP/age.key\" -o \"$RUNNER_TEMP/update.json\" \"$RUNNER_TEMP/update.age\"\n    rm -f \"$RUNNER_TEMP/age.key\"\n    python3 - \"$RUNNER_TEMP/update.json\" > \"$RUNNER_TEMP/put.json\" <<'PY'\nimport base64,hashlib,json,re,sys,zlib\nraw=open(sys.argv[1],'rb').read()\ncompressed=raw.startswith(b'Z1:')\nif compressed:\n q=zlib.decompressobj();raw=q.decompress(raw[3:],100000)\n assert q.eof and not q.unused_data and not q.unconsumed_tail\nx=json.loads(raw);assert set(x)=={'path','content_base64','sha256','message'}\nallowed={'packages/rail4-portable-tests-v4.tar.gz.age': ['2c0954b2e77777b8be35bce56000162433f73d5432f358b2bdf74b399f384090', 26028], '.github/workflows/lesson-pipeline.yml': ['089c97af7ab8c89fb79671ee80c59a12fe000894ce66ddb844371b725fa591ff', 28802], '.github/workflows/delpo-control-test.yml': ['d11e5f4ad79a5caac162210caa8838f5b495a0b250aeadca276360c964445a65', 6928], '.github/workflows/lesson-bridge-delpo.yml': ['990698577d5208e3550014ed2860f28891f6efd11c5f1afe19a4838a9eaab37c', 15419], '.github/workflows/lesson-bridge-projects.yml': ['ecff7946a5f52736fdd5af72611968683b40ce395adee0580133416663eceaf2', 5533], '.github/workflows/lesson-bridge-azure.yml': ['3daaab8f60c79135bf52f9d06639db806411fac58006eadab85407b236224004', 4324], '.github/workflows/lesson-bridge-audio.yml': ['1edb1d944adbab490b3d93757d9b0f0ec4a4e8a8cc2901c82e6137558f6d1b4e', 6810], '.github/workflows/delpo-wrong-test.yml': ['541030ee0920b0edac950a4346ea9c7aa337613715ae8273044a7612702528f1', 7485], '.github/workflows/script-install-diagnostic-v3.yml': ['d90285dc6b49d5077ce021b6539d5030575963faeb81757790300c259c1dd2ef', 5891], '.github/workflows/script-install-diagnostic-v2.yml': ['6116c32fff093631baf30ef50dc8fdad575a5652ad78b7c92f78a7a6d90bf1d7', 5646], '.github/workflows/bu-flash-preflight.yml': ['419bb1481532fe0776773250a9e7a8c1f5c28a5bd139beb5c141bd6881fdf3c3', 6789], '.github/workflows/script-control-test.yml': ['9116a1692fe5e931551f54d74ededbceb123c4471450ba872919257df1292492', 5777], '.github/workflows/browser-use-small-test.yml': ['48bebe542129f18ebac9139fb1329f0a34486bd521c26ec2bc484ae87bbed837', 6704], '.github/workflows/browser-use-test.yml': ['56a692cd5c8c3c48e79d18782eec7c226bd7b057439dc0176fca44752cd41ba6', 6663], '.github/workflows/model-text.yml': ['55eb9f930780799f3735c887b0ff80e20cc4f6587b9d12050f78e74fe7752c1b', 4562], '.github/workflows/rail3-docs-capture.yml': ['ae259970fbb7860d3da6e72d8bc02b97d9fcf07dee74ee13f58b5fdc479976e4', 7780], '.github/workflows/freecode-qualify-test.yml': ['92af27002cda0b14a90095eccc056c1e49e28eced98342a4e0b0b83afca1e729', 9063], '.github/workflows/bluetools-publish.yml': ['70f6c6c7ccf577a968fb9663c4daaf4533faed85c7c67cdf37e7c00326b0d678', 2669], '.github/workflows/bluetools-source-backup.yml': ['fee7e1e49d9a96ba6a3b77950c681087b511a15f91f279433b4472a9925659b9', 3301], 'publish/files/login_job.tgz.age': ['aca4b852053dc03b3a427f63d10a3abe14b696b7d818285f44c9cff9a3a229ad', 4545], '.github/workflows/bluetools-dispatch.yml': ['e9ebce5c03bb6138c12e733350d4dbd3d02fc0148bc63ee66b7116acf7220b36', 2279], '.github/workflows/bluetools-readlog.yml': ['299fcbe4dbf4b645bfc7b62dda0e1d0006f2129841e14d30a5365b81789799fb', 4253], 'publish/files/bootstrap.yml': ['6d6fa1793cf6ac68af899fa5353d9d3e6a1a2c487a9b8b828935d1fb69400905', 1007]}\nif compressed:\n assert x['path'] in allowed and x['sha256']==allowed[x['path']][0]\n assert len(base64.b64decode(x['content_base64'],validate=True))==allowed[x['path']][1]\npath=x['path'];assert isinstance(path,str) and (re.fullmatch(r'(?:pipeline|packages)/[A-Za-z0-9_.-]+\\.age',path) or path in ('.github/workflows/lesson-pipeline.yml','.github/workflows/lesson-chatops-bridge.yml','.github/workflows/esther-guard-plaintext.yml') or (path in allowed and x['sha256']==allowed[path][0] and len(base64.b64decode(x['content_base64'],validate=True))==allowed[path][1]))\nassert '..' not in path.split('/') and not path.endswith('/')\ndata=base64.b64decode(x['content_base64'],validate=True)\nassert len(data)<=1048576 and hashlib.sha256(data).hexdigest()==x['sha256']\nassert isinstance(x['message'],str) and 5<=len(x['message'])<=120\nprint(json.dumps({'path':path,'content':x['content_base64'],'message':x['message']}))\nPY\n    path=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))[\"path\"])' \"$RUNNER_TEMP/put.json\")\n    if [[ $path == .github/workflows/* ]]; then\n      test -n \"$LAB_WORKFLOW_PAT\" || { echo 'Missing workflow PAT' >&2; exit 3; }\n      export GH_TOKEN=$LAB_WORKFLOW_PAT\n    fi\n    sha=$(gh api \"repos/$GH_REPO/contents/$path?ref=main\" --jq .sha 2>/dev/null || true)\n    python3 - \"$RUNNER_TEMP/put.json\" \"$sha\" > \"$RUNNER_TEMP/request.json\" <<'PY'\nimport json,sys\nx=json.load(open(sys.argv[1]));x.pop('path');x['branch']='main'\nif sys.argv[2]:x['sha']=sys.argv[2]\njson.dump(x,sys.stdout)\nPY\n    gh api -X PUT \"repos/$GH_REPO/contents/$path\" --input \"$RUNNER_TEMP/request.json\" --jq .content.html_url > \"$RUNNER_TEMP/status.txt\"\n    ;;\n  *) exit 2 ;;\nesac\ngh issue comment \"$GH_ISSUE\" --repo \"$GH_REPO\" --body-file \"$RUNNER_TEMP/status.txt\"\n"}]},"azure-read":{"if":"github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/azure-read'","runs-on":"ubuntu-24.04","timeout-minutes":8,"permissions":{"contents":"read","id-token":"write","issues":"write"},"steps":[{"uses":"azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c","with":{"client-id":"${{ secrets.AZURE_CLIENT_ID }}","tenant-id":"${{ secrets.AZURE_TENANT_ID }}","subscription-id":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}},{"name":"Read only subscription policy and available small VM SKUs","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}"},"run":"set -euo pipefail\nsid=$(az account show --query id -o tsv)\naz rest --method get --url \"https://management.azure.com/subscriptions/$sid?api-version=2022-12-01\" --query '{state:state,quotaId:subscriptionPolicies.quotaId,spendingLimit:subscriptionPolicies.spendingLimit}' -o json > \"$RUNNER_TEMP/policy.json\"\naz vm list-skus --location westeurope --resource-type virtualMachines --all -o json > \"$RUNNER_TEMP/skus.json\"\naz vm list-usage --location westeurope -o json > \"$RUNNER_TEMP/usage.json\"\npython3 - \"$RUNNER_TEMP\" <<'PYAZ'\nimport json,pathlib,sys,re\np=pathlib.Path(sys.argv[1]);lines=['Read-only Azure eligibility probe. No resources or billing settings changed.']\nd=json.load(open(p/'policy.json'))\nfor k in ('state','quotaId','spendingLimit'):\n    v=str(d.get(k));v=v if re.fullmatch(r'[A-Za-z0-9_.-]{1,100}',v) else 'unverified';lines.append(k+'='+v)\nfor x in json.load(open(p/'skus.json')):\n    if x.get('name') in ('Standard_B1s','Standard_B2ats_v2','Standard_B2pts_v2'):\n        lines.append(x['name']+': restrictions='+str(len(x.get('restrictions',[]))))\n        for r in x.get('restrictions',[]):\n            reason=str(r.get('reasonCode','unknown'));typ=str(r.get('type','unknown'))\n            if re.fullmatch(r'[A-Za-z0-9_-]{1,80}',reason) and re.fullmatch(r'[A-Za-z0-9_-]{1,80}',typ):lines.append(x['name']+': '+typ+'='+reason)\nfor x in json.load(open(p/'usage.json')):\n    if x.get('name',{}).get('value') in ('cores','virtualMachines','standardBSFamily','standardBsv2Family','standardBpsv2Family'):\n        lines.append(x['name']['value']+': usage='+str(x['currentValue'])+', limit='+str(x['limit']))\nlines.append('Free 12-month VM entitlement is NOT proven by quotaId or SKU availability. Exact offer expiry/free-meter allowance still required.')\n(p/'azure-safe.txt').write_text('\\n'.join(lines)+'\\n')\nPYAZ\ngh issue comment 2 --repo \"$GH_REPO\" --body-file \"$RUNNER_TEMP/azure-safe.txt\"\nwhile IFS= read -r line; do printf '::notice title=Azure read-only probe::%s\\n' \"$line\"; done < \"$RUNNER_TEMP/azure-safe.txt\"\n"}]},"lesson-backup":{"if":"github.event.issue.number == 2 && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/backup ')","runs-on":"ubuntu-24.04","timeout-minutes":12,"concurrency":{"group":"lesson-mega-backup","cancel-in-progress":false},"permissions":{"contents":"read","issues":"write"},"steps":[{"name":"MEGA backup byte check","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}","COMMENT_ID":"${{ github.event.comment.id }}","LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}","MEGA_EMAIL":"${{ secrets.MEGA_EMAIL }}","MEGA_PASSWORD":"${{ secrets.MEGA_PASSWORD }}"},"run":"set -euo pipefail\numask 077\necho \"::add-mask::$MEGA_EMAIL\"\necho \"::add-mask::$MEGA_PASSWORD\"\nstage=setup\ntrap 'echo \"::error title=Backup phase::$stage failed\"' ERR\nif [ -n \"$MEGA_EMAIL\" ]; then echo '::notice title=Backup credentials::MEGA_EMAIL_PRESENT=true'; else echo '::notice title=Backup credentials::MEGA_EMAIL_PRESENT=false'; fi\nif [ -n \"$MEGA_PASSWORD\" ]; then echo '::notice title=Backup credentials::MEGA_PASSWORD_PRESENT=true'; else echo '::notice title=Backup credentials::MEGA_PASSWORD_PRESENT=false'; fi\nstage=credential-presence\ntest -n \"$MEGA_EMAIL\" && test -n \"$MEGA_PASSWORD\"\nw=\"$RUNNER_TEMP/backup\"; mkdir -p \"$w/plain\" \"$w/readback\"\nstage=comment-read\ngh api \"repos/$GH_REPO/issues/comments/$COMMENT_ID\" --jq .body > \"$w/comment.txt\"\npython3 - \"$w\" <<'PYBACK'\nimport pathlib,base64,sys\np=pathlib.Path(sys.argv[1]);s=(p/'comment.txt').read_text();assert s.startswith('/backup ') and len(s)<=65000\n(p/'source.age').write_bytes(base64.b64decode(s[8:].strip(),validate=True))\nPYBACK\nstage=age-install\nsudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null\nprintf '%s' \"$LAB_AGE_KEY\" > \"$w/key\"\nstage=decrypt\nage -d -i \"$w/key\" -o \"$w/source.tar\" \"$w/source.age\"; rm \"$w/key\"\npython3 - \"$w\" <<'PYBACK'\nimport tarfile,pathlib,hashlib,sys\np=pathlib.Path(sys.argv[1]);import json,zlib,base64;expected=json.loads(zlib.decompress(base64.b64decode('')))\nwith tarfile.open(p/'source.tar') as t:\n    assert t.getnames() and set(t.getnames()).issubset(expected) and len(t.getnames())==len(set(t.getnames()))\n    for m in t:\n        assert m.isfile() and m.size<100000\n        data=t.extractfile(m).read();assert hashlib.sha256(data).hexdigest()==expected[m.name]\n        (p/'plain'/m.name).write_bytes(data)\nPYBACK\nstage=rclone-download\ncurl -fsSL -o \"$w/rc.zip\" https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip\necho \"417e3da236f3a12d292da4e7287d67b1df558b8c2b280d092e563958ed724be7  $w/rc.zip\" | sha256sum -c - >/dev/null\nunzip -qj \"$w/rc.zip\" '*/rclone' -d \"$w\"\nexport RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER=\"$MEGA_EMAIL\"\nexport RCLONE_CONFIG_MEGA_PASS=\"$(\"$w/rclone\" obscure \"$MEGA_PASSWORD\")\"\nstage=mega-upload\n\"$w/rclone\" copy \"$w/plain\" mega:JFrog/pipeline-20260930/source --immutable > \"$w/upload.log\" 2>&1\nstage=mega-readback\nfor f in \"$w/plain\"/*; do\n  name=$(basename \"$f\")\n  \"$w/rclone\" copyto \"mega:JFrog/pipeline-20260930/source/$name\" \"$w/readback/$name\" > \"$w/readback.log\" 2>&1\n  stage=byte-compare\n  cmp \"$f\" \"$w/readback/$name\"\ndone\necho '::notice title=MEGA backup proof::Plaintext archive downloaded byte-identically; no deletion.'\nrm -rf \"$w\"\n"}]}},"on":{"issue_comment":{"types":["created"]}}}