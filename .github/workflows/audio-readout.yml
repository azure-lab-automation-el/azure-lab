name: Audio job read-out (fixed run, phase-separated, encrypted)
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  readout:
    if: github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/audio-readout'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      TARGET_RUN: '37003267191'
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: P1 install age (hash pinned)
        shell: bash
        run: |
          set -u; set +e
          umask 077
          d="$RUNNER_TEMP"; mkdir -p "$d/x" "$d/exp"
          curl --max-time 90 -fsSL -o "$d/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz; rc=$?
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$d/age.tgz" | sha256sum -c - >/dev/null; rc2=$?
          tar -xzf "$d/age.tgz" -C "$d"; rc3=$?
          echo "::notice::P1 curl_rc=$rc sha_rc=$rc2 untar_rc=$rc3"
          [ "$rc$rc2$rc3" = 000 ] || exit 1
      - name: P2 fetch artifact, decrypt, untar
        env:
          LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        shell: bash
        run: |
          set -u; set +e
          umask 077
          d="$RUNNER_TEMP"; S="$d/state"; : > "$S"
          AID=$(gh api "repos/$GH_REPO/actions/runs/$TARGET_RUN/artifacts" --jq ".artifacts[] | select(.name==\"audio-job-encrypted-$TARGET_RUN\") | .id" 2>/dev/null | head -1)
          if [ -z "$AID" ]; then echo "::notice::P2 artifact_found=no"; echo artifact_found=no >> "$S"; exit 0; fi
          echo artifact_found=yes >> "$S"; echo "::notice::P2 artifact_found=yes"
          gh api "repos/$GH_REPO/actions/artifacts/$AID/zip" > "$d/a.zip" 2>/dev/null; rc=$?; echo "zip_rc=$rc" >> "$S"
          unzip -qo "$d/a.zip" -d "$d/x" 2>/dev/null; rc=$?; echo "unzip_rc=$rc" >> "$S"
          printf '%s' "$LAB_AGE_KEY" > "$d/k"
          "$d/age/age" -d -i "$d/k" -o "$d/r.tgz" "$d/x/result.tgz.age" 2>/dev/null; rc=$?; rm -f "$d/k"; echo "decrypt_rc=$rc" >> "$S"
          if [ "$rc" = 0 ]; then mkdir -p "$d/r"; tar -xzf "$d/r.tgz" -C "$d/r"; echo "untar_rc=$?" >> "$S"; fi
          echo "::notice::P2 $(tr '\n' ' ' < "$S")"
      - name: P3 Speech key occurrence count (count only)
        shell: bash
        run: |
          set -u; set +e
          d="$RUNNER_TEMP"; S="$d/state"
          if ! grep -q '^untar_rc=0$' "$S"; then echo "kc=none" >> "$S"; echo "::notice::P3 skipped (no extracted files)"; exit 0; fi
          rid=$(az resource list --resource-type Microsoft.CognitiveServices/accounts --query "[?kind=='SpeechServices' && sku.name=='F0'].id" -o tsv 2>/dev/null); r1=$?
          nm=$(az resource show --ids "$rid" --query name -o tsv 2>/dev/null); r2=$?; rg=$(printf '%s' "$rid" | sed -E 's#.*/resourceGroups/([^/]+)/.*#\1#')
          key=$(az cognitiveservices account keys list -g "$rg" -n "$nm" --query key1 -o tsv 2>/dev/null); r3=$?
          echo "::notice::P3 az_list_rc=$r1 az_show_rc=$r2 az_keys_rc=$r3 rid_nonempty=$([ -n "$rid" ] && echo y || echo n)"
          [ "$r3" = 0 ] || key=""
          if [ -z "$key" ]; then echo "kc=unavailable" >> "$S"; echo "::notice::P3 kc=unavailable"; exit 0; fi
          echo "::add-mask::$key"
          KC=$( { grep -rcaF -- "$key" "$d/r" 2>/dev/null || true; } | awk -F: '{s+=$NF} END{print s+0}')
          echo "kc=$KC" >> "$S"; echo "::notice::P3 key_occurrences=$KC"
      - name: P4 summary and gated audio export (encrypted)
        shell: bash
        run: |
          set -u; set +e
          umask 077
          d="$RUNNER_TEMP"; S="$d/state"; OUT="$d/out.txt"; cp "$S" "$OUT"
          KC=$(sed -n 's/^kc=//p' "$S" | head -1)
          if [ "${KC:-}" = 0 ]; then
            echo "== files (path bytes sha256)" >> "$OUT"
            (cd "$d/r" && find . -type f -print0 | sort -z | xargs -0 -r sha256sum | awk '{print $2, $1}' | while read p h; do echo "$p $(stat -c %s "$p") $h"; done) >> "$OUT"
            for f in out/report.json out/FAILED.json; do [ -f "$d/r/$f" ] && { echo "== $f"; head -c 6000 "$d/r/$f"; echo; } >> "$OUT"; done
            echo "== job.log enum lines" >> "$OUT"
            grep -E '^(JOB_|SCRUB_|COMMENT_|RESOURCE_|KEY_|PLAN_|PRESPEND_)' "$d/r/job.log" >> "$OUT" 2>/dev/null
            echo "== job.log tail (last 40 lines)" >> "$OUT"
            tail -n 40 "$d/r/job.log" >> "$OUT" 2>/dev/null
          else
            echo "raw_sections=withheld (kc=${KC:-unset})" >> "$OUT"
            [ -d "$d/r" ] && (cd "$d/r" && find . -type f -print0 | sort -z | xargs -0 -r sha256sum | awk '{print $2, $1}' | while read p h; do echo "$p $(stat -c %s "$p") $h"; done) >> "$OUT"
          fi
          "$d/age/age" -a -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$d/exp/summary.age" "$OUT"; rc=$?
          echo "::notice::P4 summary_age_rc=$rc bytes=$(stat -c %s "$d/exp/summary.age" 2>/dev/null || echo 0)"
          if [ "${KC:-}" = 0 ] && grep -q '^untar_rc=0$' "$S" && [ -d "$d/r/out" ]; then
            tar -czf "$d/audio.tgz" -C "$d/r" out; rc=$?
            "$d/age/age" -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$d/exp/audio.age" "$d/audio.tgz"; rc2=$?
            echo "::notice::P4 audio_tar_rc=$rc audio_age_rc=$rc2 tgz_bytes=$(stat -c %s "$d/audio.tgz") tgz_sha256=$(sha256sum "$d/audio.tgz" | cut -d' ' -f1)"
          else echo "::notice::P4 audio_export=skipped"; fi
      - name: P5 short-retention encrypted artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audio-readout-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/exp/
          retention-days: 2
          if-no-files-found: ignore
      - name: P6 encrypted diagnostic marker in repo (review key only, summary only)
        if: ${{ always() }}
        shell: bash
        run: |
          set -u; set +e
          d="$RUNNER_TEMP"
          [ -s "$d/exp/summary.age" ] || { echo "::notice::P6 no summary"; exit 0; }
          jq -n --rawfile c "$d/exp/summary.age" '{message:"Encrypted audio read-out",content:($c|@base64),branch:"main"}' > "$d/put.json"; rc=$?
          gh api -X PUT "repos/$GH_REPO/contents/packages/audio-readout-$RUN_ID.age" --input "$d/put.json" >/dev/null 2>"$d/put.err"; rc2=$?
          echo "::notice::P6 jq_rc=$rc put_rc=$rc2"
