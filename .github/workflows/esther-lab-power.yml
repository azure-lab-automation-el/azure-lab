name: esther-lab-power
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: start (DC first, then Esther) / stop (Esther first, then DC) / status
        type: choice
        options: [status, start, stop, linux-on, linux-off, linux-idle]
        default: status
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-lab-power__power
      extra_env: |
        INPUT_ACTION=${{ inputs.action }}
