name: rebuild-teardown
on:
  workflow_dispatch:
    inputs:
      confirm:
        type: choice
        options: [DRYRUN, DELETE]
        default: DRYRUN
        description: 'DRYRUN lists what would go; DELETE removes it'
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: rebuild-teardown__teardown
      timeout: 25
      extra_env: |
        INPUT_CONFIRM=${{ inputs.confirm }}
