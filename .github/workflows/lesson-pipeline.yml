name: Lesson pipeline - parallel rails
permissions:
  contents: read
concurrency:
  group: lesson-${{ inputs.package_id }}-${{ inputs.rails }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  metric:
    if: inputs.rails == 'all' || inputs.rails == 'metric' || inputs.rails == 'audio'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
    - &id001
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - &id002
      run: 'sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age
        >/dev/null

        '
    - &id003
      env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'set -euo pipefail

        umask 077

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/lesson-bootstrap.key"

        age -d -i "$RUNNER_TEMP/lesson-bootstrap.key" -o "$RUNNER_TEMP/lesson-bootstrap.sh"
        pipeline/bootstrap.sh.age

        rm -f "$RUNNER_TEMP/lesson-bootstrap.key"

        bash "$RUNNER_TEMP/lesson-bootstrap.sh"

        rm -f "$RUNNER_TEMP/lesson-bootstrap.sh"

        '
    - &id004
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
      if: inputs.mode == 'production'
      with: &id006
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: 'umask 077

        set +e

        python3 - <<''PYMETRIC''

        from pathlib import Path

        p=Path(''pipeline/metric.sh'');s=p.read_text().replace(''AudioSecondsTranscribed'',''SynthesizedCharacters'').replace(''18000'',''500000'')

        s=s.replace("used=sum(vals);print", "used=sum(vals);assert used+8746+50000<500000,
        ''F0 TTS headroom insufficient'';print")

        s=s.replace("metrics[0].get(''errorCode'')", "metrics[0].get(''errorCode'')
        not in (None, ''Success'')")

        p.write_text(s)

        PYMETRIC

        bash pipeline/metric.sh > "$RUNNER_TEMP/metric-private.log" 2>&1

        rc=$?

        set -e

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r
        age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/metric.age"
        "$RUNNER_TEMP/metric-private.log"

        jq -n --rawfile data "$RUNNER_TEMP/metric.age" ''{message:"Encrypted F0 usage
        evidence",content:($data|@base64),branch:"main"}'' > "$RUNNER_TEMP/metric-relay.json"

        GH_TOKEN=''${{ github.token }}'' gh api -X PUT ''repos/${{ github.repository
        }}/contents/packages/metric-${{ github.run_id }}.age'' --input "$RUNNER_TEMP/metric-relay.json"
        >/dev/null

        rm -f "$RUNNER_TEMP/metric-private.log"

        echo "::notice title=Metric status::read_only_rc=$rc"

        exit "$rc"

        '
  validate:
    if: inputs.rails == 'all' || inputs.rails == 'validate' || inputs.rails == 'audio'
      || inputs.rails == 'capture' || inputs.rails == 'simulation' || inputs.rails
      == 'discover'
    runs-on: ubuntu-24.04
    outputs:
      tracks: ${{ steps.package.outputs.tracks }}
    steps:
    - *id001
    - *id002
    - *id003
    - id: package
      env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
      run: 'bash pipeline/validate.sh

        '
  audio:
    needs:
    - validate
    - metric
    timeout-minutes: 35
    if: always() && needs.validate.result == 'success' && ((inputs.rails == 'audio'
      || inputs.rails == 'all') && needs.metric.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - if: inputs.mode == 'production'
      run: 'python3 -m pip install --no-cache-dir azure-cognitiveservices-speech faster-whisper

        '
    - env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: 'umask 077

        set +e

        (

        python3 - <<''PYFIX''

        from pathlib import Path

        p=Path(''pipeline/audio_sdk.py'');s=p.read_text();assert "encoding=''utf8-sig''"
        in s and ''max_workers=4'' in s

        p.write_text(s.replace("encoding=''utf8-sig''","encoding=''utf-8-sig''").replace(''max_workers=4'',''max_workers=1''))

        PYFIX

        bash pipeline/audio.sh

        ) > "$RUNNER_TEMP/audio-private.log" 2>&1

        rc=$?

        set -e

        age -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r
        age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o "$RUNNER_TEMP/audio-debug.age"
        "$RUNNER_TEMP/audio-private.log"

        jq -n --rawfile data "$RUNNER_TEMP/audio-debug.age" ''{message:"Encrypted
        diagnostic",content:($data|@base64),branch:"main"}'' > "$RUNNER_TEMP/debug.json"

        GH_TOKEN=''${{ github.token }}'' gh api -X PUT ''repos/${{ github.repository
        }}/contents/packages/audio-debug-${{ github.run_id }}.age'' --input "$RUNNER_TEMP/debug.json"
        >/dev/null

        rm -f "$RUNNER_TEMP/audio-private.log"

        echo "::notice title=Audio status::rc=$rc pending_qa=true"

        exit "$rc"

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: audio-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/audio/*.age
        if-no-files-found: error
        retention-days: 1
    concurrency:
      group: hila-f0-synthesis-resource
      cancel-in-progress: false
  capture:
    needs: validate
    if: always() && needs.validate.result == 'success' && (inputs.rails == 'all' ||
      inputs.rails == 'capture')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(needs.validate.outputs.tracks) }}
    steps:
    - *id001
    - *id002
    - *id003
    - env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        TRACK_ID: ${{ matrix.track }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
        JFROG_LAB_USER: ${{ secrets.JFROG_LAB_USER }}
        JFROG_LAB_PASSWORD: ${{ secrets.JFROG_LAB_PASSWORD }}
        SQUAREDUP_LAB_USER: ${{ secrets.SQUAREDUP_LAB_USER }}
        SQUAREDUP_LAB_PASSWORD: ${{ secrets.SQUAREDUP_LAB_PASSWORD }}
      run: 'bash pipeline/capture.sh

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: capture-${{ matrix.track }}-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/capture/*.age
        if-no-files-found: error
        retention-days: 1
  simulation:
    needs: validate
    if: always() && needs.validate.result == 'success' && (inputs.rails == 'all' ||
      inputs.rails == 'simulation')
    runs-on: ubuntu-24.04
    steps:
    - *id001
    - *id002
    - *id003
    - env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
      run: 'bash pipeline/simulation.sh

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: simulation-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/simulation/*.age
        if-no-files-found: error
        retention-days: 1
  timing:
    needs:
    - validate
    - audio
    if: always() && inputs.rails == 'all' && needs.validate.result == 'success' &&
      needs.audio.result == 'success'
    runs-on: ubuntu-24.04
    steps:
    - *id001
    - *id002
    - *id003
    - uses: actions/download-artifact@v4
      with:
        name: audio-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/incoming
    - env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
      run: 'bash pipeline/timing.sh

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: timing-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/timing/*.age
        if-no-files-found: error
        retention-days: 1
  discover:
    if: inputs.rails == 'discover'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        track:
        - jfrog
        - squaredup
    steps:
    - *id001
    - run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg
        age >/dev/null
    - &id005
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: /tmp/pw-deps
        key: playwright-core-1.63.0-node24
    - run: test -f /tmp/pw-deps/node_modules/playwright-core/package.json || npm install
        --prefix /tmp/pw-deps --no-audit --no-fund playwright-core@1.63.0
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        TRACK_ID: ${{ matrix.track }}
        JFROG_LAB_USER: ${{ secrets.JFROG_LAB_USER }}
        JFROG_LAB_PASSWORD: ${{ secrets.JFROG_LAB_PASSWORD }}
        SQUAREDUP_LAB_USER: ${{ secrets.SQUAREDUP_LAB_USER }}
        SQUAREDUP_LAB_PASSWORD: ${{ secrets.SQUAREDUP_LAB_PASSWORD }}
      run: "set -euo pipefail\numask 077\nsudo apt-get update -qq >/dev/null && sudo\
        \ apt-get install -y -qq age >/dev/null\nw=\"$RUNNER_TEMP/helpers\";mkdir\
        \ -p \"$w\"\nprintf '%s' \"$LAB_AGE_KEY\" > \"$w/key\"\nage -d -i \"$w/key\"\
        \ -o \"$w/source.tar.gz\" pipeline/updates-0930-v8.tar.gz.age\nrm -f \"$w/key\"\
        \necho '65f9e6dd70c052c55b150839a90cd60d0e91d62edb19159fc8d51a0a2a9d8c7f \
        \ '\"$w/source.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/source.tar.gz\"\
        \ -C \"$w\"\nset +e\nnode \"$w/discover-current.mjs\" > \"$w/private.log\"\
        \ 2>&1\nrc=$?\nset -e\nmkdir -p \"$RUNNER_TEMP/discovery-private\"\ncp \"\
        $w/private.log\" \"$RUNNER_TEMP/discovery-private/diagnostic.txt\"\ntar -czf\
        \ \"$w/discovery.tar.gz\" -C \"$RUNNER_TEMP/discovery-private\" .\nage -a\
        \ -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt\
        \ -o \"$w/review.age\" \"$w/discovery.tar.gz\"\nsplit -b 700000 -d -a 3 \"\
        $w/review.age\" \"$w/part-\"\nfor p in \"$w\"/part-*; do\n suffix=${p##*/part-}\n\
        \ jq -n --rawfile data \"$p\" '{message:\"Encrypted current vendor UI research\"\
        ,content:($data|@base64),branch:\"main\"}' > \"$w/upload.json\"\n GH_TOKEN='${{\
        \ github.token }}' gh api -X PUT 'repos/${{ github.repository }}/contents/packages/discovery-${{\
        \ github.run_id }}-${{ matrix.track }}-'\"$suffix.age\" --input \"$w/upload.json\"\
        \ >/dev/null\ndone\ncount=$(find \"$w\" -name 'part-*' | wc -l)\necho \"::notice\
        \ title=Private discovery::track=$TRACK_ID rc=$rc parts=$count selector_review_pending=true\"\
        \nrm -rf \"$w\" \"$RUNNER_TEMP/discovery-private\"\nexit \"$rc\"\n"
  attach:
    needs:
    - validate
    - audio
    - capture
    - simulation
    - timing
    if: always() && inputs.rails == 'all' && needs.validate.result == 'success' &&
      needs.audio.result == 'success' && needs.capture.result == 'success' && needs.simulation.result
      == 'success' && needs.timing.result == 'success'
    runs-on: ubuntu-24.04
    steps:
    - *id001
    - *id002
    - *id003
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-${{ inputs.package_id }}'
        path: ${{ runner.temp }}/lesson-cipher/incoming
    - env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
      run: 'bash pipeline/attach.sh

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: attached-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/attached/*.age
        if-no-files-found: error
        retention-days: 1
  compose:
    needs: attach
    runs-on: ubuntu-24.04
    steps:
    - *id001
    - *id002
    - *id003
    - uses: actions/download-artifact@v4
      with:
        name: attached-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/incoming
    - env:
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
      run: 'bash pipeline/compose.sh

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: composed-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/composed/*.age
        if-no-files-found: error
        retention-days: 1
  qa:
    needs: compose
    runs-on: ubuntu-24.04
    steps:
    - *id001
    - *id002
    - *id003
    - uses: actions/download-artifact@v4
      with:
        name: composed-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/incoming
    - env:
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
      run: 'bash pipeline/qa.sh

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: qa-${{ inputs.package_id }}
        path: ${{ runner.temp }}/lesson-cipher/qa/*.age
        if-no-files-found: error
        retention-days: 1
  recipient-proof:
    permissions:
      contents: read
      issues: write
    if: inputs.rails == 'recipient-proof' && inputs.mode == 'fixture'
    runs-on: ubuntu-24.04
    steps:
    - env:
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: 'set -euo pipefail

        umask 077

        sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null

        test -n "$LAB_AGE_KEY"

        printf ''%s'' "$LAB_AGE_KEY" > "$RUNNER_TEMP/age.key"

        recipient=$(age-keygen -y "$RUNNER_TEMP/age.key")

        rm -f "$RUNNER_TEMP/age.key"

        [[ $recipient =~ ^age1[0-9a-z]{58}$ ]]

        echo "::notice title=Public age recipient::$recipient"

        printf ''Public age recipient: `%s`\nRecipient proof only, not lesson QA approval.\n''
        "$recipient" > "$RUNNER_TEMP/recipient.txt"

        GH_TOKEN=''${{ github.token }}'' gh issue comment 2 --repo ''${{ github.repository
        }}'' --body-file "$RUNNER_TEMP/recipient.txt"

        '
  report:
    needs:
    - metric
    - validate
    - audio
    - capture
    - simulation
    - timing
    - attach
    - compose
    - qa
    - discover
    - recipient-proof
    - browser
    - hila-cache-test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: "set -euo pipefail\ngh api --paginate \"repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100\"\
        \ --jq '.jobs[]' > \"$RUNNER_TEMP/jobs.jsonl\"\npython3 - \"$RUNNER_TEMP/jobs.jsonl\"\
        \ \"$RUNNER_TEMP/report.txt\" <<'PYCODE'\nimport json,sys\nallowed={'metric','validate','audio','capture','simulation','timing','attach','compose','qa','discover','recipient-proof','browser'}\n\
        states={'success','failure','cancelled','skipped','timed_out','action_required','neutral','stale','startup_failure','in_progress','queued','completed','pending','waiting'}\n\
        lines=['Rail status only; not audiovisual QA approval.']\nfor raw in open(sys.argv[1]):\n\
        \    j=json.loads(raw); name=j['name'];base=name.split(' (',1)[0]\n    if\
        \ base not in allowed: continue\n    status=j.get('conclusion') or j.get('status')\n\
        \    if status not in states: status='unknown'\n    lines.append(f'{base}:\
        \ {status}')\n    for step in j.get('steps',[]):\n        status=step.get('conclusion')\
        \ or step.get('status')\n        if status not in states: status='unknown'\n\
        \        if status not in ('success','skipped'): lines.append(f\"  step {int(step['number'])}:\
        \ {status}\")\nlines.append('Private logs and media are not copied to public\
        \ comments.')\nopen(sys.argv[2],'w').write('\\n'.join(lines)+'\\n')\nPYCODE\n\
        gh issue comment 2 --repo \"$GH_REPO\" --body-file \"$RUNNER_TEMP/report.txt\"\
        \nwhile IFS= read -r line; do printf '::notice title=Lesson rail status::%s\\\
        n' \"$line\"; done < \"$RUNNER_TEMP/report.txt\"\n"
  browser:
    concurrency:
      group: playwright-public-read
      cancel-in-progress: false
    permissions:
      contents: write
    if: inputs.rails == 'browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - *id005
    - run: 'test -f /tmp/pw-deps/node_modules/playwright-core/package.json || npm
        install --prefix /tmp/pw-deps --no-audit --no-fund playwright-core@1.63.0

        '
    - env:
        BROWSER_URL: ${{ inputs.browser_url }}
      run: "mkdir -p /tmp/browser-private\nnode <<'JS'\nconst fs=require('fs'); const\
        \ {chromium}=require('/tmp/pw-deps/node_modules/playwright-core');\nconst\
        \ allowed=new Set(['example.com','docs.jfrog.com','docs.squaredup.com','playwright.dev']);\n\
        function ok(raw){try {const u=new URL(raw); return u.protocol==='https:' &&\
        \ !u.username && !u.password && u.port==='' && u.search==='' && u.hash===''\
        \ && raw.length<=2000 && allowed.has(u.hostname);}catch{return false;}}\n\
        (async()=>{\n  if(!ok(process.env.BROWSER_URL))process.exit(2);\n  const started=Date.now();\
        \ const browser=await chromium.launch({headless:true,channel:'chrome',chromiumSandbox:true});\
        \ const context=await browser.newContext({viewport:{width:1280,height:900}});\n\
        \  await context.route('**/*',route=>ok(route.request().url())?route.continue():route.abort());\n\
        \  const page=await context.newPage(); await page.goto(process.env.BROWSER_URL,{waitUntil:'domcontentloaded',timeout:45000});\n\
        \  if(!ok(page.url()))throw Error('navigation blocked');\n  console.log('::notice\
        \ title=Playwright timing::launch_to_navigation_ms='+String(Date.now()-started));\n\
        \  await page.screenshot({path:'/tmp/browser-private/page.png',fullPage:true});\n\
        \  fs.writeFileSync('/tmp/browser-private/page.txt',await page.locator('body').innerText());\n\
        \  await browser.close();\n})().catch(()=>process.exit(1));\nJS\n"
    - if: always()
      env:
        LAB_AGE_RECIPIENT: age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl
      run: 'set -eu

        sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq age >/dev/null

        mkdir -p /tmp/browser-cipher

        tar -czf /tmp/browser-result.tar.gz -C /tmp/browser-private .

        age -a -r "$LAB_AGE_RECIPIENT" -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt
        -o /tmp/browser-cipher/result.tar.gz.age /tmp/browser-result.tar.gz

        file=/tmp/browser-cipher/result.tar.gz.age

        jq -n --rawfile data "$file" ''{message:"Encrypted private browser result",content:($data|@base64),branch:"main"}''
        > /tmp/relay.json

        GH_TOKEN=''${{ github.token }}'' gh api -X PUT ''repos/${{ github.repository
        }}/contents/packages/browser-result-${{ github.run_id }}.age'' --input /tmp/relay.json
        >/dev/null

        rm -rf /tmp/browser-private /tmp/browser-result.tar.gz

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: browser-private-${{ github.run_id }}
        path: /tmp/browser-cipher/*.age
        if-no-files-found: error
        retention-days: 1
  hila-cache-test:
    if: inputs.rails == 'recipient-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: hila-f0-synthesis-resource
      cancel-in-progress: false
    steps:
    - *id001
    - *id002
    - *id003
    - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
      if: inputs.mode == 'production'
      with: *id006
    - env:
        PACKAGE_PATH: ${{ inputs.package_path }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PIPELINE_MODE: ${{ inputs.mode }}
        LAB_AGE_KEY: ${{ secrets.LAB_AGE_KEY }}
      run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/hila-cache-code\"\
        \ \"$RUNNER_TEMP/sentence-cache-private\"\nprintf '%s' \"$LAB_AGE_KEY\" >\
        \ \"$RUNNER_TEMP/hila-cache.key\"\nage -d -i \"$RUNNER_TEMP/hila-cache.key\"\
        \ -o \"$RUNNER_TEMP/hila-cache-source.tar.gz\" pipeline/hila-sentence-cache-source-v1.tar.gz.age\n\
        rm \"$RUNNER_TEMP/hila-cache.key\"\necho 'c8f535b26c2d52aba61301a679b2c38ac2a0e8f897bbb8b118e0dbf378fd1ff4\
        \  '\"$RUNNER_TEMP/hila-cache-source.tar.gz\" | sha256sum -c - >/dev/null\n\
        tar -xzf \"$RUNNER_TEMP/hila-cache-source.tar.gz\" -C \"$RUNNER_TEMP/hila-cache-code\"\
        \nsource pipeline/common.sh\npython3 pipeline/audio-ssml.py --package \"$PACKAGE_ROOT\"\
        \ --out \"$RUNNER_TEMP/lesson-ssml\"\npython3 -m pip install --no-cache-dir\
        \ azure-cognitiveservices-speech > \"$RUNNER_TEMP/sentence-cache-private/install.log\"\
        \ 2>&1\nset +e\npython3 \"$RUNNER_TEMP/hila-cache-code/benchmark.py\" > \"\
        $RUNNER_TEMP/sentence-cache-private/test.log\" 2>&1\nrc=$?\nset -e\nprintf\
        \ '%s' \"$rc\" > \"$RUNNER_TEMP/sentence-cache-private/exit-code.txt\"\ntar\
        \ -czf \"$RUNNER_TEMP/hila-cache-test.tar.gz\" -C \"$RUNNER_TEMP/sentence-cache-private\"\
        \ .\nage -a -r age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl\
        \ -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o \"\
        $RUNNER_TEMP/hila-cache-test.age\" \"$RUNNER_TEMP/hila-cache-test.tar.gz\"\
        \nsplit -b 700000 -d -a 3 \"$RUNNER_TEMP/hila-cache-test.age\" \"$RUNNER_TEMP/hila-part-\"\
        \nfor part in \"$RUNNER_TEMP\"/hila-part-*;do\n suffix=${part##*-};jq -n --rawfile\
        \ d \"$part\" '{message:\"Encrypted authorized Hila sentence cache and guard\
        \ test\",content:($d|@base64),branch:\"main\"}' > \"$RUNNER_TEMP/hila-put.json\"\
        \n GH_TOKEN='${{ github.token }}' gh api -X PUT \"repos/${{ github.repository\
        \ }}/contents/packages/hila-cache-${{ github.run_id }}-$suffix.age\" --input\
        \ \"$RUNNER_TEMP/hila-put.json\" >/dev/null\ndone\necho \"::notice title=Hila\
        \ cache test::rc=$rc; listening/seam review pending\"\nexit \"$rc\"\n"
'on':
