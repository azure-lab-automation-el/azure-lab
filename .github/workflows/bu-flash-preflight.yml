{"name":"Synthetic BU flash proposal preflight","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"browser-use":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/bu-flash-preflight'","runs-on":"ubuntu-24.04","timeout-minutes":45,"permissions":{"contents":"write","issues":"read"},"steps":[{"name":"Pinned public tools and encrypted source retrieval","shell":"bash","env":{"GH_TOKEN":"${{ github.token }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\";mkdir -p \"$w\"\ncurl --max-time 60 -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/age.tar.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/age.tar.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/age.tar.gz\" -C \"$w\"\nmkdir -p \"$RUNNER_TEMP/age\";cp -r \"$w/age\" \"$RUNNER_TEMP/age/age\"\npython3 - \"$w\" <<'PARTS'\nimport json,hashlib,base64,pathlib,subprocess,sys\np=pathlib.Path(sys.argv[1]);parts=[{'path': 'packages/bu-flash-source-v1-part-01.age', 'sha256': 'a7dc9ac467923d29aaf4313d9cea43e71c9d6ae94cd0e9a49325cd7c6a551458', 'bytes': 20000}, {'path': 'packages/bu-flash-source-v1-part-02.age', 'sha256': 'd26631b74126d0a538485814a8ab64d1ed14c56dc90d790dbf127c754a14a9e6', 'bytes': 20000}, {'path': 'packages/bu-flash-source-v1-part-03.age', 'sha256': 'cd988edab36016277c569a7bccabcca06b1c54353404de11df21c264373bf6f2', 'bytes': 20000}, {'path': 'packages/bu-flash-source-v1-part-04.age', 'sha256': 'd35e79a9fc943cf829c0adcff2756dcc51c9ec16713d11cf9faab3c55405ad7c', 'bytes': 20000}, {'path': 'packages/bu-flash-source-v1-part-05.age', 'sha256': 'c264be55bbf3fe7b4eff48c4e37751c49d597e54c02dbcdb90314c6b5e15979d', 'bytes': 20000}, {'path': 'packages/bu-flash-source-v1-part-06.age', 'sha256': '2e77ce709eae98ab3b14570b13926103d2f95e299623e39a4e5ccb2a9e5772ca', 'bytes': 8528}];out=bytearray()\nfor part in parts:\n r=subprocess.run(['gh','api','repos/azure-lab-automation-el/azure-lab/contents/'+part['path']],capture_output=True,check=True,timeout=25);b=base64.b64decode(json.loads(r.stdout)['content']);assert len(b)==part['bytes'] and hashlib.sha256(b).hexdigest()==part['sha256'];out.extend(b)\nassert hashlib.sha256(out).hexdigest()=='fa317d25fc9e46f504f5a2422c04868a44c28a904000e4c5d251db00b66d3562';(p/'source.age').write_bytes(out)\nPARTS\n"},{"name":"Private source integrity and key removal","shell":"bash","env":{"LAB_AGE_KEY":"${{ secrets.LAB_AGE_KEY }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/mcp-control-source\"\nprintf %s \"$LAB_AGE_KEY\" > \"$w/key\"\ntrap 'rm -f \"$w/key\";unset LAB_AGE_KEY' EXIT\n\"$w/age/age\" -d -i \"$w/key\" -o \"$w/source.tar.gz\" \"$w/source.age\" 2>\"$w/private-error\"\nrm -f \"$w/key\";unset LAB_AGE_KEY\nprintf 'df94d45fa31c0ad651ffa9c5e6ee10b194322c0caa2dfb1754169e84872021b3  %s\\n' \"$w/source.tar.gz\" | sha256sum -c - >/dev/null\npython3 - \"$w\" <<'PY'\nimport json,hashlib,tarfile,pathlib,sys\np=pathlib.Path(sys.argv[1]);out=p/'code';out.mkdir();allowed={'setup-control.sh': 'ccb3bc3ef6ea5eaff65626176003e4de5d4b72df1f669d8362f649659d97d1c2', 'runtime.sh': '48213f994247536ebf34e6daf45e1e6274f79653d402c6b5a17e8086265fc629', 'qualify-bu.py': '18042389c29681da36f06826931a4f23bb6d24de9627f7f21bd4b2d71db01807', 'Dockerfile': '01b7bcfa912812d03cd732d3dbf09cc918e97b0b515f96545ae2d32fdd05f20a', 'flash_preflight.py': '840d8e434f5385066b93400bd9ef0dd9abf91d3314cd17047dcfd226327cc9b6', 'cleanup-control.py': 'bb289c6f6ed3c70345b8b1e2bccf84b12065724b93bca7416eb30cb549fbef33', 'run-control.sh': 'cae052b7982ddd3970cdcc658463ede645b1029251af0fe3633a660f8f0ef1c2', 'fixture.py': '9424ce405c18a475254a638b91ce0e509c18edf2c91ff523a5742b38421d3e50', 'package-lock.json': '878fc0a2ffa0730f44772dc28c0