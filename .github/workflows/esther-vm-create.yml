name: Esther VM create and verify
on:
  workflow_dispatch:
    inputs:
      mode: { type: choice, options: [plan, apply], default: plan, description: 'plan = read-only; apply = create only what is missing' }
permissions:
  id-token: write
  contents: read
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-vm-create__create
      timeout: 20
      extra_env: |
        INPUT_MODE=${{ inputs.mode }}
        MODE=${{ inputs.mode }}
