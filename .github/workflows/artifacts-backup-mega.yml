name: artifacts-backup-mega
on:
  workflow_dispatch:
    inputs:
      delete_names: { description: 'artifact names to delete after verified backup (comma list, empty = none)', default: '' }
permissions: { actions: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: artifacts-backup-mega__run
      azure_login: false
      extra_env: |
        INPUT_DELETE_NAMES=${{ inputs.delete_names }}
