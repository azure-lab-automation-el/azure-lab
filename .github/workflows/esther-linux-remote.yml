name: esther-linux-remote
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'quota | create | both', required: true, default: 'both' }
permissions:
  id-token: write
  contents: read
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-linux-remote__run
      timeout: 22
      extra_env: |
        INPUT_MODE=${{ inputs.mode }}
