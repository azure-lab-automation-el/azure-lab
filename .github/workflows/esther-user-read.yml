name: esther-user-read
on:
  workflow_dispatch:
    inputs:
      upn: { description: 'User UPN (or prefix before @)', required: true }
permissions: { id-token: write, contents: read }
jobs:
  run:
    uses: ./.github/workflows/_lab-job.yml
    secrets: inherit
    with:
      entry: esther-user-read__read
      timeout: 5
      extra_env: |
        INPUT_UPN=${{ inputs.upn }}
