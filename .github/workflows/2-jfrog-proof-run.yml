name: lesson-jfrog-live-capture-proof
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch byte-verified capture source from private MEGA backup
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/v1.71.1/rclone-v1.71.1-linux-amd64.zip
          unzip -qj /tmp/rc.zip '*/rclone' -d /tmp
          export RCLONE_CONFIG_MEGA_TYPE=mega RCLONE_CONFIG_MEGA_USER="$MEGA_EMAIL"
          export RCLONE_CONFIG_MEGA_PASS="$(/tmp/rclone obscure "$MEGA_PASSWORD")"
          /tmp/rclone copyto 'mega:JFrog/L7-2026-09-28/source/2-lesson-capture-diagnostics-20260928-2207-89ea44be.tar.gz' /tmp/capture-source.tar.gz >/tmp/transfer-private.log 2>&1
          echo '89ea44beffe92d2820e71b504fa54542f96aeea01ca139c33cf96acc359fbf4e  /tmp/capture-source.tar.gz' | sha256sum -c - >/dev/null
          tar -xzf /tmp/capture-source.tar.gz capture.mjs
      - name: Install capture runtime
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Capture JFrog read-only repository menu
        env:
          JFROG_LAB_USER: ${{ secrets.JFROG_LAB_USER }}
          JFROG_LAB_PASSWORD: ${{ secrets.JFROG_LAB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$JFROG_LAB_USER" && test -n "$JFROG_LAB_PASSWORD"
          node capture.mjs "$RUNNER_TEMP/lesson-live-captures"
          ffprobe -v error -show_entries format=duration,size -of compact "$RUNNER_TEMP/lesson-live-captures/JFrog-repository-types.webm"
      - name: Private proof archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-jfrog-live-click-proof
          path: ${{ runner.temp }}/lesson-live-captures/
          retention-days: 1
