name: Read one fixed blue-tools run log (recipient/enum only, encrypted)
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  actions: read
jobs:
  go:
    if: github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/bluetools-readlog'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Extract enum markers from two fixed runs, encrypt to the review key only
        env:
          GH_TOKEN: ${{ github.token }}
          BT_TOKEN: ${{ secrets.LAB_WORKFLOW_PAT }}
        run: |
          set -uo pipefail
          # errexit stays on (runner default); expected nonzero substeps are handled explicitly with && / || true
          mkdir -p /tmp/m; OKN=0; st(){ echo "$1" > /tmp/m/stage.txt; }
          st L0
          OUT=$RUNNER_TEMP/out.txt; : > $OUT
          for RUN in 36999537069; do
            echo "== run $RUN" >> $OUT
            GH_TOKEN="$BT_TOKEN" gh api "repos/azure-lab-automation-el/blue-tools/actions/runs/$RUN" --jq '"run_status=" + .status + " run_conclusion=" + (.conclusion // "none")' >> $OUT 2>/dev/null && : || echo run_meta_read_failed >> $OUT
            GH_TOKEN="$BT_TOKEN" gh api "repos/azure-lab-automation-el/blue-tools/actions/runs/$RUN/logs" > $RUNNER_TEMP/l.zip 2>/dev/null && GRC=0 || GRC=$?; st "L0G${GRC}"
            ZB=$(wc -c < $RUNNER_TEMP/l.zip | tr -d ' ')
            echo "download_rc=$GRC zip_bytes=$ZB" >> $OUT
            if [ "$GRC" = 0 ] && [ "$ZB" -gt 0 ]; then
              unzip -tqq $RUNNER_TEMP/l.zip >/dev/null 2>&1 && ZT=0 || ZT=$?
              FC=$(unzip -Z1 $RUNNER_TEMP/l.zip 2>/dev/null | wc -l | tr -d ' ') || true; [ -n "$FC" ] || FC=0
              echo "zip_test_rc=$ZT file_count=$FC" >> $OUT
              if [ "$ZT" = 0 ] && [ "$FC" -gt 0 ]; then
                unzip -p $RUNNER_TEMP/l.zip > $RUNNER_TEMP/raw.txt 2>/dev/null && XR=0 || XR=$?
                sed 's/^[0-9TZ:.-]* //' $RUNNER_TEMP/raw.txt > $RUNNER_TEMP/l.txt && SR=0 || SR=$?
                EB=$(wc -c < $RUNNER_TEMP/l.txt | tr -d ' ')
                echo "extract_rc=$XR sed_rc=$SR text_bytes=$EB" >> $OUT
                st "L0U${EB}"
                if [ "$XR" = 0 ] && [ "$SR" = 0 ] && [ "$EB" -gt 0 ]; then
                  OKN=$((OKN+1)); echo READ_OK_INTEGRITY_OK >> $OUT
                  L=$(wc -l < $OUT | tr -d ' ')
                  grep -oE '^RECIPIENT=age1[0-9a-z]{58}$|^KEY_NOT_AGE_IDENTITY$' $RUNNER_TEMP/l.txt | sort | uniq -c >> $OUT || true
                  grep -oE 'HTTP [0-9]{3}' $RUNNER_TEMP/l.txt | sort | uniq -c >> $OUT || true
                  M=$(( $(wc -l < $OUT | tr -d ' ') - L ))
                  if [ "$M" = 0 ]; then echo "marker_lines=0 NO_MATCH" >> $OUT; else echo "marker_lines=$M" >> $OUT; fi
                else echo READ_FAILED_EXTRACT >> $OUT; fi
              else echo READ_FAILED_ZIP_INTEGRITY >> $OUT; fi
            else echo READ_FAILED_DOWNLOAD >> $OUT; fi
            st L0D
          done
          [ "$OKN" -ge 1 ] || { st LFAIL_NOREAD; exit 1; }
          st L1
          curl --max-time 90 -fsSL -o $RUNNER_TEMP/age.tgz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz || { st AFAIL; exit 1; }
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '$RUNNER_TEMP/age.tgz | sha256sum -c - >/dev/null || { st AFAIL; exit 1; }
          tar -xzf $RUNNER_TEMP/age.tgz -C $RUNNER_TEMP || { st AFAIL; exit 1; }
          F=packages/bluetools-readlog-${{ github.run_id }}.age
          AGEBIN=$RUNNER_TEMP/age/age
          [ -x "$AGEBIN" ] && X=1 || X=0
          [ -d packages ] && D=1 || D=0
          $AGEBIN -r age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt -o $F $OUT 2>/dev/null && RC=0 || RC=$?
          [ "$RC" = 0 ] && [ -s $F ] || { st "AFAIL_RC${RC}_X${X}_D${D}_O$(wc -c < $OUT | tr -d ' ')"; exit 1; }
          st A1
          python3 - "$F" > $RUNNER_TEMP/body.json 2>/dev/null <<'PY' || { st BFAIL; exit 1; }
          import base64,json,sys
          print(json.dumps({"message":"Encrypted blue-tools run log markers","content":base64.b64encode(open(sys.argv[1],'rb').read()).decode(),"branch":"main"}))
          PY
          python3 -c "import json;json.load(open('$RUNNER_TEMP/body.json'))" 2>/dev/null || { st BFAIL; exit 1; }
          st B1
          if gh api -X PUT "repos/${{ github.repository }}/contents/$F" --input $RUNNER_TEMP/body.json </dev/null >$RUNNER_TEMP/put.json 2>$RUNNER_TEMP/put.err; then
            LOCAL=$(git hash-object $F)
            GOT=$(gh api "repos/${{ github.repository }}/contents/$F?ref=main" --jq .sha </dev/null 2>/dev/null || true)
            if [ "$GOT" = "$LOCAL" ]; then st P201GET; else st P201GETMISMATCH; fi
          else
            C=$(grep -oE 'HTTP [0-9]{3}' $RUNNER_TEMP/put.err | head -1 | tr -d ' ') || true
            st "PFAIL${C:-NA}"
          fi
      - name: Stage marker as public artifact NAME only (fixed enum)
        id: stg
        if: always()
        run: |
          S=$(cat /tmp/m/stage.txt 2>/dev/null | tr -cd 'A-Za-z0-9_' | head -c 40); [ -n "$S" ] || S=NOSTAGE
          echo "name=rl3-$S" >> "$GITHUB_OUTPUT"; mkdir -p /tmp/m; echo "$S" > /tmp/m/stage.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ steps.stg.outputs.name }}
          path: /tmp/m/stage.txt
          retention-days: 1
