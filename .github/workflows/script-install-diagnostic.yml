{"name":"Own failed script install diagnostic","on":{"issue_comment":{"types":["created"]}},"permissions":{},"jobs":{"diagnostic":{"if":"github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.comment.user.login == 'azure-lab-automation-el' && github.event.comment.user.id == 332180512 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/script-install-diagnostic'","runs-on":"ubuntu-24.04","timeout-minutes":4,"permissions":{},"steps":[{"name":"Read only exact failed script installation logs, encrypted retention","shell":"bash","env":{"GH_TOKEN":"${{ secrets.LAB_WORKFLOW_PAT }}"},"run":"set -euo pipefail\numask 077\nw=\"$RUNNER_TEMP/script-install-diagnostic\";mkdir -p \"$w\"\ntrap 'rm -rf \"$w\";unset GH_TOKEN' EXIT\ncurl -fsSL --max-time 60 https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o \"$w/a.gz\"\nprintf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\\n' \"$w/a.gz\" | sha256sum -c - >/dev/null\ntar -xzf \"$w/a.gz\" -C \"$w\"\ngh api repos/azure-lab-automation-el/azure-lab/actions/runs/36872609317 > \"$w/run.json\"\ngh api repos/azure-lab-automation-el/azure-lab/actions/jobs/110403918396 > \"$w/job.json\"\npython3 - \"$w\" <<'CHECK'\nimport json,pathlib,sys\np=pathlib.Path(sys.argv[1]);r=json.load(open(p/'run.json'));j=json.load(open(p/'job.json'))\nassert r['id']==36872609317 and r['path']=='.github/workflows/lesson-chatops-bridge.yml' and r['event']=='issue_comment' and r['head_sha']=='582076d49cacfa95ac2650588429f5f1d6f9d852' and r['conclusion']=='failure'\nassert j['id']==110403918396 and j['run_id']==36872609317 and j['name']=='command' and j['conclusion']=='failure'\nCHECK\ngh api repos/azure-lab-automation-el/azure-lab/actions/jobs/110403918396/logs > \"$w/raw.log\"\npython3 - \"$w\" <<'RETAIN'\nimport os,pathlib,sys,json,re,base64,hashlib,subprocess,urllib.request,urllib.error\np=pathlib.Path(sys.argv[1]);raw=(p/'raw.log').read_bytes();assert 0<len(raw)<=512000\ntext=raw.decode('utf-8',errors='strict')\nfor k,v in os.environ.items():\n if any(t in k.upper() for t in ['TOKEN','PASSWORD','SECRET','PRIVATE','KEY']) and len(v)>=8:\n  for value in [v,base64.b64encode(v.encode()).decode()]:text=text.replace(value,'[REDACTED]')\ntext=re.sub(r'(?i)(authorization|cookie|set-cookie|x-api-key)\\s*[:=]\\s*[^\\r\\n]+',r'\\1: [REDACTED]',text)\ntext=re.sub(r'(?i)\\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AGE-SECRET-KEY-[A-Z0-9]+|AKIA[A-Z0-9]{16})\\b','[REDACTED]',text)\ntext=re.sub(r'https?://[^\\s<>\\\"\\']+','[URL REDACTED]',text)\nblob=json.dumps({'source_run':36872609317,'source_job':110403918396,'scope':'OWN_FAILED_SCRIPT_WORKFLOW_INSTALL_ONLY','complete_log':text,'raw_bytes':len(raw)}).encode()\ncipher=subprocess.check_output([str(p/'age/age'),'-r','age1drdclm2yu6m2sg04dnalqvk020ecnetcs0ntu5qyusum993eu4xqf8zzzl','-r','age1ysazhy7z52sn38qla0vqxh0d4lephsyx3u8nucqyhh3vvdtd3aqqxfcmkt'],input=blob,env={'PATH':'/usr/bin:/bin'});assert len(cipher)<=700000\npath='packages/script-install-diagnostic-36872609317.age';url='https://api.github.com/repos/azure-lab-automation-el/azure-lab/contents/'+path;headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}\ndef api(method='GET',data=None):\n q=urllib.request.Request(url,method=method,headers=headers,data=None if data is None else json.dumps(data).encode())\n with urllib.request.urlopen(q,timeout=20) as r:return json.load(r)\ntry:\n old=api();assert base64.b64decode(old['content'])==cipher,'immutable existingdiagnostic different HOLD'\nexcept urllib.error.HTTPError as e:\n if e.code!=404:raise\n api('PUT',{'branch':'main','message':'Encrypted bounded own failed script install diagnostic','content':base64.b64encode(cipher).decode()})\nback=api();assert base64.b64decode(back['content'])==cipher\nprint('::notice::script_install_diagnostic='+back['html_url']+' bytes='+str